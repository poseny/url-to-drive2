# .github/workflows/upload-url-to-drive.yml
name: Upload URL → Google Drive (Zip via temporary file)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת URL של הקובץ/דף להורדה"
        required: true
        default: "https://upload.wikimedia.org/wikipedia/commons/d/d6/Her_First_Kiss_%281919%29.webm"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ לפני .zip (אם ריק – ייקח משם הקובץ ב‑URL)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # --------------------------------------------------------------
      # 1️⃣  התקנת כלי עבודה + msmtp
      # --------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone chromium-browser zip curl msmtp msmtp-mta > /dev/null
          echo "✅ Dependencies installed"

      # --------------------------------------------------------------
      # 2️⃣  קונפיג rclone
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF
          echo "✅ rclone configured"

      # --------------------------------------------------------------
      # 3️⃣  חישוב שמות וקביעת סוג התוכן
      # --------------------------------------------------------------
      - name: Determine file names and type
        id: names
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
        run: |
          set -e

          raw_name=$(basename "$FILE_URL")
          raw_name=${raw_name%%\?*}
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          echo "🔤 Decoded name from URL = $decoded_name"

          is_html=false
          content_type=$(curl -sI -L "$FILE_URL" | grep -i '^content-type:' | head -1 | cut -d' ' -f2- | tr -d '\r')
          if [[ "$content_type" =~ text/html ]]; then
            is_html=true
          fi

          if [[ -n "$USER_NAME" ]]; then
            base_name="$USER_NAME"
          else
            base_name="${decoded_name%.*}"
            if [[ "$base_name" == "$decoded_name" ]] || [[ "$is_html" == "true" ]]; then
              base_name="page_$(date +%Y%m%d_%H%M%S)"
            fi
          fi

          if [[ "$is_html" == "true" ]]; then
            original_name="${base_name}.mhtml"
            zip_name="${base_name}.zip"
          else
            original_name="$decoded_name"
            zip_name="${base_name}.zip"
          fi

          remote_path="gdrive:${{ github.event.inputs.folder }}/$zip_name"

          echo "is_html=$is_html" >> $GITHUB_OUTPUT
          echo "original_name=$original_name" >> $GITHUB_OUTPUT
          echo "zip_name=$zip_name" >> $GITHUB_OUTPUT
          echo "remote_path=$remote_path" >> $GITHUB_OUTPUT
          echo "base_name=$base_name" >> $GITHUB_OUTPUT

          echo "📦 ZIP name on Drive      = $zip_name"
          echo "📁 Internal file name     = $original_name"
          echo "🌐 Is HTML page          = $is_html"

      # --------------------------------------------------------------
      # 4️⃣  מחיקת קובץ קיים
      # --------------------------------------------------------------
      - name: Delete old ZIP if exists
        env:
          REMOTE_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting previous $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous ZIP found"
          fi

      # --------------------------------------------------------------
      # 5️⃣  הורדה / לכידת דף → ZIP → העלאה
      # --------------------------------------------------------------
      - name: Download or capture page → zip → upload
        id: process
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          ORIGINAL_NAME: ${{ steps.names.outputs.original_name }}
          ZIP_NAME: ${{ steps.names.outputs.zip_name }}
          DEST_PATH: ${{ steps.names.outputs.remote_path }}
          IS_HTML: ${{ steps.names.outputs.is_html }}
          BASE_NAME: ${{ steps.names.outputs.base_name }}
          TARGET_FOLDER: ${{ github.event.inputs.folder }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPO_NAME: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR_NAME: ${{ github.actor }}
        run: |
          set -e
          set -o pipefail

          # נתיב לוג קבוע - שימוש במשתנה הסביבה של הראנר
          LOG_FILE="$RUNNER_TEMP/process.log"
          exec > >(tee -a "$LOG_FILE") 2>&1

          echo "🚀 Starting process at $(date)"
          echo "URL: $FILE_URL"
          echo "Is HTML: $IS_HTML"
          echo "Log file: $LOG_FILE"

          TMP_DIR=$(mktemp -d)
          TMP_ZIP="${TMP_DIR}/${ZIP_NAME}"
          echo "📂 Working directory = $TMP_DIR"

          if [[ "$IS_HTML" == "true" ]]; then
            MHTML_FILE="${TMP_DIR}/${ORIGINAL_NAME}"
            echo "🌐 Capturing web page as MHTML using Chromium headless..."
            echo "⏳ This may take 10-30 seconds..."

            chromium-browser \
              --headless=new \
              --disable-gpu \
              --no-sandbox \
              --disable-dev-shm-usage \
              --disable-web-security \
              --disable-features=VizDisplayCompositor \
              --run-all-compositor-stages-before-draw \
              --virtual-time-budget=30000 \
              --timeout=60000 \
              --save-page-as-mhtml="$MHTML_FILE" \
              "$FILE_URL" 2>&1 | tail -20

            if [[ ! -s "$MHTML_FILE" ]]; then
              echo "⚠️ First attempt failed, trying with --head=new..."
              chromium-browser \
                --head=new \
                --disable-gpu \
                --no-sandbox \
                --disable-dev-shm-usage \
                --disable-web-security \
                --virtual-time-budget=30000 \
                --timeout=60000 \
                --save-page-as-mhtml="$MHTML_FILE" \
                "$FILE_URL" 2>&1 | tail -20
            fi

            if [[ ! -s "$MHTML_FILE" ]]; then
              echo "❌ MHTML capture failed – file is empty or not created"
              ls -la "$TMP_DIR/"
              exit 1
            fi

            echo "✅ MHTML captured successfully ($(du -h "$MHTML_FILE" | cut -f1))"
            INTERNAL_FILE="$MHTML_FILE"
          else
            DOWNLOADED_FILE="${TMP_DIR}/downloaded_file"
            echo "⬇️ Downloading $FILE_URL → $DOWNLOADED_FILE"
            curl -L -s -o "$DOWNLOADED_FILE" "$FILE_URL" --max-time 300 --retry 3 --retry-delay 5

            if [[ ! -s "$DOWNLOADED_FILE" ]]; then
              echo "❌ Download failed or file is empty"
              exit 1
            fi

            echo "✅ Downloaded successfully ($(du -h "$DOWNLOADED_FILE" | cut -f1))"
            cp "$DOWNLOADED_FILE" "${TMP_DIR}/${ORIGINAL_NAME}"
            INTERNAL_FILE="${TMP_DIR}/${ORIGINAL_NAME}"
          fi

          echo "🗜️ Creating ZIP $TMP_ZIP with internal name '$ORIGINAL_NAME'"
          (cd "$TMP_DIR" && zip -j -q "$TMP_ZIP" "$ORIGINAL_NAME")

          if [[ ! -s "$TMP_ZIP" ]]; then
            echo "❌ Zip creation failed – file is empty"
            exit 1
          fi

          echo "✅ ZIP created ($(du -h "$TMP_ZIP" | cut -f1))"

          echo "🚀 Uploading ZIP to Drive: $DEST_PATH"
          rclone copy "$TMP_ZIP" "$DEST_PATH" --progress --drive-chunk-size 64M

          echo "✅ Finished – ZIP uploaded successfully at $(date)"

      # --------------------------------------------------------------
      # 6️⃣  שליחת אימייל במקרה כישלון (משתמש באותו $RUNNER_TEMP)
      # --------------------------------------------------------------
      - name: Send email on failure
        if: failure()
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          INPUT_URL: ${{ github.event.inputs.url }}
          INPUT_FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -e

          # אותו נתיב בדיוק כמו בשלב הקודם
          LOG_FILE="$RUNNER_TEMP/process.log"
          LOG_CONTENT=$(cat "$LOG_FILE" 2>/dev/null || echo "Log file not found: $LOG_FILE")

          echo "📧 Preparing failure email..."
          echo "Log file: $LOG_FILE"
          echo "Log size: $(wc -c < "$LOG_FILE" 2>/dev/null || echo 0) bytes"

          ERROR_SUMMARY=$(echo "$LOG_CONTENT" | grep -E "(❌|Error|FAILED|exit 1|failed)" -i | head -5 | sed 's/"/\\"/g' || echo "No specific error pattern found")

          # כתיבת קונפיג msmtp עם printf
          printf "defaults\nauth           on\ntls            on\ntls_trust_file /etc/ssl/certs/ca-certificates.crt\nlogfile        ~/.msmtp.log\n\naccount        gmail\nhost           smtp.gmail.com\nport           587\nfrom           p0556722432@gmail.com\nuser           p0556722432@gmail.com\npassword       %s\n\naccount default : gmail\n" "$EMAIL_PASSWORD" > ~/.msmtprc
          chmod 600 ~/.msmtprc

          # בניית האימייל ושליחה
          {
            echo "From: p0556722432@gmail.com"
            echo "To: p0556722432@gmail.com"
            echo "Subject: ❌ GitHub Actions Failed: $WORKFLOW"
            echo "Content-Type: text/plain; charset=UTF-8"
            echo ""
            echo "שלום,"
            echo ""
            echo "הריצה של ה-workflow **$WORKFLOW** נכשלה."
            echo ""
            echo "📋 פרטי הריצה:"
            echo "- ריפו: $REPO"
            echo "- מריץ: $ACTOR"
            echo "- קישור לריצה: $RUN_URL"
            echo "- זמן: $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "🔗 URL שעובד:"
            echo "$INPUT_URL"
            echo ""
            echo "📂 תיקיית יעד:"
            echo "$INPUT_FOLDER"
            echo ""
            echo "⚠️ תקציר שגיאה:"
            echo "$ERROR_SUMMARY"
            echo ""
            echo "📄 לוג מלא (100 שורות אחרונות):"
            echo "$LOG_CONTENT" | tail -100
            echo ""
            echo "---"
            echo "נשלח אוטומטית מ-GitHub Actions"
          } | msmtp --debug -a gmail p0556722432@gmail.com 2>&1

          echo "📧 Failure email sent successfully"

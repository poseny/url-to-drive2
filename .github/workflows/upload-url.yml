      - name: Download → (maybe MHTML) → zip → upload
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          BASE_NAME: ${{ steps.names.outputs.base_name }}
          ZIP_NAME: ${{ steps.names.outputs.zip_name }}
          DEST_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          set -e
          set -o pipefail

          TMP_DIR=$(mktemp -d)
          TMP_ZIP="${TMP_DIR}/${ZIP_NAME}"
          echo "📂 Working directory = $TMP_DIR"

          # ----------------------------------------------------------
          # 0️⃣  התקנת ספריות ש‑Chromium headless צריך (אם חסרות)
          # ----------------------------------------------------------
          sudo apt-get update -qq && sudo apt-get install -y -qq \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2 2>/dev/null | tail -5

          # ----------------------------------------------------------
          # 1️⃣  בדיקת Content-Type (עם fallback אם HEAD לא עובד)
          # ----------------------------------------------------------
          echo "🔎 Checking Content-Type..."
          CONTENT_TYPE=$(curl -sI -L --max-time 10 "$FILE_URL" 2>/dev/null | \
            grep -i '^content-type:' | head -1 | cut -d' ' -f2- | tr -d '\r\n')
          echo "📋 Content-Type: ${CONTENT_TYPE:-unknown}"

          INTERNAL_FILE=""

          if [[ "$CONTENT_TYPE" == text/html* ]]; then
            # ----------------------------------------------------------
            # 2️⃣  דף HTML → MHTML עם Chromium
            # ----------------------------------------------------------
            MHTML_FILE="${TMP_DIR}/${BASE_NAME}.mhtml"
            echo "🌐 Saving page as MHTML via Chromium..."

            # נסה לאתר את הבינארי הנכון
            CHROMIUM_BIN=$(command -v chromium || command -v chromium-browser || command -v google-chrome || command -v chrome)
            if [[ -z "$CHROMIUM_BIN" ]]; then
              echo "❌ Chromium/Chrome not found in PATH"
              exit 1
            fi
            echo "🔧 Using browser: $CHROMIUM_BIN"

            # הרצה עם timeout ו־output ללוג
            timeout 120 "$CHROMIUM_BIN" \
              --headless=new \
              --disable-gpu \
              --no-sandbox \
              --disable-dev-shm-usage \
              --virtual-time-budget=20000 \
              --run-all-compositor-stages-before-draw \
              --save-page-as-mhtml="$MHTML_FILE" \
              "$FILE_URL" 2>&1 | tee "${TMP_DIR}/chromium.log"

            CHROMIUM_EXIT=${PIPESTATUS[0]}
            if [[ $CHROMIUM_EXIT -ne 0 ]]; then
              echo "❌ Chromium exited with code $CHROMIUM_EXIT"
              echo "--- Last 50 lines of chromium.log ---"
              tail -50 "${TMP_DIR}/chromium.log"
              exit 1
            fi

            if [[ ! -s "$MHTML_FILE" ]]; then
              echo "❌ MHTML file not created or empty"
              exit 1
            fi
            INTERNAL_FILE="$MHTML_FILE"
            echo "✅ MHTML created: $(du -h "$MHTML_FILE" | cut -f1)"

          else
            # ----------------------------------------------------------
            # 3️⃣  לא HTML → הורדה רגילה
            # ----------------------------------------------------------
            ORIG_FILE="${TMP_DIR}/downloaded_file"
            echo "⬇️ Downloading binary file with curl..."
            curl -L -s --max-time 300 -o "$ORIG_FILE" "$FILE_URL"

            if [[ ! -s "$ORIG_FILE" ]]; then
              echo "❌ Download failed or file is empty"
              exit 1
            fi
            INTERNAL_FILE="$ORIG_FILE"
            echo "✅ File downloaded: $(du -h "$ORIG_FILE" | cut -f1)"
          fi

          # ----------------------------------------------------------
          # 4️⃣  יצירת ZIP
          # ----------------------------------------------------------
          EXT="${INTERNAL_FILE##*.}"
          ZIP_INTERNAL_NAME="${BASE_NAME}.${EXT}"
          
          echo "🗜️ Creating ZIP $TMP_ZIP with internal name '$ZIP_INTERNAL_NAME'"
          cp "$INTERNAL_FILE" "${TMP_DIR}/${ZIP_INTERNAL_NAME}"
          (cd "$TMP_DIR" && zip -j -q "$TMP_ZIP" "$ZIP_INTERNAL_NAME")

          if [[ ! -s "$TMP_ZIP" ]]; then
            echo "❌ Zip creation failed"
            exit 1
          fi

          # ----------------------------------------------------------
          # 5️⃣  העלאה ל‑Drive
          # ----------------------------------------------------------
          echo "🚀 Uploading ZIP to Drive: $DEST_PATH"
          rclone copy "$TMP_ZIP" "$DEST_PATH" --progress

          rm -rf "$TMP_DIR"
          echo "✅ Finished – ZIP uploaded successfully"

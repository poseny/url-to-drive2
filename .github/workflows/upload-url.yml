name: Upload URL → Google Drive (Zip via temporary file)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת URL של הקובץ/דף להורדה"
        required: true
        default: "https://huggingface.co/models?search=Ornith-1.0-9B-GGUF"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ לפני .zip (אם ריק – ייקח משם הקובץ ב‑URL)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      LOG_PATH: /home/runner/download_step.log

    steps:
      # --------------------------------------------------------------
      # 0️⃣  יצירת קובץ לוג ריק מיד בהתחלה
      # --------------------------------------------------------------
      - name: Setup log file
        run: |
          touch "$LOG_PATH"
          echo "📝 Log file created at $LOG_PATH"
          echo "=== Workflow started at $(date) ===" >> "$LOG_PATH"

      # --------------------------------------------------------------
      # 1️⃣  התקנת תלויות מערכת **מלאות** ל‑Chrome headless יציב
      # --------------------------------------------------------------
      - name: Install system dependencies for Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            # ספריות בסיסיות ש‑Chrome דורש
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2 libpango-1.0-0 libcairo2 libatspi2.0-0 \
            # פונטים (כולל עברית/אימוג'י)
            fonts-liberation fonts-noto-color-emoji fonts-dejavu-core \
            # D-Bus (להשתקת שגיאות חיבור)
            dbus libdbus-1-3 \
            # **קריטי**: דרייבר Vulkan תוכנה (llvmpipe/swrast) כדי ש‑vkCreateInstance לא ייכשל
            mesa-vulkan-drivers libvulkan1 \
            # כלי עזר
            curl unzip \
            --no-install-recommends
          
          # הפעלת D-Bus session bus מדומה (מונע שגיאות "Failed to connect to the bus")
          # נריץ אותו ברקע ונקבע משתנה סביבה
          mkdir -p /tmp/dbus-session
          dbus-daemon --session --address=unix:path=/tmp/dbus-session/bus --nofork --nopidfile --print-address > /tmp/dbus-session/address.txt 2>&1 &
          sleep 1
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/tmp/dbus-session/bus"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
          echo "✅ D-Bus session started at $DBUS_SESSION_BUS_ADDRESS"

      # --------------------------------------------------------------
      # 2️⃣  התקנת rclone + Chrome דרך action רשמי
      # --------------------------------------------------------------
      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Setup Chrome (headless-ready)
        uses: browser-actions/setup-chrome@latest
        id: chrome
        with:
          chrome-version: stable
          cache: true

      # --------------------------------------------------------------
      # 3️⃣  קונפיג rclone
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF

      # --------------------------------------------------------------
      # 4️⃣  חישוב שמות
      # --------------------------------------------------------------
      - name: Determine file names
        id: names
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
        run: |
          set -e
          raw_name=$(basename "$FILE_URL")
          raw_name=${raw_name%%\?*}
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          echo "🔤 Decoded name from URL = $decoded_name"

          if [[ -n "$USER_NAME" ]]; then
            base_name="$USER_NAME"
          else
            base_name="${decoded_name%.*}"
            [[ "$base_name" == "$decoded_name" ]] && base_name="page"
          fi

          zip_name="${base_name}.zip"
          echo "📦 ZIP name on Drive      = $zip_name"
          echo "base_name=$base_name"        >> $GITHUB_OUTPUT
          echo "decoded_name=$decoded_name"  >> $GITHUB_OUTPUT
          echo "zip_name=$zip_name"          >> $GITHUB_OUTPUT
          remote_path="gdrive:${{ github.event.inputs.folder }}/$zip_name"
          echo "remote_path=$remote_path"    >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 5️⃣  מחיקת ZIP קודם אם קיים
      # --------------------------------------------------------------
      - name: Delete old ZIP if it exists
        env:
          REMOTE_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting previous $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous ZIP found"
          fi

      # --------------------------------------------------------------
      # 6️⃣  הורדה חכמה עם Hard Timeout ו‑Chrome יציב
      # --------------------------------------------------------------
      - name: Download → (maybe MHTML) → zip → upload
        id: download_zip
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          BASE_NAME: ${{ steps.names.outputs.base_name }}
          ZIP_NAME: ${{ steps.names.outputs.zip_name }}
          DEST_PATH: ${{ steps.names.outputs.remote_path }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          DBUS_SESSION_BUS_ADDRESS: ${{ env.DBUS_SESSION_BUS_ADDRESS }}
        run: |
          set -e
          set -o pipefail

          # מפנה פלט לקובץ הלוג הגלובלי
          exec > >(tee -a "$LOG_PATH") 2>&1

          TMP_DIR=$(mktemp -d)
          TMP_ZIP="${TMP_DIR}/${ZIP_NAME}"
          echo "📂 Working directory = $TMP_DIR"

          # ---- 6.1 בדיקת Content-Type ----
          echo "🔎 Checking Content-Type..."
          CONTENT_TYPE=$(curl -sI -L "$FILE_URL" | grep -i '^content-type:' | head -1 | cut -d' ' -f2- | tr -d '\r\n')
          echo "📋 Content-Type: $CONTENT_TYPE"

          INTERNAL_FILE=""

          if [[ "$CONTENT_TYPE" == text/html* ]]; then
            # ---- 6.2 דף HTML → MHTML עם הגדרות יציבות מלאות ----
            MHTML_FILE="${TMP_DIR}/${BASE_NAME}.mhtml"
            USER_DATA_DIR="${TMP_DIR}/chrome-profile"
            mkdir -p "$USER_DATA_DIR"

            echo "🌐 Saving page as MHTML via Chrome (max 3 min wall-clock)..."
            
            # הרצת Chrome עם timeout של 180 שניות
            # דגלים קריטיים:
            # --disable-vulkan              : כיבוי מוחלט של Vulkan (מונע שגיאות vkCreateInstance)
            # --disable-software-rasterizer : לא להשתמש ברסטרייזר תוכנה ישן (SwiftShader מספיק)
            # --enable-unsafe-swiftshader   : מאפשר SwiftShader כ־fallback בטוח
            # --disable-dev-shm-usage       : חובה ב‑CI
            # --no-zygote --single-process  : יציבות נוספת ב‑Docker/CI
            # --virtual-time-budget=30000   : 30 שניות זמן וירטואלי
            # --window-size=1920,1080       : פריסה דסקטופ קבועה
            # --run-all-compositor-stages-before-draw : רינדור מלא לפני שמירה
            # DBUS_SESSION_BUS_ADDRESS      : מועבר מהשלב הקודם
            timeout 180 "$CHROME_PATH" \
              --headless=new \
              --disable-gpu \
              --disable-vulkan \
              --disable-software-rasterizer \
              --enable-unsafe-swiftshader \
              --no-sandbox \
              --disable-dev-shm-usage \
              --disable-extensions \
              --no-zygote \
              --single-process \
              --user-data-dir="$USER_DATA_DIR" \
              --virtual-time-budget=30000 \
              --window-size=1920,1080 \
              --run-all-compositor-stages-before-draw \
              --save-page-as-mhtml="$MHTML_FILE" \
              "$FILE_URL" 2>&1 | tail -60

            CHROME_EXIT=$?
            if [[ $CHROME_EXIT -eq 124 ]]; then
              echo "⏰ Chrome timed out after 180s (SIGTERM sent). Checking if MHTML was created..."
            elif [[ $CHROME_EXIT -ne 0 ]]; then
              echo "⚠️ Chrome exited with code $CHROME_EXIT"
            else
              echo "✅ Chrome finished normally"
            fi

            # אם נוצר קובץ לא ריק – נשתמש בו (אפילו אם חלקי)
            if [[ -s "$MHTML_FILE" ]]; then
              INTERNAL_FILE="$MHTML_FILE"
              echo "✅ MHTML created (size: $(du -h "$MHTML_FILE" | cut -f1))"
            else
              echo "❌ MHTML file missing or empty after Chrome run"
              echo "🔍 Debug: listing $TMP_DIR"
              ls -la "$TMP_DIR"
              exit 1
            fi
          else
            # ---- 6.3 קובץ רגיל (binaries) ----
            ORIG_FILE="${TMP_DIR}/downloaded_file"
            echo "⬇️ Downloading binary file with curl..."
            timeout 300 curl -L -s -o "$ORIG_FILE" "$FILE_URL"

            if [[ ! -s "$ORIG_FILE" ]]; then
              echo "❌ Download failed or file is empty"
              exit 1
            fi
            INTERNAL_FILE="$ORIG_FILE"
            echo "✅ File downloaded: $(du -h "$ORIG_FILE" | cut -f1)"
          fi

          # ---- 6.4 יצירת ZIP ----
          EXT="${INTERNAL_FILE##*.}"
          ZIP_INTERNAL_NAME="${BASE_NAME}.${EXT}"
          echo "🗜️ Creating ZIP $TMP_ZIP with internal name '$ZIP_INTERNAL_NAME'"
          cp "$INTERNAL_FILE" "${TMP_DIR}/${ZIP_INTERNAL_NAME}"
          (cd "$TMP_DIR" && zip -j -q "$TMP_ZIP" "$ZIP_INTERNAL_NAME")

          if [[ ! -s "$TMP_ZIP" ]]; then
            echo "❌ Zip creation failed"
            exit 1
          fi

          # ---- 6.5 העלאה ל‑Drive ----
          echo "🚀 Uploading ZIP to Drive: $DEST_PATH"
          rclone copy "$TMP_ZIP" "$DEST_PATH" --progress

          rm -rf "$TMP_DIR"
          echo "✅ Finished – ZIP uploaded successfully"

      # --------------------------------------------------------------
      # 7️⃣  שליחת אימייל עם הלוג **בכל כישלון של ה‑job**
      # --------------------------------------------------------------
      - name: Send failure email with log
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: p0556722432@gmail.com
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ GitHub Actions FAILED: Upload URL → Drive"
          to: p0556722432@gmail.com
          from: p0556722432@gmail.com
          body: ${{ env.LOG_PATH }}
          attachments: ${{ env.LOG_PATH }}

name: YouTube → Google Drive (ZIP) — loader.to resolver + email LOG (v9)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "קישור היוטיוב"
        required: true
        default: ""
      folder:
        description: "תיקיית יעד ב-Drive"
        required: true
        default: "YouTubeDownloads"
      filename:
        description: "שם בסיס ל-ZIP (ריק = אוטומטי)"
        required: false
        default: ""
      mode:
        description: "download = הורדה מלאה | probe = לבדוק فقط אילו אתרים עונים (שולח טבלה במייל)"
        required: false
        default: "download"
        type: choice
        options:
          - download
          - probe
      quality:
        description: "איכות וידאו (best = מהגבוהה ביותר הזמינה ולמטה)"
        required: false
        default: "best"
        type: choice
        options:
          - best
          - "1080"
          - "720"
          - "480"
          - "360"
env:
  EMAIL_TO: "p0556722432@gmail.com"
  EMAIL_FROM: "p0556722432@gmail.com"
  SMTP_SERVER: "smtp.gmail.com"
  SMTP_PORT: "587"
  EMAIL_USER: "p0556722432@gmail.com"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read

    steps:
      - name: Install dependencies & init log
        id: init
        shell: bash
        run: |
          set +e; set +u
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          SUMMARY_FILE="$RUNNER_TEMP/instance_summary.txt"
          : > "$LOG_FILE"; : > "$SUMMARY_FILE"
          exec >> "$LOG_FILE" 2>&1
          echo "=== YouTube -> loader.to -> Drive (v9: quality) ==="
          echo "Run: ${{ github.run_id }} | Repo: ${{ github.repository }}"
          echo "URL:     ${{ github.event.inputs.url }}"
          echo "Mode:    ${{ github.event.inputs.mode }}"
          echo "Quality: ${{ github.event.inputs.quality }}"
          echo "Started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="
          curl -fsSL https://rclone.org/install.sh | sudo bash; echo "rclone exit=$?"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip jq msmtp msmtp-mta curl; echo "deps exit=$?"
          echo "provider | http | detail | detail2 | result" > "$SUMMARY_FILE"
          echo "✅ dependencies installed"
          # פורמט GITHUB_OUTPUT הוא name=value — מחרוזת חופשית גורמת לשלב להיכשל
          echo "init=ok" >> "$GITHUB_OUTPUT" || echo "WARN: GITHUB_OUTPUT write failed"
          echo "init step finished ok"

      - name: Configure rclone
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          set +e; set +u
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          mkdir -p "$HOME/.config/rclone"
          cat > "$HOME/.config/rclone/rclone.conf" <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF
          rclone lsd gdrive: | head -5
          echo "✅ rclone configured"

      # ============================================================
      # Resolve & download — loader.to / p.savenow.to
      # ============================================================
      - name: Resolve link & download (loader.to)
        id: res0
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
          MODE: ${{ github.event.inputs.mode }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          set +e; set +u; set -o pipefail
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          SUMMARY_FILE="$RUNNER_TEMP/instance_summary.txt"
          OUT="$RUNNER_TEMP/success"; WORK="$RUNNER_TEMP/res0"
          exec >> "$LOG_FILE" 2>&1
          mkdir -p "$OUT" "$WORK"; rm -f "$OUT"/* 2>/dev/null
          echo "success=false" >> "$GITHUB_OUTPUT"
          echo "";          echo "===== Resolver: loader.to (p.savenow.to) ====="
          echo "mode = ${MODE:-download}"

          # ---- איכות: best = סולם נפילה 1080→720→480→360, ערך מפורש = 3 ניסיונות על אותה איכות ----
          Q_IN="${QUALITY:-best}"
          [[ "$Q_IN" =~ ^(best|[0-9]{3,4})$ ]] || Q_IN=best
          if [[ "$Q_IN" == "best" ]]; then QLADDER='1080 720 480 360'; else QLADDER="$Q_IN $Q_IN $Q_IN"; fi
          read -ra QS <<< "$QLADDER"
          echo "quality = $Q_IN | ladder: ${QS[*]}"

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          RESOLVED=""; GOT=""; TITLE=""

          VIDEO_ID=$(printf '%s' "$VIDEO_URL" | sed -E 's#.*[?&]v=([^?&]+).*#\1#')
          [[ "$VIDEO_ID" == "$VIDEO_URL" || -z "$VIDEO_ID" ]] && VIDEO_ID=$(printf '%s' "$VIDEO_URL" | sed -E 's#.*/(shorts|embed|v)/([^?&/]+).*#\2#')
          echo "VIDEO_ID = ${VIDEO_ID:-none}"
          echo "video_id=$VIDEO_ID" >> "$GITHUB_OUTPUT"

          row(){ printf '%s | %s | %s | %s | %s\n' "$1" "${2:--}" "${3:--}" "${4:--}" "${5:-fail}" >> "$SUMMARY_FILE"; }

          # ---------- resolver: loader.to / p.savenow.to ( אותו backend ) ----------
          # זרימת API מלאה שנמצאה בקוד פתוח ומאומתת ידנית:
          #   1) GET /ajax/download.php?url=..&format=720&api=..  -> {success,id,progress_url}
          #   2) GET <progress_url>                                -> progress=1000 + download_url
          #   3) download_url יושב על הדומיין של הספק (*.savenow.to) — אין חיבור ישיר ליוטיוב.
          SAVENOW_API='dfcb6d76f2f6a9894gjkege8a4ab232222'

          # מעבר מודעה: ה-link מפנה לעמוד מודעה (b.php -> רשת מודעות) ואז אמור להיפתח השער.
          # ניסיונות חוזרים + המתנה — חלק מה-link'ים נפתחים רק אחרי שהמודעה נטענת בפועל.
          ad_walk(){
            local jar="$WORK/cookies.txt" i
            for i in 1 2; do
              echo "  ad walk #$i..."
              curl -sS -m 30 -A "$UA" -e 'https://loader.to/' -c "$jar" -b "$jar" \
                   -o "$WORK/ad.html" -L --max-redirs 6 --max-time 30 \
                   -w '    walk http=%{http_code} eff=%{url_effective}\n' "$1" 2>/dev/null
              if [[ -s "$WORK/ad.html" && "$(stat -c%s "$WORK/ad.html")" -lt 5000 ]]; then
                echo "    ad page ($(stat -c%s "$WORK/ad.html")b): $(head -c 300 "$WORK/ad.html" | tr -c '[:print:]' '.')"
              fi
              sleep 5
            done
          }

          p_loaderto(){
            local r j id du i pu fmt="${Q:-1080}"
            echo "  quality request: format=$fmt"
            r=$(curl -sS -m 45 -A "$UA" -H 'Accept: application/json' -H 'Referer: https://loader.to/' -G \
                --data-urlencode "url=$VIDEO_URL" \
                --data-urlencode "copyright=0" --data-urlencode "allow_extended_duration=1" \
                --data-urlencode "add_info=1" --data-urlencode "no_merge=0" \
                --data-urlencode "format=$fmt" --data-urlencode "api=$SAVENOW_API" \
                "https://p.savenow.to/ajax/download.php" 2>/dev/null)
            if ! jq -e . <<<"$r" >/dev/null 2>&1; then row "savenow" "-" "${r:0:70}" "" "not-json"; return 1; fi
            # כותרת הסרטון מה-api (add_info=1) — אם הספק מחזיר, היא מקור מועדף לשם הקובץ
            [[ -z "$TITLE" ]] && TITLE=$(jq -r '.title // .info.title // empty' <<<"$r" 2>/dev/null)
            id=$(jq -r '.id // empty' <<<"$r")
            du=$(jq -r '.url // .download_url // empty' <<<"$r")
            if [[ -z "$id" && "$du" != http* ]]; then
              row "savenow" "-" "$(jq -c '{success,message,errors}' <<<"$r" 2>/dev/null | head -c 70)" "" "no-id"
              return 1
            fi
            if [[ "$du" == http* ]]; then RESOLVED="$du"; row "savenow" "200" "direct url" "" "resolved"; return 0; fi
            echo "  savenow job id=$id"
            pu=$(jq -r '.progress_url // empty' <<<"$r")
            [[ -z "$pu" ]] && pu="https://p.savenow.to/api/progress?id=$id"
            for i in $(seq 1 40); do
              j=$(curl -sS -m 30 -A "$UA" -H 'Accept: application/json' "$pu" 2>/dev/null)
              if jq -e . <<<"$j" >/dev/null 2>&1; then
                du=$(jq -r '.download_url // empty' <<<"$j")
                if [[ "$du" == http* ]]; then
                  echo "  progress=1000 -> ${du:0:120}"
                  ad_walk "$du"
                  RESOLVED="$du"; row "savenow" "200" "progress=1000" "fmt=$fmt" "resolved"; return 0
                fi
                if [[ "$(jq -r '.progress // 0' <<<"$j")" == "1000" ]]; then
                  row "savenow" "-" "$(jq -c '{success,text,message}' <<<"$j" 2>/dev/null | head -c 70)" "" "job-failed"
                  return 1
                fi
              fi
              sleep 3
            done
            row "savenow" "-" "timeout: ${j:0:60}" "" "no-url"
            return 1
          }

          # ---------- הורדה + ולידציה ----------
          dl_check(){
            local name="$1" R CODE CT EXT SZ EFF jar="$WORK/cookies.txt"
            echo "  downloading: ${RESOLVED:0:140}"
            R=$(curl -sS -L --max-redirs 8 --max-time 1800 -A "$UA" -e "$VIDEO_URL" -c "$jar" -b "$jar" \
                -o "$WORK/dl.bin" -w '%{http_code}|%{content_type}|%{url_effective}' "$RESOLVED" 2>>"$LOG_FILE")
            IFS='|' read -r CODE CT EFF <<< "$R"
            SZ=$(stat -c%s "$WORK/dl.bin" 2>/dev/null || echo 0)
            echo "  http=$CODE ct=$CT bytes=$SZ eff=${EFF:0:110}"

            # קישור של savenow שנחת על עמוד מודעה (HTML) -> פעם אחת מעבר מודעה ואז ניסוי נוסף
            if [[ "$RESOLVED" == *savenow.to* && ( "$SZ" -lt 200000 ) ]] && ! ffprobe -v error -show_entries stream=codec_type -of csv=p=0 "$WORK/dl.bin" 2>/dev/null | grep -q video; then
              echo "  landing page instead of media -> ad_walk + retry"
              ad_walk "$RESOLVED"
              R=$(curl -sS -L --max-redirs 10 --max-time 1800 -A "$UA" -e "https://loader.to/" -c "$jar" -b "$jar" \
                  -o "$WORK/dl.bin" -w '%{http_code}|%{content_type}|%{url_effective}' "$RESOLVED" 2>>"$LOG_FILE")
              IFS='|' read -r CODE CT EFF <<< "$R"
              SZ=$(stat -c%s "$WORK/dl.bin" 2>/dev/null || echo 0)
              echo "  retry http=$CODE ct=$CT bytes=$SZ eff=${EFF:0:110}"
            fi

            if [[ "$RESOLVED" == *.m3u8* || "$CT" == *mpegurl* ]]; then
              echo "  HLS stream -> ffmpeg"
              ffmpeg -y -loglevel error -i "$RESOLVED" -c copy "$OUT/video.mp4" 2>>"$LOG_FILE"
              if [[ -s "$OUT/video.mp4" ]]; then
                echo "success=true" >> "$GITHUB_OUTPUT"; echo "file=$OUT/video.mp4" >> "$GITHUB_OUTPUT"
                row "$name" "$CODE" "hls" "$(stat -c%s "$OUT/video.mp4")" "SUCCESS"
                echo "  ✅ hls -> $OUT/video.mp4"; GOT=1; return 0
              fi
              row "$name" "$CODE" "hls-failed" "" "fail"
              return 1
            fi

            if ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$WORK/dl.bin" 2>/dev/null | grep -q video; then
              case "$CT" in
                video/webm*)      EXT=webm ;;
                video/x-matroska*) EXT=mkv ;;
                *)                EXT=mp4 ;;
              esac
              mv "$WORK/dl.bin" "$OUT/video.$EXT"
              echo "success=true" >> "$GITHUB_OUTPUT"; echo "file=$OUT/video.$EXT" >> "$GITHUB_OUTPUT"
              row "$name" "$CODE" "$CT" "$(stat -c%s "$OUT/video.$EXT")" "SUCCESS"
              echo "  ✅ got $OUT/video.$EXT"
              GOT=1; return 0
            fi

            row "$name" "$CODE" "${CT:-?}" "$SZ" "not-video"
            echo "  ⚠️ not a video file -> body head:"
            head -c 600 "$WORK/dl.bin" 2>/dev/null | tr -c '[:print:]' '.'; echo
            rm -f "$WORK/dl.bin"
            return 1
          }

          # כל ניסיון יוצר job חדש אצל הספק — שער המודעה נפתח חלקית, ניסוי חוזר מגדיל את הסיכוי
          attempt_loaderto(){
            local n="$1" q="$2"
            Q="$q"
            echo ""; echo "======== loader.to attempt $n | format=$q ========"
            RESOLVED=""
            p_loaderto
            [[ "$RESOLVED" != http* ]] && { echo "  resolve failed (format=$q)"; return 1; }
            echo "  resolved -> ${RESOLVED:0:130}"
            if [[ "${MODE:-download}" == "probe" ]]; then
              echo "  (probe: לא מוריד)"
              return 0
            fi
            dl_check "loader.to"
          }

          echo "📋 resolver: loader.to (p.savenow.to) — איכות: ${QS[*]}"
          for AT in "${!QS[@]}"; do
            attempt_loaderto "$((AT+1))" "${QS[$AT]}" && break
            [[ "$AT" -lt $((${#QS[@]}-1)) ]] && { echo "  fresh job in 5s..."; sleep 5; }
          done
          [[ -n "$GOT" ]] && { echo ""; echo "🎉 SUCCESS via loader.to"; }
          echo ""
          echo "resolver finished | GOT=${GOT:-none} | mode=${MODE:-download}"

          # ---- שם קובץ ברירת מחדל: כותרת הסרטון, ואם לא הצלחנו לחלץ → מזהה הסרטון ----
          if [[ -z "$TITLE" && -n "$VIDEO_ID" ]]; then
            TITLE=$(curl -sS -m 20 -A "$UA" "https://www.youtube.com/oembed?url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3D${VIDEO_ID}&format=json" 2>/dev/null | jq -r '.title // empty' 2>/dev/null)
          fi
          if [[ -z "$TITLE" && -n "$VIDEO_ID" ]]; then
            TITLE=$(curl -sS -m 20 -A "$UA" "https://noembed.com/embed?url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3D${VIDEO_ID}" 2>/dev/null | jq -r '.title // empty' 2>/dev/null)
          fi
          TITLE_S=$(printf '%s' "$TITLE" | tr '\r\n\t' '   ' | sed -E 's#[\\/:*?"<>|]#_#g; s/^[ .]+//; s/[ .]+$//; s/_{2,}/_/g' | head -c 300 | iconv -f UTF-8 -t UTF-8 -c 2>/dev/null)
          [[ -z "$TITLE_S" ]] && TITLE_S="${VIDEO_ID:-video}"
          echo "title = $TITLE_S"
          echo "title=$TITLE_S" >> "$GITHUB_OUTPUT"

      - name: Verify result
        id: verify
        if: always()
        shell: bash
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set +e; set +u
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          OUT="$RUNNER_TEMP/success"
          if [[ "${MODE:-download}" == "probe" ]]; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "🔍 probe mode — הבדיקה הסתיימה, ר' טבלת ה-summary במייל"
            exit 0
          fi
          FILE=$(find "$OUT" -type f \( -iname '*.mp4' -o -iname '*.mkv' -o -iname '*.webm' \) 2>/dev/null | head -1)
          if [[ -n "$FILE" && -s "$FILE" ]]; then
            echo "success=true" >> "$GITHUB_OUTPUT"; echo "file=$FILE" >> "$GITHUB_OUTPUT"
            echo "✅ output: $FILE ($(stat -c%s "$FILE") bytes)"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"; echo "❌ no output file"
          fi

      - name: Zip and upload to Drive
        id: upload
        if: ${{ always() && !cancelled() && steps.verify.outputs.success == 'true' }}
        shell: bash
        env:
          INPUT_FILE: ${{ steps.verify.outputs.file }}
          FOLDER: ${{ github.event.inputs.folder }}
          USER_FILENAME: ${{ github.event.inputs.filename }}
          TITLE: ${{ steps.res0.outputs.title }}
          VIDEO_ID: ${{ steps.res0.outputs.video_id }}
        run: |
          set +e; set +u
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          TMP_DIR="$(mktemp -d)"; INPUT_EXT="${INPUT_FILE##*.}"
          if [[ -n "$USER_FILENAME" ]]; then BASE_NAME="$USER_FILENAME"
          elif [[ -n "${TITLE:-}" ]]; then BASE_NAME="$TITLE"
          elif [[ -n "${VIDEO_ID:-}" ]]; then BASE_NAME="$VIDEO_ID"
          else BASE_NAME="video"; fi
          # סניטיזי שלא קורע אותיות עבריות/יוניקוד, מסיר תווים אסורים בשמות קבצים
          BASE_NAME="$(printf '%s' "$BASE_NAME" | tr '\r\n\t' '   ' | sed -E 's#[\\/:*?"<>|]#_#g; s/^[ .]+//; s/[ .]+$//; s/_{2,}/_/g' | head -c 180 | iconv -f UTF-8 -t UTF-8 -c 2>/dev/null)"
          [[ -n "$BASE_NAME" ]] || BASE_NAME="video"
          ZIP_NAME="${BASE_NAME}.zip"; ZIP_FILE="$TMP_DIR/$ZIP_NAME"; INNER_FILE="$TMP_DIR/$BASE_NAME.$INPUT_EXT"
          cp "$INPUT_FILE" "$INNER_FILE"; zip -j -q "$ZIP_FILE" "$INNER_FILE"
          if [[ ! -s "$ZIP_FILE" ]]; then echo "STATUS=failed" >> "$GITHUB_OUTPUT"; exit 0; fi
          REMOTE_PATH="gdrive:${FOLDER}/${ZIP_NAME}"
          echo "upload -> $REMOTE_PATH"
          # rclone copy לנתיב קובץ יוצר תיקייה בשם הקובץ — משתמשים ב-copyto + purge של הישן
          rclone purge "$REMOTE_PATH" 2>/dev/null
          rclone purge "gdrive:${FOLDER}/video.zip" 2>/dev/null   # שארית הבאג ההיסטורי (תיקייה בתוך תיקייה)
          rclone copyto "$ZIP_FILE" "$REMOTE_PATH" --progress
          if [[ $? -eq 0 ]]; then
            echo "STATUS=success" >> "$GITHUB_OUTPUT"; echo "FILE_NAME=$ZIP_NAME" >> "$GITHUB_OUTPUT"
            echo "FILE_SIZE=$(stat -c%s "$ZIP_FILE" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
            echo "---- listing gdrive:${FOLDER}/ ----"
            rclone lsf "gdrive:${FOLDER}/" 2>/dev/null | head -20
          else
            echo "STATUS=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Send full log email
        if: always()
        shell: bash
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          STATUS: ${{ steps.upload.outputs.STATUS }}
          FILE_NAME: ${{ steps.upload.outputs.FILE_NAME }}
          FILE_SIZE: ${{ steps.upload.outputs.FILE_SIZE }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set +e; set +u
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"; SUMMARY_FILE="$RUNNER_TEMP/instance_summary.txt"
          [[ -z "${EMAIL_PASSWORD:-}" ]] && { echo "EMAIL_PASSWORD empty"; exit 0; }
          mkdir -p "$HOME/.msmtp"
          cat > "$HOME/.msmtprc" <<EOF
          defaults
          auth on
          tls on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt
          logfile $HOME/.msmtp.log
          account gmail
          host $SMTP_SERVER
          port $SMTP_PORT
          from $EMAIL_FROM
          user $EMAIL_USER
          password $EMAIL_PASSWORD
          account default : gmail
          EOF
          chmod 600 "$HOME/.msmtprc"
          if [[ "${MODE:-download}" == "probe" ]]; then
            SUBJECT="🔍 PROBE - אילו resolver sites עונים - ${{ github.repository }}"
            INTRO="מצב probe: נבדקו האתרים בלבד, לא בוצעה הורדה. הטבלת provider | http | detail | detail2 | result למטה היא התשובה."
          elif [[ "${STATUS:-}" == "success" ]]; then
            SUBJECT="✅ YouTube → Drive SUCCESS - ${{ github.repository }}"
            INTRO="ההורדה וההעלאה הושלו. ZIP: ${FILE_NAME} ($(numfmt --to=iec ${FILE_SIZE:-0} 2>/dev/null || echo ${FILE_SIZE:-?}) bytes)"
          else
            SUBJECT="❌ YouTube → Drive FAILED - ${{ github.repository }}"
            INTRO="ההורדה נכשלה. ר' את טבלת ה-providerSummary למטה — כל שורה היא אתר שנוסה ומה הוא החזיר."
          fi
          {
            printf 'Subject: %s\n' "$SUBJECT"; printf 'From: %s\n' "$EMAIL_FROM"; printf 'To: %s\n' "$EMAIL_TO"
            printf 'Content-Type: text/plain; charset=UTF-8\n\n'; printf '%s\n\n' "$INTRO"
            printf 'מקור: %s\n' '${{ github.event.inputs.url }}'
            printf 'Run: %s (%s) | mode: %s | quality: %s\n' '${{ github.run_id }}' '${{ github.run_number }}' "$MODE" '${{ github.event.inputs.quality }}'
            printf 'זמן: %s\n\n' "$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            printf '%s\n' '===== STEPS (ריק = השלב לא רץ) ====='
            printf 'init       = %s\n' '${{ steps.init.outputs.init }}'
            printf 'res0       = %s\n' '${{ steps.res0.outputs.success }}'
            printf 'verify     = %s\n' '${{ steps.verify.outputs.success }}'
            printf 'upload     = %s\n\n' '${{ steps.upload.outputs.STATUS }}'
            printf '%s\n' '===== PROVIDER SUMMARY ====='; cat "$SUMMARY_FILE" 2>/dev/null
            printf '\n%s\n' '===== FULL LOG ====='; cat "$LOG_FILE" 2>/dev/null
          } | msmtp -a gmail "$EMAIL_TO"
          echo "email sent"

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yt-proxy-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workflow_log.txt
            ${{ runner.temp }}/instance_summary.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Final result
        if: always()
        shell: bash
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [[ "${MODE:-download}" == "probe" ]]; then exit 0; fi
          if [[ "${{ steps.upload.outputs.STATUS }}" != "success" ]]; then exit 1; fi

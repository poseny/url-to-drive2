name: ניסויYouTube → Google Drive ZIP — Cobalt v3

on:
  workflow_dispatch:
    inputs:
      url:
        description: "YouTube URL"
        required: true
        default: ""
      folder:
        description: "Google Drive folder"
        required: true
        default: "YouTubeDownloads"
      filename:
        description: "ZIP base name (empty = auto)"
        required: false
        default: ""
      cobalt_instance:
        description: "Optional cobalt instance URL"
        required: false
        default: ""

env:
  EMAIL_TO: "p0556722432@gmail.com"
  EMAIL_FROM: "p0556722432@gmail.com"
  SMTP_SERVER: "smtp.gmail.com"
  SMTP_PORT: "587"
  EMAIL_USER: "p0556722432@gmail.com"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    steps:
      - name: Install dependencies and init log
        shell: bash
        run: |
          set +e
          set +u
          set -o pipefail
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          SUMMARY_FILE="$RUNNER_TEMP/instance_summary.txt"
          : > "$LOG_FILE"
          : > "$SUMMARY_FILE"
          exec >> "$LOG_FILE" 2>&1
          echo "=== YouTube -> Cobalt -> Google Drive ==="
          echo "Run: ${{ github.run_id }}"
          echo "URL: ${{ github.event.inputs.url }}"
          echo "Folder: ${{ github.event.inputs.folder }}"
          echo "Started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="
          curl -fsSL https://rclone.org/install.sh | sudo bash; echo "rclone install exit=$?"
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq zip ffmpeg msmtp msmtp-mta; echo "deps exit=$?"
          echo "host | probe | http_status | post_status | error_code" > "$SUMMARY_FILE"

      - name: Configure rclone
        shell: bash
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          set +e
          set +u
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          mkdir -p "$HOME/.config/rclone"
          cat > "$HOME/.config/rclone/rclone.conf" <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF
          rclone lsd gdrive: | head -5
          echo "rclone configuration finished"

      - name: Strategy A - Cobalt v11
        id: cobalt
        shell: bash
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
          USER_INSTANCE: ${{ github.event.inputs.cobalt_instance }}
        run: |
          set +e
          set +u
          set -o pipefail
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          SUMMARY_FILE="$RUNNER_TEMP/instance_summary.txt"
          OUT_DIR="$RUNNER_TEMP/success"
          WORK_DIR="$RUNNER_TEMP/cobalt-work"
          exec >> "$LOG_FILE" 2>&1
          mkdir -p "$OUT_DIR" "$WORK_DIR"
          rm -f "$OUT_DIR"/* 2>/dev/null
          echo "success=false" >> "$GITHUB_OUTPUT"
          echo ""
          echo "===== Strategy A: Cobalt ====="

          HOSTS=()
          add_host() {
            local v="${1:-}"
            v="${v#http://}"; v="${v#https://}"; v="${v%%/*}"; v="${v%%:*}"
            [[ -z "$v" ]] && return 0
            [[ "$v" != *.* ]] && return 0
            local e
            for e in "${HOSTS[@]}"; do [[ "$e" == "$v" ]] && return 0; done
            HOSTS+=("$v"); return 0
          }

          [[ -n "${USER_INSTANCE:-}" ]] && add_host "$USER_INSTANCE"

          SEED_HOSTS=(
            kityune.imput.net olly.imput.net nachos.imput.net sunny.imput.net
            blossom.imput.net noodle.imput.net cobalt-api.kwiatekmiki.com
            cobalt-7.kwiatekmiki.com cobalt-backend.canine.tools
            downloadapi.stuff.solutions capi.3kh0.net cobalt-api.meowing.de
            cobalt-api.clxxped.lol
          )
          for h in "${SEED_HOSTS[@]}"; do add_host "$h"; done

          LIST_URLS=(
            "https://instances.cobalt.best/instances.json"
            "https://instances.cobalt.best/api/instances"
            "https://codeberg.org/kwiat/instances/raw/branch/main/src/lib/input/instances.json"
          )
          for LU in "${LIST_URLS[@]}"; do
            echo "Trying list: $LU"
            BODY="$WORK_DIR/list.json"
            CODE=$(curl -sS --max-time 20 -H 'Accept: application/json' -o "$BODY" -w '%{http_code}' "$LU" 2>/dev/null)
            RC=$?
            if [[ "$RC" -ne 0 || ! -s "$BODY" ]]; then echo "  failed rc=$RC http=${CODE:-?}"; continue; fi
            jq -e . "$BODY" >/dev/null 2>&1 || { echo "  not JSON"; continue; }
            mapfile -t DISC < <(jq -r '.. | strings' "$BODY" 2>/dev/null | grep -Eo '([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}' 2>/dev/null | sort -u)
            for h in "${DISC[@]}"; do add_host "$h"; done
            echo "  added ${#DISC[@]} hostnames"
          done

          echo "Total candidates: ${#HOSTS[@]}"
          REQ=$(jq -cn --arg url "$VIDEO_URL" '{url:$url, videoQuality:"max", downloadMode:"auto", filenameStyle:"basic", alwaysProxy:true, localProcessing:"disabled"}' 2>/dev/null)
          [[ -z "$REQ" ]] && { echo "could not build request"; exit 0; }

          tried=0
          for H in "${HOSTS[@]}"; do
            [[ "$tried" -ge 10 ]] && break
            tried=$((tried+1))
            echo ""
            echo "-------- [$tried] $H --------"
            PF="$WORK_DIR/probe-$tried.txt"; RF="$WORK_DIR/resp-$tried.txt"

            curl -sS --max-time 25 -H 'Accept: application/json' -o "$PF" -w '%{http_code}' "https://$H/" > "$WORK_DIR/ph-$tried" 2>/dev/null
            if [[ -s "$PF" ]] && jq -e . "$PF" >/dev/null 2>&1; then probe="ok"; echo "Probe OK"; else probe="fail"; echo "Probe fail"; fi

            POST_HTTP=$(curl -sS --max-time 150 -H 'Accept: application/json' -H 'Content-Type: application/json' -X POST --data "$REQ" -o "$RF" -w '%{http_code}' "https://$H/" 2>/dev/null)
            echo "HTTP: ${POST_HTTP:-?}"
            echo "Raw: $(head -c 600 "$RF" 2>/dev/null || echo '<empty>')"

            post_status="empty"; error_code=""
            if [[ -s "$RF" ]] && jq -e . "$RF" >/dev/null 2>&1; then
              post_status=$(jq -r '.status // "empty"' "$RF" 2>/dev/null || echo empty)
              error_code=$(jq -r '.error.code // .code // empty' "$RF" 2>/dev/null || true)
            else
              post_status="non-json"
            fi
            printf '%s | %s | %s | %s | %s\n' "$H" "$probe" "${POST_HTTP:-?}" "$post_status" "${error_code:-}" >> "$SUMMARY_FILE"
            echo "status=$post_status error=${error_code:-none}"

            [[ "$post_status" == "tunnel" ]] || continue

            DL_URL=$(jq -r '.url // empty' "$RF" 2>/dev/null || true)
            [[ -n "$DL_URL" ]] || continue
            [[ "$DL_URL" == https://* ]] || continue
            DL_HOST=$(printf '%s\n' "$DL_URL" | awk -F/ '{print $3}' 2>/dev/null)
            [[ -n "$DL_HOST" ]] || continue
            if printf '%s\n' "$DL_HOST" | grep -qiE '(^|\.)(youtube\.com|youtu\.be|googlevideo\.com|google\.com|googleapis\.com|ytimg\.com)$'; then
              echo "Rejected: google host"; continue
            fi
            if [[ "$DL_HOST" != "$H" && "$DL_HOST" != *".$H" ]]; then
              echo "Rejected: not owned by $H"; continue
            fi

            echo "Downloading from $DL_HOST ..."
            curl -f -sS --max-time 1200 --proto '=https' --max-redirs 0 -o "$OUT_DIR/video.mp4" "$DL_URL"
            rc=$?
            size=$(stat -c%s "$OUT_DIR/video.mp4" 2>/dev/null || echo 0)
            if [[ "$rc" -eq 0 && "$size" -gt 100000 ]]; then
              echo "SUCCESS via $H ($size bytes)"
              echo "success=true" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "download failed rc=$rc size=$size"
            rm -f "$OUT_DIR/video.mp4"
          done
          echo ""; echo "Cobalt tried: $tried"

      - name: Strategy B - pastedownload fallback
        id: pastedown
        if: ${{ always() && steps.cobalt.outputs.success != 'true' }}
        continue-on-error: true
        shell: bash
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
        run: |
          set +e
          set +u
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          OUT_DIR="$RUNNER_TEMP/success"
          exec >> "$LOG_FILE" 2>&1
          echo ""
          echo "===== Strategy B: pastedownload.com ====="
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

          cat > "$RUNNER_TEMP/pw.js" <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs");
          const path = require("path");
          (async () => {
            const out = path.join(process.env.RUNNER_TEMP, "success");
            fs.mkdirSync(out, { recursive: true });
            const block = /(^|\.)(youtube\.com|youtu\.be|googlevideo\.com|google\.com|googleapis\.com|ytimg\.com|gstatic\.com)$/i;
            const browser = await chromium.launch({ args: ["--no-sandbox"] });
            const context = await browser.newContext({ acceptDownloads: true });
            await context.route("**/*", route => {
              try { const h = new URL(route.request().url()).hostname; if (block.test(h)) return route.abort(); } catch (_) {}
              return route.continue();
            });
            const page = await context.newPage();
            let downloaded = false;
            page.on("download", async d => {
              await d.saveAs(path.join(out, "video.mp4"));
              downloaded = true;
              console.log("browser download captured");
            });
            await page.goto("https://pastedownload.com/youtube-video2-downloader/", { waitUntil: "domcontentloaded", timeout: 60000 });
            console.log("title:", await page.title());
            const input = page.locator('input[type="url"], input[name*="url" i], input[type="text"], textarea').first();
            await input.fill(process.env.VIDEO_URL);
            console.log("url filled");
            const button = page.getByRole("button", { name: /download|start|submit|convert|get/i }).first();
            if (await button.count()) { await button.click(); } else { await input.press("Enter"); }
            console.log("submitted");
            const deadline = Date.now() + 180000;
            while (Date.now() < deadline && !downloaded) {
              const links = await page.locator("a[href]").evaluateAll(items =>
                items.map(a => ({ href: a.href, text: a.innerText || "", download: a.hasAttribute("download") })));
              for (const it of links) {
                let h = ""; try { h = new URL(it.href).hostname; } catch (_) {}
                const media = /\.(mp4|webm|mkv|m4v|mov)(\?|$)/i.test(it.href) || it.download || /download|save/i.test(it.text);
                if (!media || block.test(h)) continue;
                if (!/pastedownload\.com$/i.test(h)) { console.log("ignoring non-pastedownload:", h); continue; }
                console.log("result link:", it.href);
                await page.goto(it.href, { waitUntil: "domcontentloaded", timeout: 60000 }).catch(() => {});
              }
              await new Promise(r => setTimeout(r, 3000));
            }
            await browser.close();
            console.log(fs.existsSync(path.join(out, "video.mp4")) ? "got file" : "no video obtained");
            process.exit(0);
          })().catch(e => { console.log("error:", e && e.message); process.exit(0); });
          NODE
          node "$RUNNER_TEMP/pw.js"

      - name: Collect result
        id: collect
        if: always()
        shell: bash
        run: |
          set +e
          set +u
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          OUT_DIR="$RUNNER_TEMP/success"
          exec >> "$LOG_FILE" 2>&1
          file="$(find "$OUT_DIR" -type f \( -iname '*.mp4' -o -iname '*.webm' -o -iname '*.mkv' -o -iname '*.m4v' -o -iname '*.mov' \) 2>/dev/null | head -1)"
          if [[ -n "$file" && -s "$file" ]]; then
            echo "success=true" >> "$GITHUB_OUTPUT"; echo "file=$file" >> "$GITHUB_OUTPUT"
            echo "Output found: $file"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"; echo "No output file produced"
          fi

      - name: ZIP and upload to Drive
        id: upload
        if: ${{ steps.collect.outputs.success == 'true' }}
        shell: bash
        env:
          INPUT_FILE: ${{ steps.collect.outputs.file }}
          FOLDER: ${{ github.event.inputs.folder }}
          USER_FILENAME: ${{ github.event.inputs.filename }}
        run: |
          set +e
          set +u
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          TMP_DIR="$(mktemp -d)"
          INPUT_EXT="${INPUT_FILE##*.}"
          if [[ -n "$USER_FILENAME" ]]; then BASE_NAME="$USER_FILENAME"; else BASE_NAME="$(basename "${INPUT_FILE%.*}")"; fi
          BASE_NAME="$(printf '%s' "$BASE_NAME" | tr '/\\' '__' | tr -cd '[:alnum:] ._-')"
          BASE_NAME="${BASE_NAME:0:180}"; [[ -n "$BASE_NAME" ]] || BASE_NAME="youtube_video"
          ZIP_NAME="${BASE_NAME}.zip"
          ZIP_FILE="$TMP_DIR/$ZIP_NAME"
          INNER_FILE="$TMP_DIR/$BASE_NAME.$INPUT_EXT"
          cp "$INPUT_FILE" "$INNER_FILE"
          zip -j -q "$ZIP_FILE" "$INNER_FILE"
          if [[ ! -s "$ZIP_FILE" ]]; then echo "ZIP failed"; echo "STATUS=failed" >> "$GITHUB_OUTPUT"; exit 0; fi
          REMOTE_PATH="gdrive:${FOLDER}/${ZIP_NAME}"
          if rclone lsf "$REMOTE_PATH" >/dev/null 2>&1; then rclone delete "$REMOTE_PATH"; fi
          rclone copy "$ZIP_FILE" "$REMOTE_PATH" --progress
          if [[ $? -eq 0 ]]; then
            echo "STATUS=success" >> "$GITHUB_OUTPUT"
            echo "FILE_NAME=$ZIP_NAME" >> "$GITHUB_OUTPUT"
            echo "FILE_SIZE=$(stat -c%s "$ZIP_FILE" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          else
            echo "STATUS=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Send full log email
        if: always()
        shell: bash
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          STATUS: ${{ steps.upload.outputs.STATUS }}
          FILE_NAME: ${{ steps.upload.outputs.FILE_NAME }}
          FILE_SIZE: ${{ steps.upload.outputs.FILE_SIZE }}
        run: |
          set +e
          set +u
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          SUMMARY_FILE="$RUNNER_TEMP/instance_summary.txt"
          if [[ -z "${EMAIL_PASSWORD:-}" ]]; then echo "EMAIL_PASSWORD empty"; exit 0; fi
          cat > "$HOME/.msmtprc" <<EOF
          defaults
          auth on
          tls on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt
          logfile $HOME/.msmtp.log
          account gmail
          host $SMTP_SERVER
          port $SMTP_PORT
          from $EMAIL_FROM
          user $EMAIL_USER
          password $EMAIL_PASSWORD
          account default : gmail
          EOF
          chmod 600 "$HOME/.msmtprc"
          if [[ "${STATUS:-}" == "success" ]]; then
            SUBJECT="✅ YouTube → Drive SUCCESS - ${{ github.repository }}"
            INTRO="ההורדה וההעלאה הושלמו. ZIP: ${FILE_NAME} ($(numfmt --to=iec ${FILE_SIZE:-0} 2>/dev/null || echo ${FILE_SIZE:-?}) bytes)"
          else
            SUBJECT="❌ YouTube → Drive FAILED - ${{ github.repository }}"
            INTRO="ההורדה נכשלה. ר' סיכום ה-instances והלוג המלא למטה."
          fi
          {
            printf 'Subject: %s\n' "$SUBJECT"
            printf 'From: %s\n' "$EMAIL_FROM"
            printf 'To: %s\n' "$EMAIL_TO"
            printf 'Content-Type: text/plain; charset=UTF-8\n\n'
            printf '%s\n\n' "$INTRO"
            printf 'מקור: %s\n' '${{ github.event.inputs.url }}'
            printf 'Run: %s (%s)\n' '${{ github.run_id }}' '${{ github.run_number }}'
            printf 'זמן: %s\n\n' "$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            printf '%s\n' '===== INSTANCE SUMMARY ====='
            cat "$SUMMARY_FILE" 2>/dev/null
            printf '\n%s\n' '===== FULL LOG ====='
            cat "$LOG_FILE" 2>/dev/null
          } | msmtp -a gmail "$EMAIL_TO"
          echo "email sent"

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-workflow-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workflow_log.txt
            ${{ runner.temp }}/instance_summary.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Final result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.upload.outputs.STATUS }}" != "success" ]]; then exit 1; fi

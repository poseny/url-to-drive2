name: ניסויYouTube → Google Drive (ZIP) — via cobalt (no direct YouTube access)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "קישור היוטיוב"
        required: true
        default: ""
      folder:
        description: "תיקיית יעד ב-Drive"
        required: true
        default: "YouTubeDownloads"
      filename:
        description: "שם בסיס ל-ZIP (ריק = אוטומטי)"
        required: false
        default: ""
      cobalt_instance:
        description: "cobalt instance משלך (אופציונלי, למשל https://cobalt-api.example.com) - עדיף"
        required: false
        default: ""
      allow_direct_google:
        description: "לאפשר גישה ישירה לגוגל אם אין ברירה (false = אסור)"
        type: boolean
        required: false
        default: false

env:
  EMAIL_TO: "p0556722432@gmail.com"
  EMAIL_FROM: "p0556722432@gmail.com"
  SMTP_SERVER: "smtp.gmail.com"
  SMTP_PORT: "587"
  EMAIL_USER: "p0556722432@gmail.com"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read

    steps:
      # ------------------------------------------------------------
      # 0️⃣  התקנות + אתחול הלוג
      # ------------------------------------------------------------
      - name: Install dependencies & init log
        continue-on-error: true
        shell: bash
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "=== YouTube via cobalt -> Drive ==="
          echo "Run: ${{ github.run_id }} | Repo: ${{ github.repository }}"
          echo "URL: ${{ inputs.url }}"
          echo "Folder: ${{ inputs.folder }}"
          echo "========================================"
          curl -fsSL https://rclone.org/install.sh | sudo bash
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg msmtp msmtp-mta zip jq
          echo "OK dependencies installed"

      # ------------------------------------------------------------
      # 1️⃣  קונפיג rclone
      # ------------------------------------------------------------
      - name: Configure rclone
        continue-on-error: true
        shell: bash
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF
          rclone lsd gdrive: | head -5
          echo "OK rclone configured"

      # ------------------------------------------------------------
      # 2️⃣  אסטרטגיה A: cobalt API (הקובץ מגיע מהשרת של השירות)
      # ------------------------------------------------------------
      - name: "Strategy A: cobalt API"
        id: cobalt
        continue-on-error: true
        shell: bash
        env:
          VIDEO_URL: ${{ inputs.url }}
          COBALT_INSTANCE: ${{ inputs.cobalt_instance }}
          ALLOW_GOOGLE: ${{ inputs.allow_direct_google }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo ""
          echo "===== Strategy A: cobalt ====="
          mkdir -p "$RUNNER_TEMP/success" "$RUNNER_TEMP/co"
          cd "$RUNNER_TEMP/co"

          PAYLOAD=$(jq -n --arg u "$VIDEO_URL" '{
            url: $u,
            videoQuality: "max",
            downloadMode: "auto",
            filenameStyle: "basic",
            alwaysProxy: true,
            localProcessing: "disabled"
          }')

          # --- בניית רשימת instance-ים ---
          CANDS="$RUNNER_TEMP/co/candidates.txt"
          : > "$CANDS"

          if [[ -n "${COBALT_INSTANCE:-}" ]]; then
            echo "${COBALT_INSTANCE%/}" >> "$CANDS"
            echo "user instance: ${COBALT_INSTANCE%/}"
          fi

          for lst in \
            "https://instances.cobalt.best/api/instances" \
            "https://instances.cobalt.best/instances.json" \
            "https://instances.cobalt.best/instances" ; do
            echo "trying instance list: $lst"
            if curl -fsS --max-time 25 "$lst" -o list.json 2>/dev/null \
               && jq -e . list.json >/dev/null 2>&1; then
              jq -r '[..|strings]|.[]' list.json 2>/dev/null \
                | grep -Eo '^https://[A-Za-z0-9._-]+' \
                | sed 's#/$##' >> "$CANDS"
              echo "found $(wc -l < "$CANDS") candidate(s)"
              break
            fi
          done

          awk '!seen[$0]++ && length($0)>0' "$CANDS" > dedup.txt
          mv dedup.txt "$CANDS"
          echo "--- candidates ---"; head -25 "$CANDS"; echo "------------------"

          ok=false
          tried=0

          while read -r INST; do
            [[ -z "$INST" ]] && continue
            [[ $tried -ge 6 ]] && break

            # האם זה cobalt עם תמיכה ביוטיוב?
            META=$(curl -fsS --max-time 20 "$INST/" 2>/dev/null || true)
            if ! echo "$META" | jq -e '.cobalt.services | index("youtube")' >/dev/null 2>&1; then
              echo "skip $INST (not cobalt / no youtube)"
              continue
            fi

            tried=$((tried+1))
            echo ""
            echo "---- instance $tried: $INST ----"

            RESP=$(curl -sS --max-time 120 \
                     -H "Accept: application/json" \
                     -H "Content-Type: application/json" \
                     -H "User-Agent: github-actions/1.0" \
                     -d "$PAYLOAD" "$INST/" 2>/dev/null || true)

            echo "$RESP" | head -c 600; echo

            STATUS=$(echo "$RESP" | jq -r '.status // empty' 2>/dev/null || true)
            if [[ "$STATUS" != "tunnel" ]]; then
              echo "skip: status=${STATUS:-<none>} code=$(echo "$RESP" | jq -r '.error.code // empty' 2>/dev/null)"
              continue
            fi

            DURL=$(echo "$RESP" | jq -r '.url // empty' 2>/dev/null)
            FNAME=$(echo "$RESP" | jq -r '.filename // "video.mp4"' 2>/dev/null)

            [[ "$DURL" =~ ^https:// ]] || { echo "REJECT: not https -> $DURL"; continue; }

            if [[ "${ALLOW_GOOGLE:-false}" != "true" ]] && \
               echo "$DURL" | grep -Eiq 'googlevideo|youtube\.com|youtu\.be|ytimg\.com|googleusercontent'; then
              echo "REJECT: tunnel url points at google -> $DURL"
              continue
            fi

            DEST_HOST=$(echo "$DURL" | awk -F/ '{print $3}')
            echo "tunnel host: $DEST_HOST"

            EXT="${FNAME##*.}"
            [[ -z "$EXT" || "$EXT" == "$FNAME" ]] && EXT=mp4
            OUT="$RUNNER_TEMP/success/video.$EXT"

            echo "downloading tunnel url ..."
            if curl -fL --max-time 1200 --retry 2 --retry-delay 3 -o "$OUT" "$DURL"; then
              if [[ -s "$OUT" ]] && [[ "$(stat -c%s "$OUT")" -gt 100000 ]]; then
                echo "OK downloaded $(numfmt --to=iec "$(stat -c%s "$OUT")") from $INST"
                ok=true
                break
              fi
            fi
            echo "download failed from $INST"
          done < "$CANDS"

          if [[ "$ok" == "true" ]]; then
            echo "success=true"  >> "$GITHUB_OUTPUT"
            echo "OK Strategy A succeeded"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "FAIL Strategy A failed (tried $tried instance(s))"
          fi

      # ------------------------------------------------------------
      # 3️⃣  אסטרטגיה B (גיבוי): pastedownload.com בדפדפן headless
      # ------------------------------------------------------------
      - name: "Strategy B: pastedownload.com (headless browser)"
        id: browser
        if: ${{ always() && steps.cobalt.outputs.success != 'true' }}
        continue-on-error: true
        shell: bash
        env:
          VIDEO_URL: ${{ inputs.url }}
          ALLOW_GOOGLE: ${{ inputs.allow_direct_google }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo ""
          echo "===== Strategy B: pastedownload.com ====="

          mkdir -p "$RUNNER_TEMP/wa" "$RUNNER_TEMP/success"
          cd "$RUNNER_TEMP/wa"
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

          cat > download.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const VIDEO_URL = process.env.VIDEO_URL;
          const ALLOW_GOOGLE = process.env.ALLOW_GOOGLE === 'true';
          const OUT_DIR = path.join(process.env.RUNNER_TEMP, 'success');
          const GOOGLE_RE = /(^|\.)(googlevideo\.com|youtube\.com|youtu\.be|ytimg\.com|googleusercontent\.com|google\.com)$/i;
          fs.mkdirSync(OUT_DIR, { recursive: true });

          async function saveDownload(download, tag) {
            try {
              const ext = path.extname(download.suggestedFilename() || '') || '.mp4';
              const p = path.join(OUT_DIR, 'video' + ext);
              await download.saveAs(p);
              console.log('[ok] captured download (' + tag + ') -> ' + p);
            } catch (e) {
              console.log('[warn] saveAs failed: ' + e.message);
            }
          }

          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
            const ctx = await browser.newContext({
              acceptDownloads: true,
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36',
            });

            // לא נוגעים בגוגל בכלל, אלא אם המשתמש התיר במפורש
            if (!ALLOW_GOOGLE) {
              await ctx.route('**/*', route => {
                try {
                  const h = new URL(route.request().url()).hostname;
                  if (GOOGLE_RE.test(h)) {
                    console.log('[blocked direct google request] ' + h);
                    return route.abort();
                  }
                } catch (e) { /* ignore */ }
                return route.continue();
              });
            } else {
              console.log('[warn] allow_direct_google=true - the runner may contact Google');
            }

            let found = false;
            ctx.on('page', p => p.on('download', async d => { found = true; await saveDownload(d, 'popup'); }));
            const page = await ctx.newPage();
            page.on('download', async d => { found = true; await saveDownload(d, 'main'); });
            page.setDefaultTimeout(20000);

            console.log('goto pastedownload.com ...');
            await page.goto('https://pastedownload.com/youtube-video2-downloader/', {
              waitUntil: 'domcontentloaded', timeout: 60000
            });
            await page.waitForTimeout(4000);
            console.log('page title: ' + (await page.title()));

            const selectors = ['input[type="url"]','input[type="search"]','input[type="text"]','input[name*="url" i]','textarea'];
            let box = null;
            for (const s of selectors) {
              const loc = page.locator(s).first();
              if ((await loc.count()) && (await loc.isVisible().catch(() => false))) { box = loc; break; }
            }
            if (!box) { console.log('[error] URL input not found'); await browser.close(); process.exit(1); }
            await box.fill(VIDEO_URL);
            console.log('[ok] URL pasted');

            const btn = page.locator('button, input[type="submit"]')
              .filter({ hasText: /download|start|convert|get|search|go/i }).first();
            try {
              if (await btn.count()) await btn.click({ timeout: 8000 });
              else await box.press('Enter');
            } catch (e) {
              console.log('[warn] click failed, pressing Enter');
              await box.press('Enter').catch(() => {});
            }
            console.log('[ok] submitted, waiting for result ...');

            const deadline = Date.now() + 150000;
            let linkIdx = -1, linkHref = '';
            while (Date.now() < deadline && !found) {
              await page.waitForTimeout(4000);
              const anchors = page.locator('a[href]');
              const n = await anchors.count();
              for (let i = 0; i < n; i++) {
                const href = (await anchors.nth(i).getAttribute('href')) || '';
                const txt = ((await anchors.nth(i).innerText().catch(() => '')) || '').toLowerCase();
                if (/googlevideo\.com|videoplayback|\.mp4|\.webm|\.mkv/i.test(href) ||
                    /download|1080p|720p|\(mp4\)/i.test(txt)) {
                  linkIdx = i; linkHref = href; break;
                }
              }
              if (linkIdx >= 0) break;
            }

            if (!found && linkIdx >= 0) {
              console.log('[ok] result link: ' + linkHref.slice(0, 140));
              let hrefHost = '';
              try { hrefHost = new URL(linkHref).hostname; } catch (e) {}
              if (!ALLOW_GOOGLE && GOOGLE_RE.test(hrefHost)) {
                console.log('[abort] the site handed us a direct Google link (' + hrefHost + '); refusing it.');
                await browser.close();
                process.exit(1);
              }
              const anchor = page.locator('a[href]').nth(linkIdx);
              const [dl] = await Promise.all([
                page.waitForEvent('download', { timeout: 90000 }).catch(() => null),
                anchor.click({ timeout: 10000 }).catch(() => null),
              ]);
              if (dl) await saveDownload(dl, 'clicked');
            }

            await browser.close();
            const good = fs.readdirSync(OUT_DIR)
              .filter(f => f.startsWith('video'))
              .find(f => fs.statSync(path.join(OUT_DIR, f)).size > 100000);
            if (good) {
              console.log('[ok] FINAL: ' + good + ' ' + fs.statSync(path.join(OUT_DIR, good)).size + ' bytes');
              process.exit(0);
            }
            console.log('[error] no video obtained from pastedownload.com');
            process.exit(1);
          })().catch(e => { console.log('[error] ' + e.message); process.exit(1); });
          JS

          if node download.js; then
            echo "success=true"  >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------
      # 4️⃣  איסוף התוצאה
      # ------------------------------------------------------------
      - name: Collect result
        id: collect
        if: always()
        shell: bash
        env:
          USER_FILENAME: ${{ inputs.filename }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo ""
          echo "===== Collecting result ====="

          SRC=$(find "$RUNNER_TEMP/success" -type f -size +10k \
                  ! -name '*.part' ! -name '*.ytdl' ! -name '*.tmp' 2>/dev/null | head -1)

          if [[ -z "$SRC" ]]; then
            echo "have_file=false" >> "$GITHUB_OUTPUT"
            echo "FAIL no output file produced"
            exit 0
          fi
          echo "   file: $SRC ($(numfmt --to=iec "$(stat -c%s "$SRC")"))"

          if [[ -n "${USER_FILENAME:-}" ]]; then
            BASE="$USER_FILENAME"
          else
            BASE="$(basename "$SRC")"; BASE="${BASE%.*}"
          fi
          BASE="${BASE//\//_}"; BASE="${BASE:0:150}"
          EXT="${SRC##*.}"

          WORK_DIR="$RUNNER_TEMP/zipbuild"
          rm -rf "$WORK_DIR"; mkdir -p "$WORK_DIR"
          cp "$SRC" "$WORK_DIR/${BASE}.${EXT}"

          echo "base=$BASE"           >> "$GITHUB_OUTPUT"
          echo "ext=$EXT"             >> "$GITHUB_OUTPUT"
          echo "work_dir=$WORK_DIR"   >> "$GITHUB_OUTPUT"
          echo "filename=${BASE}.zip" >> "$GITHUB_OUTPUT"
          echo "have_file=true"       >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 5️⃣  ZIP → Drive
      # ------------------------------------------------------------
      - name: Zip + upload to Drive
        id: upload
        if: steps.collect.outputs.have_file == 'true'
        shell: bash
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo ""
          echo "===== Zip + Upload ====="

          WORK_DIR="${{ steps.collect.outputs.work_dir }}"
          BASE="${{ steps.collect.outputs.base }}"
          EXT="${{ steps.collect.outputs.ext }}"
          ZIP_NAME="${{ steps.collect.outputs.filename }}"
          TMP_ZIP="$RUNNER_TEMP/$ZIP_NAME"
          REMOTE_PATH="gdrive:${FOLDER}/${ZIP_NAME}"

          ( cd "$WORK_DIR" && zip -j -q "$TMP_ZIP" "${BASE}.${EXT}" )
          [[ -s "$TMP_ZIP" ]] || { echo "FAIL zip creation failed"; exit 1; }
          ZIP_SIZE=$(stat -c%s "$TMP_ZIP")
          echo "   ZIP: $ZIP_NAME ($(numfmt --to=iec "$ZIP_SIZE"))"

          if rclone lsf "$REMOTE_PATH" >/dev/null 2>&1; then
            echo "   deleting old $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          fi

          if rclone copy "$TMP_ZIP" "$REMOTE_PATH" --progress; then
            echo "OK uploaded to $REMOTE_PATH"
            echo "uploaded=true"       >> "$GITHUB_OUTPUT"
            echo "zip_size=$ZIP_SIZE"  >> "$GITHUB_OUTPUT"
          else
            echo "FAIL rclone upload failed"
            echo "uploaded=false"      >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ------------------------------------------------------------
      # 6️⃣  מייל עם הלוג
      # ------------------------------------------------------------
      - name: Send log email
        if: always()
        shell: bash
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          UPLOADED: ${{ steps.upload.outputs.uploaded }}
          ZIP_NAME: ${{ steps.collect.outputs.filename }}
          ZIP_SIZE: ${{ steps.upload.outputs.zip_size }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          echo "preparing email ..."

          if [[ -z "${EMAIL_PASSWORD:-}" ]]; then
            echo "WARN EMAIL_PASSWORD secret is empty - skipping email"
            exit 0
          fi

          mkdir -p ~/.msmtp
          cat > ~/.msmtprc <<EOF
          defaults
          auth on
          tls on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt
          logfile ~/.msmtp.log
          account gmail
          host $SMTP_SERVER
          port $SMTP_PORT
          from $EMAIL_FROM
          user $EMAIL_USER
          password $EMAIL_PASSWORD
          account default : gmail
          EOF
          chmod 600 ~/.msmtprc

          if [[ "$UPLOADED" == "true" ]]; then
            SUBJECT="SUCCESS - YouTube -> Drive - ${{ github.repository }}"
            BODY="ההורדה וההעלאה הושלמו בהצלחה.\n\n"
            BODY+="ZIP: $ZIP_NAME\n"
            BODY+="גודל: $(numfmt --to=iec ${ZIP_SIZE:-0} 2>/dev/null)\n"
            BODY+="תיקייה: ${{ inputs.folder }}\n"
          else
            SUBJECT="FAILED - YouTube -> Drive - ${{ github.repository }}"
            BODY="ההורדה נכשלה. מצורף לוג.\n\n"
          fi
          BODY+="מקור: ${{ inputs.url }}\n"
          BODY+="Run: ${{ github.run_id }} (${{ github.run_number }})\n"
          BODY+="$(date -u +'%Y-%m-%d %H:%M:%S UTC')\n"
          BODY+="\n--- Last 60 lines of log ---\n"
          BODY+=$(tail -60 "$LOG_FILE")

          echo -e "Subject: $SUBJECT\nFrom: $EMAIL_FROM\nTo: $EMAIL_TO\nContent-Type: text/plain; charset=UTF-8\n\n$BODY" \
            | msmtp -a gmail "$EMAIL_TO"
          echo "OK email sent to $EMAIL_TO"

      # ------------------------------------------------------------
      # 7️⃣  לוג כ-Artifact
      # ------------------------------------------------------------
      - name: Upload log as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-log-${{ github.run_id }}
          path: ${{ runner.temp }}/workflow_log.txt
          retention-days: 7
          if-no-files-found: warn

      # ------------------------------------------------------------
      # 8️⃣  סיכום סופי
      # ------------------------------------------------------------
      - name: Final summary
        if: always()
        shell: bash
        env:
          UPLOADED: ${{ steps.upload.outputs.uploaded }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          echo "=== FINAL SUMMARY ==="
          echo "Uploaded: ${UPLOADED:-false}"
          echo "=== Last 80 log lines ==="
          tail -80 "$LOG_FILE" 2>/dev/null || true
          if [[ "${UPLOADED:-false}" != "true" ]]; then
            echo "FAIL Job failed - see email or log artifact"
            exit 1
          fi
          echo "OK Done"

name: ניסויYouTube → Google Drive (ZIP) — via Invidious proxy

on:
  workflow_dispatch:
    inputs:
      url:
        description: "קישור היוטיוב"
        required: true
        default: ""
      folder:
        description: "תיקיית יעד ב-Drive"
        required: true
        default: "YouTubeDownloads"
      filename:
        description: "שם בסיס ל-ZIP (ריק = אוטומטי)"
        required: false
        default: ""
      invidious_instance:
        description: "instance משלך (אופציונלי, מומלץ) — למשל https://invidious.example.com"
        required: false
        default: ""

env:
  EMAIL_TO: "p0556722432@gmail.com"
  EMAIL_FROM: "p0556722432@gmail.com"
  SMTP_SERVER: "smtp.gmail.com"
  SMTP_PORT: "587"
  EMAIL_USER: "p0556722432@gmail.com"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read

    steps:
      # ------------------------------------------------------------
      # 0️⃣  התקנות + אתחול הלוג
      # ------------------------------------------------------------
      - name: Install dependencies & init log
        shell: bash
        run: |
          set +e; set +u
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          SUMMARY_FILE="$RUNNER_TEMP/instance_summary.txt"
          : > "$LOG_FILE"; : > "$SUMMARY_FILE"
          exec >> "$LOG_FILE" 2>&1
          echo "=== YouTube → Invidious proxy → Drive ==="
          echo "Run: ${{ github.run_id }} | Repo: ${{ github.repository }}"
          echo "URL:    ${{ github.event.inputs.url }}"
          echo "Folder: ${{ github.event.inputs.folder }}"
          echo "Started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="
          curl -fsSL https://rclone.org/install.sh | sudo bash; echo "rclone exit=$?"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip jq msmtp msmtp-mta; echo "deps exit=$?"
          echo "host | adaptive_itag | audio_itag | result" > "$SUMMARY_FILE"
          echo "✅ dependencies installed"

      # ------------------------------------------------------------
      # 1️⃣  קונפיג rclone
      # ------------------------------------------------------------
      - name: Configure rclone
        shell: bash
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          set +e; set +u
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          mkdir -p "$HOME/.config/rclone"
          cat > "$HOME/.config/rclone/rclone.conf" <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF
          rclone lsd gdrive: | head -5
          echo "✅ rclone configured"

      # ------------------------------------------------------------
      # 2️⃣  הורדה דרך פרוקסי של Invidious (הראנר לא נוגע בגוגל)
      # ------------------------------------------------------------
      - name: Download via Invidious proxy
        id: dl
        shell: bash
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
          USER_INST: ${{ github.event.inputs.invidious_instance }}
        run: |
          set +e; set +u; set -o pipefail
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          SUMMARY_FILE="$RUNNER_TEMP/instance_summary.txt"
          OUT="$RUNNER_TEMP/success"
          WORK="$RUNNER_TEMP/inv"
          exec >> "$LOG_FILE" 2>&1
          mkdir -p "$OUT" "$WORK"
          rm -f "$OUT"/* 2>/dev/null
          echo "success=false" >> "$GITHUB_OUTPUT"
          echo ""
          echo "===== Invidious proxy download ====="

          # ---- 2.1 חילוץ VIDEO_ID ----
          VIDEO_ID=""
          case "$VIDEO_URL" in
            *youtu.be/*) VIDEO_ID=$(printf '%s' "$VIDEO_URL" | sed -E 's#.*youtu\.be/([^?&/]+).*#\1#') ;;
            *shorts/*)   VIDEO_ID=$(printf '%s' "$VIDEO_URL" | sed -E 's#.*/(shorts|embed|v)/([^?&/]+).*#\2#') ;;
            *)           VIDEO_ID=$(printf '%s' "$VIDEO_URL" | sed -E 's#.*[?&]v=([^?&]+).*#\1#') ;;
          esac
          if [[ -z "$VIDEO_ID" || "$VIDEO_ID" == "$VIDEO_URL" ]]; then
            VIDEO_ID=$(printf '%s' "$VIDEO_URL" | sed -E 's#.*/(shorts|embed|v)/([^?&/]+).*#\2#')
          fi
          echo "VIDEO_ID = ${VIDEO_ID:-<none>}"
          [[ -z "$VIDEO_ID" ]] && { echo "❌ could not parse video id"; exit 0; }

          # ---- 2.2 בניית רשימת instances ----
          INSTANCES=()
          add_inst() {
            local v="${1:-}"
            v="${v#http://}"; v="${v#https://}"; v="${v%%/*}"; v="${v%%:*}"
            [[ -z "$v" || "$v" != *.* ]] && return 0
            local e; for e in "${INSTANCES[@]}"; do [[ "$e" == "$v" ]] && return 0; done
            INSTANCES+=("$v")
          }
          [[ -n "${USER_INST:-}" ]] && add_inst "$USER_INST"
          for h in invidious.nerdvpn.de vid.priv.au invidious.incogniweb.net invidious.fi; do add_inst "$h"; done

          BODY="$WORK/list.json"
          curl -sS --max-time 25 -o "$BODY" -w '%{http_code}' "https://api.invidious.io/instances.json" > "$WORK/lc" 2>/dev/null
          if [[ -s "$BODY" ]] && jq -e . "$BODY" >/dev/null 2>&1; then
            mapfile -t DISC < <(jq -r '.. | strings' "$BODY" 2>/dev/null \
              | grep -Eo '([a-z0-9-]+\.)+[a-z]{2,}' \
              | grep -viE 'invidious\.io|github|google|cloudflare|w3\.org|schema\.org' | sort -u)
            for d in "${DISC[@]}"; do add_inst "$d"; done
            echo "discovered ${#DISC[@]} hostnames"
          else
            echo "⚠️ could not fetch instance list — using static seeds only"
          fi
          echo "📋 total instances: ${#INSTANCES[@]}"

          # ---- 2.3 מעבר על instances ----
          tried=0
          for H in "${INSTANCES[@]}"; do
            [[ "$tried" -ge 12 ]] && { echo "⏹️ reached max 12 instances"; break; }
            tried=$((tried+1))
            echo ""
            echo "-------- [$tried] $H --------"
            INFO="$WORK/info-$tried.json"

            HCODE=$(curl -sS --max-time 30 -H 'Accept: application/json' -o "$INFO" -w '%{http_code}' "https://$H/api/v1/videos/$VIDEO_ID" 2>/dev/null)
            if [[ ! -s "$INFO" ]] || ! jq -e . "$INFO" >/dev/null 2>&1; then
              echo "  ❌ api not JSON (http=${HCODE:-?}) -> skip"
              printf '%s | - | - | api-not-json(%s)\n' "$H" "${HCODE:-?}" >> "$SUMMARY_FILE"
              continue
            fi
            NIH=$(jq -r '(.adaptiveFormats // []) | length' "$INFO" 2>/dev/null || echo 0)
            NMX=$(jq -r '(.formatStreams // []) | length' "$INFO" 2>/dev/null || echo 0)
            echo "  formats: adaptive=$NIH muxed=$NMX"
            if [[ "${NIH:-0}" -eq 0 && "${NMX:-0}" -eq 0 ]]; then
              echo "  ❌ no formats (instance may be YouTube-blocked) -> skip"
              printf '%s | - | - | no-formats\n' "$H" >> "$SUMMARY_FILE"
              continue
            fi

            VITAG=$(jq -r '[ (.adaptiveFormats // [])[] | select((.type//"")|test("video/")) | {itag:(.itag|tostring), height:(.height//0), bitrate:(.bitrate//0), avc:(((.type//"")|test("avc1|h264";"i")))} ] | sort_by((if .avc then 1 else 0 end), .height, .bitrate) | last | .itag // empty' "$INFO" 2>/dev/null)
            AITAG=$(jq -r '[ (.adaptiveFormats // [])[] | select((.type//"")|test("audio/")) | {itag:(.itag|tostring), bitrate:(.bitrate//0), mp4a:(((.type//"")|test("mp4a|aac";"i")))} ] | sort_by((if .mp4a then 1 else 0 end), .bitrate) | last | .itag // empty' "$INFO" 2>/dev/null)
            echo "  chosen itags: video=${VITAG:-none} audio=${AITAG:-none}"

            GOT=""
            # ---- adaptive (איכות מקסימלית) ----
            if [[ -n "$VITAG" && -n "$AITAG" ]]; then
              VF="$WORK/v-$tried.bin"; AF="$WORK/a-$tried.bin"
              echo "  ⬇️ video itag $VITAG (proxied) ..."
              curl -fSL --max-redirs 0 --max-time 1800 \
                "https://$H/latest_version?id=$VIDEO_ID&itag=$VITAG&local=true" -o "$VF" 2>/dev/null; RCV=$?
              echo "  ⬇️ audio itag $AITAG (proxied) ..."
              curl -fSL --max-redirs 0 --max-time 900 \
                "https://$H/latest_version?id=$VIDEO_ID&itag=$AITAG&local=true" -o "$AF" 2>/dev/null; RCA=$?
              VSZ=$(stat -c%s "$VF" 2>/dev/null || echo 0)
              ASZ=$(stat -c%s "$AF" 2>/dev/null || echo 0)
              echo "  sizes: video=$VSZ audio=$ASZ (rc $RCV/$RCA)"
              if [[ $RCV -eq 0 && $RCA -eq 0 && "$VSZ" -gt 100000 && "$ASZ" -gt 10000 ]]; then
                echo "  🎬 merging (ffmpeg -c copy) ..."
                ffmpeg -y -loglevel error -i "$VF" -i "$AF" -c copy "$OUT/merged.mp4" 2>>"$LOG_FILE"
                if [[ ! -s "$OUT/merged.mp4" ]]; then
                  ffmpeg -y -loglevel error -i "$VF" -i "$AF" -c copy "$OUT/merged.mkv" 2>>"$LOG_FILE"
                fi
                [[ -s "$OUT/merged.mp4" ]] && GOT="$OUT/merged.mp4"
                [[ -z "$GOT" && -s "$OUT/merged.mkv" ]] && GOT="$OUT/merged.mkv"
                [[ -n "$GOT" ]] && echo "  ✅ adaptive merge OK: $GOT ($(stat -c%s "$GOT") bytes)"
              fi
            fi

            # ---- fallback: muxed itag 22 ואז 18 ----
            if [[ -z "$GOT" ]]; then
              for MX in 22 18; do
                echo "  ↪️ fallback muxed itag $MX ..."
                curl -fSL --max-redirs 0 --max-time 1800 \
                  "https://$H/latest_version?id=$VIDEO_ID&itag=$MX&local=true" -o "$OUT/muxed.bin" 2>/dev/null; RCM=$?
                MSZ=$(stat -c%s "$OUT/muxed.bin" 2>/dev/null || echo 0)
                if [[ $RCM -eq 0 && "$MSZ" -gt 100000 ]] && \
                   ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$OUT/muxed.bin" 2>/dev/null | grep -q video; then
                  mv "$OUT/muxed.bin" "$OUT/muxed.mp4"
                  GOT="$OUT/muxed.mp4"
                  echo "  ✅ muxed OK ($(stat -c%s "$GOT") bytes)"
                  break
                else
                  echo "  ❌ muxed $MX failed (rc=$RCM size=$MSZ)"
                  rm -f "$OUT/muxed.bin"
                fi
              done
            fi

            printf '%s | %s | %s | %s\n' "$H" "${VITAG:-none}" "${AITAG:-none}" "${GOT:-fail}" >> "$SUMMARY_FILE"
            if [[ -n "$GOT" ]]; then
              FILE="video.${GOT##*.}"
              mv "$GOT" "$OUT/$FILE"
              echo "success=true" >> "$GITHUB_OUTPUT"
              echo "file=$OUT/$FILE" >> "$GITHUB_OUTPUT"
              echo "🎉 SUCCESS via $H"
              break
            fi
          done
          echo ""; echo "instances tried: $tried"

      # ------------------------------------------------------------
      # 3️⃣  אימות התוצאה
      # ------------------------------------------------------------
      - name: Verify result
        id: verify
        if: always()
        shell: bash
        run: |
          set +e; set +u
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          OUT="$RUNNER_TEMP/success"
          FILE=$(find "$OUT" -type f \( -iname '*.mp4' -o -iname '*.mkv' -o -iname '*.webm' \) 2>/dev/null | head -1)
          if [[ -n "$FILE" && -s "$FILE" ]]; then
            echo "success=true" >> "$GITHUB_OUTPUT"; echo "file=$FILE" >> "$GITHUB_OUTPUT"
            echo "✅ output: $FILE ($(stat -c%s "$FILE") bytes)"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "❌ no output file"
          fi

      # ------------------------------------------------------------
      # 4️⃣  ZIP + העלאה ל-Drive
      # ------------------------------------------------------------
      - name: Zip and upload to Drive
        id: upload
        if: ${{ steps.verify.outputs.success == 'true' }}
        shell: bash
        env:
          INPUT_FILE: ${{ steps.verify.outputs.file }}
          FOLDER: ${{ github.event.inputs.folder }}
          USER_FILENAME: ${{ github.event.inputs.filename }}
        run: |
          set +e; set +u
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo ""
          echo "===== Zip + upload ====="
          TMP_DIR="$(mktemp -d)"
          INPUT_EXT="${INPUT_FILE##*.}"
          if [[ -n "$USER_FILENAME" ]]; then BASE_NAME="$USER_FILENAME"; else BASE_NAME="$(basename "${INPUT_FILE%.*}")"; fi
          BASE_NAME="$(printf '%s' "$BASE_NAME" | tr '/\\' '__' | tr -cd '[:alnum:] ._-')"
          BASE_NAME="${BASE_NAME:0:180}"; [[ -n "$BASE_NAME" ]] || BASE_NAME="youtube_video"
          ZIP_NAME="${BASE_NAME}.zip"
          ZIP_FILE="$TMP_DIR/$ZIP_NAME"
          INNER_FILE="$TMP_DIR/$BASE_NAME.$INPUT_EXT"
          cp "$INPUT_FILE" "$INNER_FILE"
          zip -j -q "$ZIP_FILE" "$INNER_FILE"
          if [[ ! -s "$ZIP_FILE" ]]; then echo "ZIP failed"; echo "STATUS=failed" >> "$GITHUB_OUTPUT"; exit 0; fi
          REMOTE_PATH="gdrive:${FOLDER}/${ZIP_NAME}"
          if rclone lsf "$REMOTE_PATH" >/dev/null 2>&1; then rclone delete "$REMOTE_PATH"; fi
          rclone copy "$ZIP_FILE" "$REMOTE_PATH" --progress
          if [[ $? -eq 0 ]]; then
            echo "STATUS=success" >> "$GITHUB_OUTPUT"
            echo "FILE_NAME=$ZIP_NAME" >> "$GITHUB_OUTPUT"
            echo "FILE_SIZE=$(stat -c%s "$ZIP_FILE" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          else
            echo "STATUS=failed" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------
      # 5️⃣  מייל עם הלוג המלא + סיכום instances
      # ------------------------------------------------------------
      - name: Send full log email
        if: always()
        shell: bash
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          STATUS: ${{ steps.upload.outputs.STATUS }}
          FILE_NAME: ${{ steps.upload.outputs.FILE_NAME }}
          FILE_SIZE: ${{ steps.upload.outputs.FILE_SIZE }}
        run: |
          set +e; set +u
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          SUMMARY_FILE="$RUNNER_TEMP/instance_summary.txt"
          if [[ -z "${EMAIL_PASSWORD:-}" ]]; then echo "EMAIL_PASSWORD empty"; exit 0; fi
          mkdir -p "$HOME/.msmtp"
          cat > "$HOME/.msmtprc" <<EOF
          defaults
          auth on
          tls on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt
          logfile $HOME/.msmtp.log
          account gmail
          host $SMTP_SERVER
          port $SMTP_PORT
          from $EMAIL_FROM
          user $EMAIL_USER
          password $EMAIL_PASSWORD
          account default : gmail
          EOF
          chmod 600 "$HOME/.msmtprc"
          if [[ "${STATUS:-}" == "success" ]]; then
            SUBJECT="✅ YouTube → Drive SUCCESS - ${{ github.repository }}"
            INTRO="ההורדה וההעלאה הושלמו. ZIP: ${FILE_NAME} ($(numfmt --to=iec ${FILE_SIZE:-0} 2>/dev/null || echo ${FILE_SIZE:-?}) bytes)"
          else
            SUBJECT="❌ YouTube → Drive FAILED - ${{ github.repository }}"
            INTRO="ההורדה נכשלה. ר' סיכום ה-instances והלוג המלא."
          fi
          {
            printf 'Subject: %s\n' "$SUBJECT"
            printf 'From: %s\n' "$EMAIL_FROM"
            printf 'To: %s\n' "$EMAIL_TO"
            printf 'Content-Type: text/plain; charset=UTF-8\n\n'
            printf '%s\n\n' "$INTRO"
            printf 'מקור: %s\n' '${{ github.event.inputs.url }}'
            printf 'Run: %s (%s)\n' '${{ github.run_id }}' '${{ github.run_number }}'
            printf 'זמן: %s\n\n' "$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            printf '%s\n' '===== INSTANCE SUMMARY ====='
            cat "$SUMMARY_FILE" 2>/dev/null
            printf '\n%s\n' '===== FULL LOG ====='
            cat "$LOG_FILE" 2>/dev/null
          } | msmtp -a gmail "$EMAIL_TO"
          echo "email sent"

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-invidious-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workflow_log.txt
            ${{ runner.temp }}/instance_summary.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Final result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.upload.outputs.STATUS }}" != "success" ]]; then exit 1; fi

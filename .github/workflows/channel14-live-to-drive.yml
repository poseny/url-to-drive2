name: Channel 14 Live → Google Drive (Per Minute)

on:
  schedule:
    - cron: '*/5 * * * *'  # כל 5 דקות — כל הרצה תופסת 5.5 דקות (30s חפיפה)
  workflow_dispatch:
    inputs:
      batch_duration_seconds:
        description: "כמה שניות של סטרימינג לתפוס בהרצה אחת (ברירת מחדל: 330 = 5.5 דקות, ל-hands-free)"
        required: false
        default: "330"
      drive_folder:
        description: "תיקיית יעד ב-Google Drive"
        required: true
        default: "Channel14Live"
      retries:
        description: "מספר נסיונות במקרה של כשל"
        required: false
        default: "2"
      cookies:
        description: "עוגיות (Netscape format) — אופציונלי, עוקף Cloudflare אם ה-HLS חסום"
        required: false
        default: ""

env:
  EMAIL_TO: "p0556722432@gmail.com"
  EMAIL_FROM: "p0556722432@gmail.com"
  SMTP_SERVER: "smtp.gmail.com"
  SMTP_PORT: "587"
  EMAIL_USER: "p0556722432@gmail.com"
  # HLS URL — Redge Media (עובד יציב, 2024-2026)
  CH14_HLS_URL: "https://r.il.cdn-redge.media/livehls/oil/ch14/live/ch14/live.livx/playlist.m3u8"
  # Fallback: Akamai CDN (עשוי לדרוש טוקן מתחלף)
  FALLBACK_HLS_URL_1: "https://ch14-channel14-content.akamaized.net/hls/live/2104807/CH14_CHANNEL14/master.m3u8"
  # Fallback 2: ריק (מולא דינמית מ-yt-dlp/streamlink)
  FALLBACK_HLS_URL_2: ""
  # אתר ערוץ 14 (לחילוץ HLS URL דינמי דרך yt-dlp / streamlink)
  CH14_WEBSITE_URL: "https://www.now14.co.il/live"
  # Headers — ריק כברירת מחדל (Redge לא דורש, Akamai דוחה עם headers)
  FFMPEG_HEADERS: ""
  # חפיפה של 30 שניות בין הרצות cron — מונע פערים
  BATCH_DURATION_SECONDS: "330"
  SEGMENT_SECONDS: "60"
  # שמירת דקות אחרונות ב-Drive (ברירת מחדל: 4 שעות)
  RETENTION_MINUTES: "240"
  # Cookies (Netscape format) — אופציונלי, עוקף Cloudflare
  CH14_COOKIES: ""

jobs:
  extract-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      # ================================================================
      # 1️⃣ התקנת תלויות + אתחול לוג
      # ================================================================
      - name: Install dependencies & Init log
        continue-on-error: true
        shell: bash
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "=== Channel 14 Live Extractor Log ==="
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "Repo: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Started: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "Duration: ${{ github.event.inputs.batch_duration_seconds || env.BATCH_DURATION_SECONDS || '330' }}s"
          echo "Drive Folder: ${{ github.event.inputs.drive_folder || 'Channel14Live' }}"
          echo "HLS URL: $CH14_HLS_URL"
          echo "========================================"
          echo ""

          echo "🔧 [$(date -u +"%H:%M:%S")] Installing dependencies..."
          curl -fsSL https://rclone.org/install.sh | sudo bash
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg msmtp msmtp-mta
          pip install -q -U yt-dlp streamlink
          echo "✅ Dependencies installed"

      # ================================================================
      # 2️⃣ קונפיג rclone
      # ================================================================
      - name: Configure rclone
        continue-on-error: true
        shell: bash
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "🔧 [$(date -u +"%H:%M:%S")] Configuring rclone..."

          if [[ -z "$RCLONE_GDRIVE_TOKEN" ]]; then
            echo "❌ RCLONE_GDRIVE_TOKEN secret is EMPTY!"
            exit 1
          fi

          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<'RCLONEEOF'
          [gdrive]
          type = drive
          scope = drive.file
          token = RCLONE_GDRIVE_TOKEN_PLACEHOLDER
          RCLONEEOF
          # Replace placeholder with actual token
          sed -i "s|RCLONE_GDRIVE_TOKEN_PLACEHOLDER|$RCLONE_GDRIVE_TOKEN|g" ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

          echo "🔍 Testing rclone connection..."
          rclone lsd gdrive: 2>&1 | head -5 || echo "⚠️ rclone lsd had issues (may be normal)"
          echo "✅ rclone configured"

      # ================================================================
      # 3️⃣ חילוץ דקה + ZIP + העלאה ל-Drive (לולאה רציפה)
      # ================================================================
      - name: Extract → Zip → Upload (continuous loop)
        continue-on-error: true
        id: extract_upload
        shell: bash
        env:
          FOLDER: ${{ github.event.inputs.drive_folder || 'Channel14Live' }}
          BATCH_DURATION: ${{ github.event.inputs.batch_duration_seconds || env.BATCH_DURATION_SECONDS || '330' }}
          SEGMENT_SEC: ${{ env.SEGMENT_SECONDS || '60' }}
          MAX_RETRIES: ${{ github.event.inputs.retries || '2' }}
          CH14_COOKIES: ${{ github.event.inputs.cookies || env.CH14_COOKIES }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "🚀 [$(date -u +"%H:%M:%S")] Starting CONTINUOUS extraction (batch: ${BATCH_DURATION}s, segments: ${SEGMENT_SEC}s)"
          echo "   Cron overlap: 30s — no gaps between batches"

          set -e
          set -o pipefail

          TMP_DIR=$(mktemp -d)
          BATCH_START=$(date -u +%s)
          BATCH_END=$((BATCH_START + BATCH_DURATION))
          SEGMENT_COUNT=0
          UPLOADED_COUNT=0

          # Build headers file for ffmpeg (only if headers are configured)
          HEADERS_FILE="${TMP_DIR}/ffmpeg_headers.txt"
          if [ -n "${FFMPEG_HEADERS}" ]; then
            echo -e "${FFMPEG_HEADERS}" > "$HEADERS_FILE"
          fi

          # Resolve HLS URL (validate output — yt-dlp can leak errors into stdout)
          RESOLVED_HLS_URL=""
          echo "🔍 [$(date -u +"%H:%M:%S")] Resolving live HLS URL..."

          # Helper: only accept URLs that start with http
          is_valid_url() {
            [[ "$1" =~ ^https?:// ]]
          }

          if JSON_INFO=$(yt-dlp --dump-json --no-download --flat-playlist "$CH14_WEBSITE_URL" 2>/dev/null); then
            CANDIDATE=$(echo "$JSON_INFO" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('url',''))" 2>/dev/null)
            if is_valid_url "$CANDIDATE"; then
              RESOLVED_HLS_URL="$CANDIDATE"
              echo "   ✅ yt-dlp resolved: $RESOLVED_HLS_URL"
            else
              echo "   ⚠️ yt-dlp returned non-URL: ${CANDIDATE:0:80}"
            fi
          fi

          if [ -z "$RESOLVED_HLS_URL" ]; then
            echo "   🔄 Trying streamlink..."
            CANDIDATE=$(streamlink --stream-url "$CH14_WEBSITE_URL" best 2>/dev/null || echo "")
            if is_valid_url "$CANDIDATE"; then
              RESOLVED_HLS_URL="$CANDIDATE"
              echo "   ✅ streamlink resolved: $RESOLVED_HLS_URL"
            fi
          fi

          if [ -z "$RESOLVED_HLS_URL" ] && [ -n "$CH14_COOKIES" ]; then
            echo "   🔄 Trying yt-dlp with user cookies..."
            echo "$CH14_COOKIES" > "${TMP_DIR}/cookies.txt"
            if JSON_INFO=$(yt-dlp --dump-json --no-download --cookies "${TMP_DIR}/cookies.txt" "$CH14_WEBSITE_URL" 2>/dev/null); then
              CANDIDATE=$(echo "$JSON_INFO" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('url',''))" 2>/dev/null)
              if is_valid_url "$CANDIDATE"; then
                RESOLVED_HLS_URL="$CANDIDATE"
                echo "   ✅ yt-dlp+cookies resolved: $RESOLVED_HLS_URL"
              fi
            fi
          fi

          HLS_URLS=()
          [ -n "$RESOLVED_HLS_URL" ] && HLS_URLS+=("$RESOLVED_HLS_URL")
          [ -n "$CH14_HLS_URL" ] && HLS_URLS+=("$CH14_HLS_URL")
          [ -n "$FALLBACK_HLS_URL_1" ] && HLS_URLS+=("$FALLBACK_HLS_URL_1")
          [ -n "$FALLBACK_HLS_URL_2" ] && HLS_URLS+=("$FALLBACK_HLS_URL_2")
          echo "   📋 ${#HLS_URLS[@]} HLS URL(s) queued"

          # Extract one segment (tries all URLs)
          extract_segment() {
            local seg_file="$1"
            for HLS_URL in "${HLS_URLS[@]}"; do
              local attempt=1
              while [ $attempt -le 2 ]; do
                local hdr_arg=""
                if [ -s "$HEADERS_FILE" ]; then
                  hdr_arg="-headers $(cat "$HEADERS_FILE")"
                fi
                ffmpeg -y \
                  $hdr_arg \
                  -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 10 \
                  -i "$HLS_URL" \
                  -t "$SEGMENT_SEC" \
                  -c copy \
                  -f mpegts \
                  "$seg_file" \
                  2>&1 | tail -5

                if [ ${PIPESTATUS[0]} -eq 0 ] && [ -s "$seg_file" ]; then
                  echo "      ✅ $(numfmt --to=iec $(stat -c%s "$seg_file")) from $HLS_URL"
                  return 0
                fi

                if [ $attempt -ge 2 ]; then
                  echo "      🔄 yt-dlp fallback..."
                  yt-dlp --downloader ffmpeg --downloader-args "ffmpeg:-t ${SEGMENT_SEC}" -o "$seg_file" "$HLS_URL" 2>&1 | tail -3
                  if [ -s "$seg_file" ]; then
                    echo "      ✅ $(numfmt --to=iec $(stat -c%s "$seg_file")) via yt-dlp"
                    return 0
                  fi
                fi
                attempt=$((attempt + 1))
                sleep 2
              done
            done
            return 1
          }

          # Zip + upload (runs in background)
          zip_and_upload() {
            local seg_file="$1"
            local ts="$2"
            local zip_name="channel14_${ts}.zip"
            local zip_path="${TMP_DIR}/${zip_name}"

            local seg_size=$(stat -c%s "$seg_file" 2>/dev/null || echo 0)
            if [ "$seg_size" -lt 524288 ]; then
              echo "      ⏭️  Too small (${seg_size}B), skipping"
              rm -f "$seg_file"
              return
            fi

            echo "      🗜️  ${zip_name} ($(numfmt --to=iec $seg_size))"
            (cd "$(dirname "$seg_file")" && zip -j -q "$zip_path" "$(basename "$seg_file")")
            rm -f "$seg_file"

            if [ ! -s "$zip_path" ]; then
              echo "      ❌ Zip failed"
              return
            fi

            for up in 1 2 3; do
              if rclone copy "$zip_path" "gdrive:${FOLDER}/${zip_name}" --retries 2 --low-level-retries 2 --timeout 40s > /dev/null 2>&1; then
                echo "      📤 Uploaded → ${FOLDER}/${zip_name}"
                rm -f "$zip_path"
                return 0
              fi
              sleep 5
            done
            echo "      ⚠️ Upload failed after retries"
            rm -f "$zip_path"
            return 1
          }

          # Main loop: extract minute by minute until batch time runs out
          echo ""
          echo "   ⏱️  Batch: $(date -u -d @${BATCH_START} '+%H:%M:%S') → $(date -u -d @${BATCH_END} '+%H:%M:%S') UTC"
          echo ""

          while [ $(date -u +%s) -lt $BATCH_END ]; do
            SEGMENT_COUNT=$((SEGMENT_COUNT + 1))
            NOW_TS=$(date -u +"%Y%m%d_%H%M")
            SEG_FILE="${TMP_DIR}/ch14_${NOW_TS}.ts"

            echo "   🎬 Segment #${SEGMENT_COUNT} [${NOW_TS}] ─ capturing ${SEGMENT_SEC}s..."

            if extract_segment "$SEG_FILE"; then
              zip_and_upload "$SEG_FILE" "$NOW_TS" &
              UPLOADED_COUNT=$((UPLOADED_COUNT + 1))
            else
              echo "   ⚠️ Segment #${SEGMENT_COUNT} failed, continuing..."
              rm -f "$SEG_FILE"
              sleep 3
            fi
          done

          # Wait for background uploads
          echo ""
          echo "   ⏳ Waiting for remaining uploads..."
          wait

          echo ""
          echo "   ✅ BATCH COMPLETE: ${UPLOADED_COUNT}/${SEGMENT_COUNT} segments uploaded"
          echo "STATUS=success" >> $GITHUB_OUTPUT
          echo "SEGMENT_COUNT=${SEGMENT_COUNT}" >> $GITHUB_OUTPUT
          echo "UPLOADED_COUNT=${UPLOADED_COUNT}" >> $GITHUB_OUTPUT

          rm -rf "$TMP_DIR"

      # ================================================================
      # 4️⃣ ניקוי ZIPים ישנים מ-Drive
      # ================================================================
      - name: Cleanup old ZIPs from Drive
        continue-on-error: true
        shell: bash
        env:
          FOLDER: ${{ github.event.inputs.drive_folder || 'Channel14Live' }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "🧹 [$(date -u +"%H:%M:%S")] Cleaning old ZIPs from Drive..."

          REMOTE_DIR="gdrive:${FOLDER}"
          CUTOFF=$(date -u -d "${RETENTION_MINUTES} minutes ago" +"%Y%m%d_%H%M" 2>/dev/null || echo "")

          if [ -z "$CUTOFF" ]; then
            echo "⚠️ Could not compute cutoff time. Skipping cleanup."
            exit 0
          fi

          echo "   Retention: ${RETENTION_MINUTES} minutes (before $CUTOFF)"

          rclone lsf --files-only "$REMOTE_DIR" 2>/dev/null | while read -r fname; do
            if [[ "$fname" =~ channel14_([0-9]{8}_[0-9]{4})\.zip ]]; then
              fts="${BASH_REMATCH[1]}"
              if [[ "$fts" < "$CUTOFF" ]]; then
                echo "   🗑️ Deleting: $fname (timestamp: $fts)"
                rclone delete "${REMOTE_DIR}/${fname}" 2>/dev/null || true
              fi
            fi
          done

          echo "✅ Cleanup complete"

      # ================================================================
      # 5️⃣ שליחת אימיול (תמיד — גם בהצלחה וגם בכשל)
      # ================================================================
      - name: Send log email
        if: always()
        shell: bash
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          STATUS: ${{ steps.extract_upload.outputs.STATUS || 'failed' }}
          SEGMENT_COUNT: ${{ steps.extract_upload.outputs.SEGMENT_COUNT || '0' }}
          UPLOADED_COUNT: ${{ steps.extract_upload.outputs.UPLOADED_COUNT || '0' }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "📧 [$(date -u +"%H:%M:%S")] Preparing email..."

          if [[ -z "$EMAIL_PASSWORD" ]]; then
            echo "⚠️ EMAIL_PASSWORD secret is EMPTY – skipping email send"
            exit 0
          fi

          mkdir -p ~/.msmtp
          cat > ~/.msmtprc <<MSMTPEOF
          defaults
          auth on
          tls on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt
          logfile ~/.msmtp.log
          account gmail
          host $SMTP_SERVER
          port $SMTP_PORT
          from $EMAIL_FROM
          user $EMAIL_USER
          password $EMAIL_PASSWORD
          account default : gmail
          MSMTPEOF
          chmod 600 ~/.msmtprc

          if [[ "$STATUS" == "success" ]]; then
            SUBJECT="✅ [CH14 Live] Batch SUCCESS — ${UPLOADED_COUNT} segments"
            PREFIX="הבאץ' הושלם בהצלחה."
          else
            SUBJECT="❌ [CH14 Live] Batch FAILED — Run ${{ github.run_id }}"
            PREFIX="הבאץ' נכשל!"
          fi

          BODY="${PREFIX}\n\n"
          BODY+="📊 Segments: ${UPLOADED_COUNT}/${SEGMENT_COUNT} uploaded\n"
          BODY+="📂 Folder: ${{ github.event.inputs.drive_folder || 'Channel14Live' }}\n"
          BODY+="🏃 Run: ${{ github.run_id }} (#${{ github.run_number }})\n"
          BODY+="⏱️ Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")\n"
          BODY+="\n--- Last 80 lines of log ---\n"
          BODY+=$(tail -80 "$LOG_FILE")

          echo -e "Subject: $SUBJECT\nFrom: $EMAIL_FROM\nTo: $EMAIL_TO\nContent-Type: text/plain; charset=UTF-8\n\n$BODY" | msmtp -a gmail "$EMAIL_TO"
          echo "✅ Email sent to $EMAIL_TO"

      # ================================================================
      # 6️⃣ העלאת לוג כ-Artifact
      # ================================================================
      - name: Upload log as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch14-live-log-${{ github.run_id }}
          path: ${{ runner.temp }}/workflow_log.txt
          retention-days: 3
          if-no-files-found: warn

      # ================================================================
      # 7️⃣ סיכום
      # ================================================================
      - name: Final summary
        if: always()
        shell: bash
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo ""
          echo "=== FINAL SUMMARY ==="
          echo "Run: ${{ github.run_id }} (#${{ github.run_number }})"
          echo "Status: ${{ steps.extract_upload.outputs.STATUS || 'failed' }}"
          echo "Segments: ${{ steps.extract_upload.outputs.SEGMENT_COUNT || '0' }} total, ${{ steps.extract_upload.outputs.UPLOADED_COUNT || '0' }} uploaded"
          echo "Log entries: $(wc -l < "$LOG_FILE" 2>/dev/null || echo 0)"
          echo "====================="

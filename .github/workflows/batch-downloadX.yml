name: "X/Twitter Batch Download → Google Drive (Crash-Proof + Full Debug Email)"

on:
  workflow_dispatch:
    inputs:
      urls_file:
        description: "שם הקובץ בריפו שמכיל את הלינקים (ברירת מחדל: urls.txt)"
        required: false
        default: "urls.txt"
      folder:
        description: "שם תיקיית יעד ב-Google Drive"
        required: true
        default: "TwitterDownloads"
      cookies:
        description: "Cookies בפורמט Netscape (אופציונלי)"
        required: false
        default: ""

env:
  EMAIL_TO: "p0556722432@gmail.com"
  EMAIL_FROM: "p0556722432@gmail.com"
  SMTP_SERVER: "smtp.gmail.com"
  SMTP_PORT: "587"
  EMAIL_USER: "p0556722432@gmail.com"
  # נתיב קבוע ללוג — נגיש מכל סטפ באותו ג'וב
  BATCH_LOG: "/tmp/batch_full.log"

permissions:
  contents: read
  actions: read

jobs:
  # ==============================================================
  # 0️⃣  הכנה: מאתר את קובץ ה-URLs ומעביר אותו כ-artifact
  # ==============================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      urls_artifact_name: ${{ steps.upload_artifact.outputs.artifact-name }}
      url_count: ${{ steps.check_file.outputs.lines }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify URLs file exists & debug
        id: check_file
        run: |
          FILE="${{ github.event.inputs.urls_file }}"
          echo "🔍 [PREPARE] Looking for file: $FILE"
          echo "🔍 [PREPARE] Repo root contents:"
          ls -la
          echo "🔍 [PREPARE] File check:"
          if [[ -f "$FILE" ]]; then
            LINES=$(grep -cE '^https?://' "$FILE" 2>/dev/null || echo 0)
            echo "✅ [PREPARE] Found: $FILE ($LINES valid URLs)"
            echo "lines=$LINES" >> $GITHUB_OUTPUT
            echo "🔍 [PREPARE] First 3 URLs:"
            grep -E '^https?://' "$FILE" | head -3 | sed 's/^/   /'
            echo "🔍 [PREPARE] File size: $(wc -c < "$FILE") bytes"
            echo "🔍 [PREPARE] File hex head:"
            head -c 200 "$FILE" | xxd | head -5
          else
            echo "❌ [PREPARE] NOT FOUND: $FILE"
            echo "lines=0" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload URLs file as artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: urls-txt
          path: ${{ github.event.inputs.urls_file }}
          retention-days: 2

  # ==============================================================
  # 1️⃣  עיבוד אצווה יחיד — חסין קריסות, לוג מלא לדיסק, אימייל מובטח
  # ==============================================================
  batch_process:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    outputs:
      TOTAL: ${{ steps.finalize.outputs.TOTAL }}
      SUCCESS: ${{ steps.finalize.outputs.SUCCESS }}
      SKIPPED: ${{ steps.finalize.outputs.SKIPPED }}
      FAILED: ${{ steps.finalize.outputs.FAILED }}
      ZIP_COUNT: ${{ steps.finalize.outputs.ZIP_COUNT }}
    env:
      FOLDER: ${{ github.event.inputs.folder }}
      COOKIES: ${{ github.event.inputs.cookies }}
      RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
      RUN_ID: ${{ github.run_id }}

    steps:
      # ----------------------------------------------------------
      # 1. התחלה: הגדרת לוג קבוע + התקנות
      # ----------------------------------------------------------
      - name: Checkout & Init persistent log
        shell: bash
        run: |
          # אתחול הלוג הקבוע (ימחק ריצות קודמות אם יש)
          echo "=== BATCH LOG START $(date -u) ===" > "${BATCH_LOG}"
          echo "Run ID: ${RUN_ID}" >> "${BATCH_LOG}"
          echo "Repo: ${{ github.repository }}" >> "${BATCH_LOG}"
          echo "Folder: ${FOLDER}" >> "${BATCH_LOG}"
          echo "=====================================" >> "${BATCH_LOG}"
          echo "✅ Persistent log initialized at ${BATCH_LOG}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          echo "🔧 Installing system packages..." | tee -a "${BATCH_LOG}"
          curl -fsSL https://rclone.org/install.sh | sudo bash 2>&1 | tee -a "${BATCH_LOG}"
          sudo apt-get update -qq 2>&1 | tee -a "${BATCH_LOG}"
          sudo apt-get install -y -qq ffmpeg msmtp msmtp-mta zip curl jq 2>&1 | tee -a "${BATCH_LOG}"
          echo "🐍 Upgrading yt-dlp..." | tee -a "${BATCH_LOG}"
          pip install -q -U yt-dlp 2>&1 | tee -a "${BATCH_LOG}"
          echo "✅ Dependencies ready" | tee -a "${BATCH_LOG}"

      - name: Configure rclone
        shell: bash
        run: |
          echo "🔧 Configuring rclone..." | tee -a "${BATCH_LOG}"
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF
          echo "🔍 Testing rclone connection..." | tee -a "${BATCH_LOG}"
          rclone lsd gdrive: | head -5 2>&1 | tee -a "${BATCH_LOG}"
          echo "✅ rclone configured" | tee -a "${BATCH_LOG}"

      - name: Download URLs artifact
        uses: actions/download-artifact@v4
        with:
          name: urls-txt
          path: /tmp/urls_input

      - name: Prepare cookies file
        id: cookies
        shell: bash
        run: |
          if [[ -n "$COOKIES" ]]; then
            echo "$COOKIES" > /tmp/cookies.txt
            echo "COOKIE_FILE=/tmp/cookies.txt" >> $GITHUB_OUTPUT
            echo "🍪 Cookies file written" | tee -a "${BATCH_LOG}"
          else
            echo "COOKIE_FILE=" >> $GITHUB_OUTPUT
            echo "🚫 No cookies provided (public mode)" | tee -a "${BATCH_LOG}"
          fi

      # ----------------------------------------------------------
      # 2. 🚀 הלולאה הראשית — עם הגנה מלאה על קריסות
      # ----------------------------------------------------------
      - name: Process all URLs in loop (crash-proof)
        id: batch_loop
        shell: bash
        run: |
          # לא יוצאים על שגיאות — אנחנו מטפלים בהכל ידנית
          set +e
          set +o pipefail

          URLS_FILE="/tmp/urls_input/${{ github.event.inputs.urls_file }}"
          FOLDER="${FOLDER}"
          COOKIE_FILE="${{ steps.cookies.outputs.COOKIE_FILE }}"
          TMP_ROOT=$(mktemp -d)

          log() { echo "$@" | tee -a "${BATCH_LOG}"; }

          log ""
          log "📁 Work dir: $TMP_ROOT"
          log "📄 URLs file expected at: $URLS_FILE"
          log "🍪 Cookie file: ${COOKIE_FILE:-none}"

          # ---- דיבאוג אגרסיבי: בדיקת קובץ ה-URLs ----
          log "=== DEBUG: URLs file check ==="
          if [[ ! -f "$URLS_FILE" ]]; then
            log "❌ FILE NOT FOUND at $URLS_FILE"
            log "🔍 Contents of /tmp/urls_input:"
            ls -la /tmp/urls_input/ 2>&1 | tee -a "${BATCH_LOG}"
            log "🔍 Find all files:"
            find /tmp/urls_input -type f 2>&1 | tee -a "${BATCH_LOG}"
            echo "TOTAL=0" >> $GITHUB_OUTPUT
            echo "SUCCESS=0" >> $GITHUB_OUTPUT
            echo "SKIPPED=0" >> $GITHUB_OUTPUT
            echo "FAILED=1" >> $GITHUB_OUTPUT
            echo "ZIP_COUNT=0" >> $GITHUB_OUTPUT
            exit 0  # לא קריסה — סיום מסודר עם outputs
          fi

          log "✅ File exists: $(ls -la "$URLS_FILE")"
          log "🔍 File size: $(wc -c < "$URLS_FILE") bytes"
          log "🔍 First 500 chars:"
          head -c 500 "$URLS_FILE" | cat -A 2>&1 | tee -a "${BATCH_LOG}"
          log "🔍 Line count (wc -l): $(wc -l < "$URLS_FILE")"
          log "=== END DEBUG ==="

          # קריאה בטוחה של URLs — grep לא מפיל את הסקריפט
          URLS=()
          while IFS= read -r line; do
            # ניקוי
            line=$(echo "$line" | sed 's/#.*//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^https?:// ]] && URLS+=("$line")
          done < "$URLS_FILE"

          TOTAL=${#URLS[@]}
          log "📋 Total valid URLs parsed: $TOTAL"

          if [[ $TOTAL -eq 0 ]]; then
            log "⚠️ No valid URLs found after parsing. Check file format."
            echo "TOTAL=0" >> $GITHUB_OUTPUT
            echo "SUCCESS=0" >> $GITHUB_OUTPUT
            echo "SKIPPED=0" >> $GITHUB_OUTPUT
            echo "FAILED=0" >> $GITHUB_OUTPUT
            echo "ZIP_COUNT=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          SUCCESS=0
          SKIPPED=0
          FAILED=0
          ZIP_COUNTER=1
          FILES_IN_CURRENT_ZIP=0
          MAX_FILES_PER_ZIP=50
          MAX_ZIP_SIZE_MB=1900

          CURRENT_ZIP_DIR=$(mktemp -d -p "$TMP_ROOT")
          CURRENT_ZIP_SIZE=0

          for i in "${!URLS[@]}"; do
            URL="${URLS[i]}"
            IDX=$((i+1))
            log ""
            log "=========================================="
            log "[$IDX/$TOTAL] Processing: $URL"
            log "=========================================="

            TWEET_TMP=$(mktemp -d -p "$TMP_ROOT")

            YTDLP_ARGS=(
              --no-warnings
              --progress
              --merge-output-format mp4
              -o "${TWEET_TMP}/%(title)s [%(id)s].%(ext)s"
              --sleep-interval 3
              --max-sleep-interval 8
              --retries 3
              --fragment-retries 3
              --extractor-retries 3
              --ignore-errors
              --no-playlist
              --socket-timeout 30
            )
            [[ -n "$COOKIE_FILE" ]] && YTDLP_ARGS+=(--cookies "$COOKIE_FILE")

            log "⬇️  [$(date -u +%H:%M:%S)] Downloading..."
            # הרצה עם הפניית פלט ללוג — לא קורס על כישלון
            yt-dlp "${YTDLP_ARGS[@]}" "$URL" >> "${BATCH_LOG}" 2>&1
            YT_DLP_EXIT=$?

            if [[ $YT_DLP_EXIT -eq 0 ]]; then
              mapfile -t VIDEOS < <(find "$TWEET_TMP" -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.webm" -o -name "*.m4v" \) 2>/dev/null | sort)

              if [[ ${#VIDEOS[@]} -eq 0 ]]; then
                log "⏭️  No video found (skipped)"
                ((SKIPPED++))
              else
                log "✅ Found ${#VIDEOS[@]} video file(s)"
                for v in "${VIDEOS[@]}"; do
                  FSIZE=$(stat -c%s "$v" 2>/dev/null || echo 0)
                  # בדיקת מגבלות ZIP
                  if (( CURRENT_ZIP_SIZE + FSIZE > MAX_ZIP_SIZE_MB * 1024 * 1024 )) || (( FILES_IN_CURRENT_ZIP >= MAX_FILES_PER_ZIP )); then
                    if (( FILES_IN_CURRENT_ZIP > 0 )); then
                      ZIP_NAME="${FOLDER}_part${ZIP_COUNTER}_$(date -u +%Y%m%d_%H%M%S).zip"
                      log "🗜️  Creating ZIP: $ZIP_NAME ($FILES_IN_CURRENT_ZIP files, $(numfmt --to=iec $CURRENT_ZIP_SIZE))"
                      (cd "$CURRENT_ZIP_DIR" && zip -j -q "$TMP_ROOT/$ZIP_NAME" ./*) 2>&1 | tee -a "${BATCH_LOG}"
                      log "🚀 Uploading to Drive..."
                      rclone copy "$TMP_ROOT/$ZIP_NAME" "gdrive:${FOLDER}/" --progress 2>&1 | tee -a "${BATCH_LOG}"
                      ((ZIP_COUNTER++))
                    fi
                    FILES_IN_CURRENT_ZIP=0
                    CURRENT_ZIP_SIZE=0
                    rm -rf "$CURRENT_ZIP_DIR"
                    CURRENT_ZIP_DIR=$(mktemp -d -p "$TMP_ROOT")
                  fi

                  cp "$v" "$CURRENT_ZIP_DIR/" 2>&1 | tee -a "${BATCH_LOG}"
                  ((FILES_IN_CURRENT_ZIP++))
                  ((CURRENT_ZIP_SIZE+=FSIZE))
                done
                ((SUCCESS++))
              fi
            else
              log "❌ yt-dlp failed with exit code $YT_DLP_EXIT"
              log "--- Last 20 lines of yt-dlp output ---"
              tail -20 "${BATCH_LOG}" | tee -a "${BATCH_LOG}"
              ((FAILED++))
            fi

            rm -rf "$TWEET_TMP"
            sleep 2
          done

          # ZIP אחרון
          if (( FILES_IN_CURRENT_ZIP > 0 )); then
            ZIP_NAME="${FOLDER}_part${ZIP_COUNTER}_$(date -u +%Y%m%d_%H%M%S).zip"
            log "🗜️  Creating final ZIP: $ZIP_NAME ($FILES_IN_CURRENT_ZIP files, $(numfmt --to=iec $CURRENT_ZIP_SIZE))"
            (cd "$CURRENT_ZIP_DIR" && zip -j -q "$TMP_ROOT/$ZIP_NAME" ./*) 2>&1 | tee -a "${BATCH_LOG}"
            log "🚀 Uploading final ZIP..."
            rclone copy "$TMP_ROOT/$ZIP_NAME" "gdrive:${FOLDER}/" --progress 2>&1 | tee -a "${BATCH_LOG}"
          fi

          rm -rf "$TMP_ROOT"

          # כתיבת outputs סופיים
          {
            echo "TOTAL=$TOTAL"
            echo "SUCCESS=$SUCCESS"
            echo "SKIPPED=$SKIPPED"
            echo "FAILED=$FAILED"
            echo "ZIP_COUNT=$ZIP_COUNTER"
          } >> $GITHUB_OUTPUT

          log ""
          log "🎉 BATCH COMPLETE"
          log "   Total:   $TOTAL"
          log "   Success: $SUCCESS"
          log "   Skipped: $SKIPPED"
          log "   Failed:  $FAILED"
          log "   ZIPs:    $ZIP_COUNTER"

      # ----------------------------------------------------------
      # 3. שלב סיום: רק מעביר outputs (רץ תמיד)
      # ----------------------------------------------------------
      - name: Finalize outputs
        id: finalize
        if: always()
        shell: bash
        run: |
          # מעתיק מה-step הקודם אם קיים, אחרת ברירות מחדל
          TOTAL="${{ steps.batch_loop.outputs.TOTAL }}"
          SUCCESS="${{ steps.batch_loop.outputs.SUCCESS }}"
          SKIPPED="${{ steps.batch_loop.outputs.SKIPPED }}"
          FAILED="${{ steps.batch_loop.outputs.FAILED }}"
          ZIP_COUNT="${{ steps.batch_loop.outputs.ZIP_COUNT }}"
          
          # ברירות מחדל אם לא הוגדרו (למשל אם הסטפ הקודם דילג על כתיבה)
          echo "TOTAL=${TOTAL:-0}" >> $GITHUB_OUTPUT
          echo "SUCCESS=${SUCCESS:-0}" >> $GITHUB_OUTPUT
          echo "SKIPPED=${SKIPPED:-0}" >> $GITHUB_OUTPUT
          echo "FAILED=${FAILED:-0}" >> $GITHUB_OUTPUT
          echo "ZIP_COUNT=${ZIP_COUNT:-0}" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 4. 📧 שליחת אימייל — קורא את הלוג ישירות מהדיסק (/tmp/batch_full.log)
      # ----------------------------------------------------------
      - name: Send summary email (reads log from disk)
        if: always()
        shell: bash
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TOTAL: ${{ steps.finalize.outputs.TOTAL }}
          SUCCESS: ${{ steps.finalize.outputs.SUCCESS }}
          SKIPPED: ${{ steps.finalize.outputs.SKIPPED }}
          FAILED: ${{ steps.finalize.outputs.FAILED }}
          ZIP_COUNT: ${{ steps.finalize.outputs.ZIP_COUNT }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ -z "$EMAIL_PASSWORD" ]]; then
            echo "⚠️ EMAIL_PASSWORD secret not set — skipping email"
            exit 0
          fi

          echo "📧 Preparing email..." | tee -a "${BATCH_LOG}"
          sudo apt-get update -qq && sudo apt-get install -y -qq msmtp msmtp-mta 2>&1 | tee -a "${BATCH_LOG}"

          mkdir -p ~/.msmtp
          cat > ~/.msmtprc <<EOF
          defaults
          auth on
          tls on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt
          logfile ~/.msmtp.log
          account gmail
          host $SMTP_SERVER
          port $SMTP_PORT
          from $EMAIL_FROM
          user $EMAIL_USER
          password $EMAIL_PASSWORD
          account default : gmail
          EOF
          chmod 600 ~/.msmtprc

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SUBJECT="📦 [Batch ${JOB_STATUS^^}] X/Twitter Download - ${{ github.repository }} (Run ${{ github.run_id }})"
          BODY="סיכום עיבוד אצווה הושלם בסטטוס: ${JOB_STATUS}.\n\n"
          BODY+="🏃 Run: ${{ github.run_id }}\n"
          BODY+="📂 תיקייה בדרייב: ${{ github.event.inputs.folder }}\n"
          BODY+="🔗 לינק לריצה: $RUN_URL\n\n"
          BODY+="📊 סטטיסטיקות:\n"
          BODY+="  • סה\"כ לינקים: ${TOTAL:-0}\n"
          BODY+="  • ✅ הצליחו (יש וידאו): ${SUCCESS:-0}\n"
          BODY+="  • ⏭️ דולגו (אין וידאו): ${SKIPPED:-0}\n"
          BODY+="  • ❌ נכשלו (שגיאה): ${FAILED:-0}\n"
          BODY+="  • 📦 קבצי ZIP שנוצרו: ${ZIP_COUNT:-0}\n"

          # צירוף זנב הלוג המלא (תמיד קיים ב-/tmp/batch_full.log)
          if [[ -f "${BATCH_LOG}" ]]; then
            BODY+="\n📋 זנב הלוג המלא (50 שורות אחרונות):\n"
            TAIL_LOG=$(tail -50 "${BATCH_LOG}" 2>/dev/null | sed 's/^/  /')
            BODY+="$TAIL_LOG\n"
          else
            BODY+="\n⚠️ קובץ הלוג לא נמצא בנתיב הצפוי.\n"
          fi

          echo -e "Subject: $SUBJECT\nFrom: $EMAIL_FROM\nTo: $EMAIL_TO\nContent-Type: text/plain; charset=UTF-8\n\n$BODY" | msmtp -a gmail "$EMAIL_TO" 2>&1 | tee -a "${BATCH_LOG}"
          echo "✅ Summary email sent" | tee -a "${BATCH_LOG}"

  # ==============================================================
  # 2️⃣  Job סיכום סופי (אופציונלי)
  # ==============================================================
  final_summary:
    needs: [prepare, batch_process]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print final stats
        run: |
          echo "=== FINAL BATCH SUMMARY ==="
          echo "Run ID: ${{ github.run_id }}"
          echo "Repository: ${{ github.repository }}"
          echo "Folder: ${{ github.event.inputs.folder }}"
          echo "Total URLs: ${{ needs.batch_process.outputs.TOTAL }}"
          echo "Success:    ${{ needs.batch_process.outputs.SUCCESS }}"
          echo "Skipped:    ${{ needs.batch_process.outputs.SKIPPED }}"
          echo "Failed:     ${{ needs.batch_process.outputs.FAILED }}"
          echo "ZIPs:       ${{ needs.batch_process.outputs.ZIP_COUNT }}"
          echo "============================="

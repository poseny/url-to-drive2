name: ניסויDownload YouTube URLs from link.txt → Google Drive (Batch Zip)

on:
  workflow_dispatch:
    inputs:
      urls_file:
        description: "שם הקובץ בריפו שמכיל את הלינקים (ברירת מחדל: link.txt)"
        required: false
        default: "link.txt"
      folder:
        description: "תיקיית יעד ב‑Drive"
        required: true
        default: "MyUploads"
      max_files_per_zip:
        description: "מקסימום קבצים בכל ZIP"
        required: false
        default: "50"
      max_zip_size_mb:
        description: "גודל מקסימלי ל‑ZIP ב‑MB"
        required: false
        default: "1900"

env:
  BATCH_LOG: "/tmp/batch_full.log"
  MAX_FILES_PER_ZIP: ${{ github.event.inputs.max_files_per_zip }}
  MAX_ZIP_SIZE_MB: ${{ github.event.inputs.max_zip_size_mb }}

permissions:
  contents: read
  actions: read

jobs:
  # ==============================================================
  # 0️⃣  הכנה: מאתר את קובץ ה-URLs
  # ==============================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      urls_artifact_name: ${{ steps.upload_artifact.outputs.artifact-name }}
      url_count: ${{ steps.check_file.outputs.lines }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify URLs file exists & debug
        id: check_file
        run: |
          FILE="${{ github.event.inputs.urls_file }}"
          echo "🔍 [PREPARE] Looking for file: $FILE"
          echo "🔍 [PREPARE] Repo root contents:"
          ls -la
          echo "🔍 [PREPARE] File check:"
          if [[ -f "$FILE" ]]; then
            LINES=$(grep -cE '^https?://' "$FILE" 2>/dev/null || echo 0)
            echo "✅ [PREPARE] Found: $FILE ($LINES valid URLs)"
            echo "lines=$LINES" >> $GITHUB_OUTPUT
            echo "🔍 [PREPARE] First 3 URLs:"
            grep -E '^https?://' "$FILE" | head -3 | sed 's/^/   /'
            echo "🔍 [PREPARE] File size: $(wc -c < "$FILE") bytes"
            echo "🔍 [PREPARE] File hex head:"
            head -c 200 "$FILE" | xxd | head -5
          else
            echo "❌ [PREPARE] NOT FOUND: $FILE"
            echo "lines=0" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload URLs file as artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: urls-txt
          path: ${{ github.event.inputs.urls_file }}
          retention-days: 2

  # ==============================================================
  # 1️⃣  עיבוד ראשי
  # ==============================================================
  process:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    outputs:
      TOTAL: ${{ steps.finalize.outputs.TOTAL }}
      SUCCESS: ${{ steps.finalize.outputs.SUCCESS }}
      SKIPPED: ${{ steps.finalize.outputs.SKIPPED }}
      FAILED: ${{ steps.finalize.outputs.FAILED }}
      ZIP_COUNT: ${{ steps.finalize.outputs.ZIP_COUNT }}
    env:
      FOLDER: ${{ github.event.inputs.folder }}
      RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
      RUN_ID: ${{ github.run_id }}
      URLS_FILE_INPUT: ${{ github.event.inputs.urls_file }}
      # Video ID extraction patterns (avoid YAML bracket parsing)
      VID_PAT1: "s#.*[?&]v=([^?&]+).*#\\1#"
      VID_PAT2: "s#.*/(shorts|embed|v)/([^?&/]+).*#\\2#"
      SANITIZE_PAT: "s#[\\\\/:*?\"<>|]#_#g; s/^[ .]+//; s/[ .]+$//; s/_{2,}/_/g"

    steps:
      # ----------------------------------------------------------
      # 1. התחלה: הגדרת לוג קבוע + התקנות
      # ----------------------------------------------------------
      - name: Checkout & Init persistent log
        shell: bash
        run: |
          echo "=== BATCH LOG START $(date -u) ===" > "${BATCH_LOG}"
          echo "Run ID: ${RUN_ID}" >> "${BATCH_LOG}"
          echo "Repo: ${{ github.repository }}" >> "${BATCH_LOG}"
          echo "Folder: ${FOLDER}" >> "${BATCH_LOG}"
          echo "URLs file: ${URLS_FILE_INPUT}" >> "${BATCH_LOG}"
          echo "Max files per ZIP: ${MAX_FILES_PER_ZIP}" >> "${BATCH_LOG}"
          echo "Max ZIP size (MB): ${MAX_ZIP_SIZE_MB}" >> "${BATCH_LOG}"
          echo "=====================================" >> "${BATCH_LOG}"
          echo "✅ Persistent log initialized at ${BATCH_LOG}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          echo "🔧 Installing system packages..." | tee -a "${BATCH_LOG}"
          curl -fsSL https://rclone.org/install.sh | sudo bash 2>&1 | tee -a "${BATCH_LOG}"
          sudo apt-get update -qq 2>&1 | tee -a "${BATCH_LOG}"
          # v10: ubuntu-24.04 comes with ffmpeg/zip/jq/curl/mediainfo/file/unzip pre-installed
          sudo apt-get install -y -qq msmtp msmtp-mta python3 python3-pip 2>&1 | tee -a "${BATCH_LOG}"
          pip3 install -q yt-dlp 2>&1 | tee -a "${BATCH_LOG}"
          for t in jq curl zip unzip mediainfo file msmtp ffmpeg; do command -v "$t" >/dev/null 2>&1 && echo "have: $t" || echo "no:   $t"; done
          echo "✅ Dependencies ready" | tee -a "${BATCH_LOG}"

      - name: Configure rclone
        shell: bash
        run: |
          echo "🔧 Configuring rclone..." | tee -a "${BATCH_LOG}"
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF
          echo "🔍 Testing rclone connection..." | tee -a "${BATCH_LOG}"
          rclone lsd gdrive: | head -5 2>&1 | tee -a "${BATCH_LOG}"
          echo "✅ rclone configured" | tee -a "${BATCH_LOG}"

      # ----------------------------------------------------------
      # 2. הכנת רשימת URLs
      # ----------------------------------------------------------
      - name: Download URLs artifact
        uses: actions/download-artifact@v4
        with:
          name: urls-txt
          path: /tmp/urls_input

      - name: Prepare URLs list
        id: prepare_urls
        shell: bash
        run: |
          set -e
          URLS_FILE="/tmp/urls_list.txt"
          
          echo "📝 Batch mode - reading URLs artifact"
          ARTIFACT_PATH="/tmp/urls_input/${URLS_FILE_INPUT}"
          
          echo "📥 Reading artifact..." | tee -a "${BATCH_LOG}"
          
          if [[ -f "$ARTIFACT_PATH" ]]; then
            echo "✅ Artifact found at $ARTIFACT_PATH" | tee -a "${BATCH_LOG}"
            grep -E '^https?://' "$ARTIFACT_PATH" | sed 's/#.*//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > "$URLS_FILE"
            TOTAL=$(wc -l < "$URLS_FILE")
            echo "📋 Total valid URLs parsed: $TOTAL" | tee -a "${BATCH_LOG}"
            echo "TOTAL=$TOTAL" >> $GITHUB_OUTPUT
            
            if [[ $TOTAL -eq 0 ]]; then
              echo "⚠️ No valid URLs found in file!" | tee -a "${BATCH_LOG}"
              echo "🔍 File content:" | tee -a "${BATCH_LOG}"
              cat "$ARTIFACT_PATH" | tee -a "${BATCH_LOG}"
            fi
          else
            echo "❌ URLs artifact not found at $ARTIFACT_PATH" | tee -a "${BATCH_LOG}"
            echo "🔍 Contents of /tmp/urls_input:" | tee -a "${BATCH_LOG}"
            ls -la /tmp/urls_input/ 2>&1 | tee -a "${BATCH_LOG}"
            echo "TOTAL=0" >> $GITHUB_OUTPUT
          fi
          
          echo "urls_file=$URLS_FILE" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 3. 🚀 הלולאה הראשית — עם הגנה מלאה על קריסות
      # ----------------------------------------------------------
      - name: Process all URLs in loop (loader.to resolver)
        id: batch_loop
        shell: bash
        env:
          SAVENOW_API: "dfcb6d76f2f6a9894gjkege8a4ab232222"
        run: |
          set +e
          set +o pipefail

          URLS_FILE="${{ steps.prepare_urls.outputs.urls_file }}"
          FOLDER="${FOLDER}"
          TMP_ROOT=$(mktemp -d)

          log() { echo "$@" | tee -a "${BATCH_LOG}"; }

          log ""
          log "📁 Work dir: $TMP_ROOT"
          log "📄 URLs file: $URLS_FILE"

          URLS=()
          while IFS= read -r line; do
            line=$(echo "$line" | sed 's/#.*//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [[ -z "$line" ]] && continue
            [[ "$line" =~ ^https?:// ]] && URLS+=("$line")
          done < "$URLS_FILE"

          TOTAL=${#URLS[@]}
          log "📋 Total valid URLs to process: $TOTAL"

          if [[ $TOTAL -eq 0 ]]; then
            log "⚠️ No valid URLs found."
            echo "TOTAL=0" >> $GITHUB_OUTPUT
            echo "SUCCESS=0" >> $GITHUB_OUTPUT
            echo "SKIPPED=0" >> $GITHUB_OUTPUT
            echo "FAILED=0" >> $GITHUB_OUTPUT
            echo "ZIP_COUNT=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          SUCCESS=0
          SKIPPED=0
          FAILED=0
          ZIP_COUNTER=1
          FILES_IN_CURRENT_ZIP=0
          MAX_FILES_PER_ZIP=${MAX_FILES_PER_ZIP}
          MAX_ZIP_SIZE_MB=${MAX_ZIP_SIZE_MB}

          CURRENT_ZIP_DIR=$(mktemp -d -p "$TMP_ROOT")
          CURRENT_ZIP_SIZE=0

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          SAVENOW_API="${SAVENOW_API}"

          # Validate if file is a video
          is_video(){
            local f="$1"
            [[ -s "$f" ]] || return 1
            if command -v mediainfo >/dev/null 2>&1; then
              mediainfo --Output=JSON "$f" 2>/dev/null | jq -e '.media.track[]? | select(."@type"? == "Video")' >/dev/null 2>&1 && return 0
            fi
            file -b "$f" 2>/dev/null | grep -qiE 'ISO Media|Matroska|WebM|MP4|video' && return 0
            return 1
          }

          # loader.to / p.savenow.to resolver
          resolve_loaderto(){
            local VIDEO_URL="$1" Q="$2"
            local r id du pu j i
            
            r=$(curl -sS -m 45 -A "$UA" -H 'Accept: application/json' -H 'Referer: https://loader.to/' -G \
                --data-urlencode "url=$VIDEO_URL" \
                --data-urlencode "copyright=0" --data-urlencode "allow_extended_duration=1" \
                --data-urlencode "add_info=1" --data-urlencode "no_merge=0" \
                --data-urlencode "format=$Q" --data-urlencode "api=$SAVENOW_API" \
                "https://p.savenow.to/ajax/download.php" 2>/dev/null)
            
            if ! jq -e . <<<"$r" >/dev/null 2>&1; then
              echo "  ❌ Not JSON response: ${r:0:70}" >> "${BATCH_LOG}"
              return 1
            fi
            
            TITLE=$(jq -r '.title // .info.title // empty' <<<"$r" 2>/dev/null)
            id=$(jq -r '.id // empty' <<<"$r")
            du=$(jq -r '.url // .download_url // empty' <<<"$r")
            
            if [[ -z "$id" && "$du" != http* ]]; then
              echo "  ❌ No job ID and no direct URL" >> "${BATCH_LOG}"
              return 1
            fi
            
            if [[ "$du" == http* ]]; then
              echo "$du"
              return 0
            fi
            
            pu=$(jq -r '.progress_url // empty' <<<"$r")
            [[ -z "$pu" ]] && pu="https://p.savenow.to/api/progress?id=$id"
            
            for i in $(seq 1 40); do
              j=$(curl -sS -m 30 -A "$UA" -H 'Accept: application/json' "$pu" 2>/dev/null)
              if jq -e . <<<"$j" >/dev/null 2>&1; then
                du=$(jq -r '.download_url // empty' <<<"$j")
                if [[ "$du" == http* ]]; then
                  echo "$du"
                  return 0
                fi
                if [[ "$(jq -r '.progress // 0' <<<"$j")" == "1000" ]]; then
                  echo "  ❌ Job failed: $(jq -c '{success,text,message}' <<<"$j" 2>/dev/null | head -c 70)" >> "${BATCH_LOG}"
                  return 1
                fi
              fi
              sleep 3
            done
            echo "  ❌ Timeout waiting for download URL" >> "${BATCH_LOG}"
            return 1
          }
          
          # Download and validate
          download_and_validate(){
            local RESOLVED="$1" VIDEO_URL="$2" WORK_DIR="$3"
            local R CODE CT EFF SZ EXT jar="$WORK_DIR/cookies.txt"
            
            echo "  downloading: ${RESOLVED:0:140}" >> "${BATCH_LOG}"
            R=$(curl -sS -L --max-redirs 8 --max-time 1800 -A "$UA" -e "$VIDEO_URL" -c "$jar" -b "$jar" \
                -o "$WORK_DIR/dl.bin" -w '%{http_code}|%{content_type}|%{url_effective}' "$RESOLVED" 2>>"${BATCH_LOG}")
            IFS='|' read -r CODE CT EFF <<< "$R"
            SZ=$(stat -c%s "$WORK_DIR/dl.bin" 2>/dev/null || echo 0)
            echo "  http=$CODE ct=$CT bytes=$SZ eff=${EFF:0:110}" >> "${BATCH_LOG}"

            # If savenow.to landing page instead of media, try ad walk once
            if [[ "$RESOLVED" == *savenow.to* && ( "$SZ" -lt 200000 ) ]] && ! is_video "$WORK_DIR/dl.bin"; then
              echo "  landing page instead of media -> ad_walk + retry" >> "${BATCH_LOG}"
              # ad walk
              for i in 1 2; do
                curl -sS -m 30 -A "$UA" -e 'https://loader.to/' -c "$jar" -b "$jar" \
                     -o "$WORK_DIR/ad.html" -L --max-redirs 6 --max-time 30 \
                     -w '    walk http=%{http_code} eff=%{url_effective}\n' "$RESOLVED" 2>/dev/null
                if [[ -s "$WORK_DIR/ad.html" && "$(stat -c%s "$WORK_DIR/ad.html")" -lt 5000 ]]; then
                  echo "    ad page ($(stat -c%s "$WORK_DIR/ad.html")b): $(head -c 300 "$WORK_DIR/ad.html" | tr -c '[:print:]" '.'')" >> "${BATCH_LOG}"
                fi
                sleep 5
              done
              R=$(curl -sS -L --max-redirs 10 --max-time 1800 -A "$UA" -e "https://loader.to/" -c "$jar" -b "$jar" \
                  -o "$WORK_DIR/dl.bin" -w '%{http_code}|%{content_type}|%{url_effective}' "$RESOLVED" 2>>"${BATCH_LOG}")
              IFS='|' read -r CODE CT EFF <<< "$R"
              SZ=$(stat -c%s "$WORK_DIR/dl.bin" 2>/dev/null || echo 0)
              echo "  retry http=$CODE ct=$CT bytes=$SZ eff=${EFF:0:110}" >> "${BATCH_LOG}"
            fi

            if [[ "$RESOLVED" == *.m3u8* || "$CT" == *mpegurl* ]]; then
              echo "  HLS stream -> ffmpeg" >> "${BATCH_LOG}"
              if ! command -v ffmpeg >/dev/null 2>&1; then
                sudo apt-get install -y -qq ffmpeg || { sudo apt-get update -qq; sudo apt-get install -y -qq ffmpeg; }
              fi
              ffmpeg -y -loglevel error -i "$RESOLVED" -c copy "$WORK_DIR/video.mp4" 2>>"${BATCH_LOG}"
              if [[ -s "$WORK_DIR/video.mp4" ]]; then
                echo "$WORK_DIR/video.mp4"
                return 0
              fi
              return 1
            fi

            if is_video "$WORK_DIR/dl.bin"; then
              case "$CT" in
                video/webm*)      EXT=webm ;;
                video/x-matroska*) EXT=mkv ;;
                *)                EXT=mp4 ;;
              esac
              mv "$WORK_DIR/dl.bin" "$WORK_DIR/video.$EXT"
              echo "$WORK_DIR/video.$EXT"
              return 0
            fi

            echo "  ⚠️ not a video file -> body head:" >> "${BATCH_LOG}"
            head -c 600 "$WORK_DIR/dl.bin" 2>/dev/null | tr -c '[:print:]" '.'; echo >> "${BATCH_LOG}"
            rm -f "$WORK_DIR/dl.bin"
            return 1
          }

          for i in "${!URLS[@]}"; do
            URL="${URLS[i]}"
            IDX=$((i+1))
            log ""
            log "=========================================="
            log "[$IDX/$TOTAL] Processing: $URL"
            log "=========================================="

            WORK_DIR=$(mktemp -d -p "$TMP_ROOT")
            
            # Extract YouTube video ID if applicable (patterns from env to avoid YAML bracket parsing)
            VIDEO_ID=$(printf '%s' "$URL" | sed -E "$VID_PAT1")
            [[ "$VIDEO_ID" == "$URL" || -z "$VIDEO_ID" ]] && VIDEO_ID=$(printf '%s' "$URL" | sed -E "$VID_PAT2")
            log "VIDEO_ID = ${VIDEO_ID:-none}"

            # Quality ladder
            QLADDER='1080 720 480 360'
            read -ra QS <<< "$QLADDER"
            TITLE=""

            RESOLVED=""
            DOWNLOADED_FILE=""

            for q in "${QS[@]}"; do
              log "  🔄 Attempting quality: $q"
              RESOLVED=$(resolve_loaderto "$URL" "$q")
              if [[ "$RESOLVED" == http* ]]; then
                log "  ✅ Resolved: ${RESOLVED:0:130}"
                DOWNLOADED_FILE=$(download_and_validate "$RESOLVED" "$URL" "$WORK_DIR")
                if [[ -n "$DOWNLOADED_FILE" && -s "$DOWNLOADED_FILE" ]]; then
                  log "  ✅ Downloaded: $(basename "$DOWNLOADED_FILE") ($(stat -c%s "$DOWNLOADED_FILE" 2>/dev/null || echo 0) bytes)"
                  break
                fi
              fi
              log "  ❌ Failed at quality $q"
              sleep 5
            done

            if [[ -n "$DOWNLOADED_FILE" && -s "$DOWNLOADED_FILE" ]]; then
              FSIZE=$(stat -c%s "$DOWNLOADED_FILE" 2>/dev/null || echo 0)
              
              if (( CURRENT_ZIP_SIZE + FSIZE > MAX_ZIP_SIZE_MB * 1024 * 1024 )) || (( FILES_IN_CURRENT_ZIP >= MAX_FILES_PER_ZIP )); then
                if (( FILES_IN_CURRENT_ZIP > 0 )); then
                  ZIP_NAME="${FOLDER}_part${ZIP_COUNTER}_$(date -u +%Y%m%d_%H%M%S).zip"
                  log "🗜️  Creating ZIP: $ZIP_NAME ($FILES_IN_CURRENT_ZIP files, $(numfmt --to=iec $CURRENT_ZIP_SIZE))"
                  (cd "$CURRENT_ZIP_DIR" && zip -j -q "$TMP_ROOT/$ZIP_NAME" ./*) 2>&1 | tee -a "${BATCH_LOG}"
                  log "🚀 Uploading to Drive..."
                  rclone copy "$TMP_ROOT/$ZIP_NAME" "gdrive:${FOLDER}/" --progress 2>&1 | tee -a "${BATCH_LOG}"
                  ((ZIP_COUNTER++))
                fi
                FILES_IN_CURRENT_ZIP=0
                CURRENT_ZIP_SIZE=0
                rm -rf "$CURRENT_ZIP_DIR"
                CURRENT_ZIP_DIR=$(mktemp -d -p "$TMP_ROOT")
              fi

              # Use video ID or title for filename
              if [[ -n "$TITLE" ]]; then
                INTERNAL_NAME=$(printf '%s' "$TITLE" | tr '\r\n\t' '   ' | sed -E "$SANITIZE_PAT" | head -c 180)
              else
                INTERNAL_NAME="${VIDEO_ID:-video_$IDX}"
              fi
              EXT="${DOWNLOADED_FILE##*.}"
              cp "$DOWNLOADED_FILE" "$CURRENT_ZIP_DIR/${INTERNAL_NAME}.${EXT}" 2>&1 | tee -a "${BATCH_LOG}"
              ((FILES_IN_CURRENT_ZIP++))
              ((CURRENT_ZIP_SIZE+=FSIZE))
              ((SUCCESS++))
            else
              log "❌ All loader.to quality attempts failed for: $URL"
              log "  🔄 Falling back to yt-dlp..."
              YT_DLP_FILE=$(mktemp -p "$WORK_DIR" ytdlp_XXXXXX.mp4)
              yt-dlp --no-playlist -f "best[ext=mp4]/best" -o "$YT_DLP_FILE" "$URL" >> "${BATCH_LOG}" 2>&1
              YT_DLP_EXIT=$?
              if [[ $YT_DLP_EXIT -eq 0 && -s "$YT_DLP_FILE" ]]; then
                DOWNLOADED_FILE="$YT_DLP_FILE"
                log "  ✅ yt-dlp downloaded: $(basename "$YT_DLP_FILE") ($(stat -c%s "$YT_DLP_FILE" 2>/dev/null || echo 0) bytes)"
              else
                log "  ❌ yt-dlp also failed (exit=$YT_DLP_EXIT)"
                log "--- Last 10 lines of yt-dlp output ---"
                tail -10 "${BATCH_LOG}" | tee -a "${BATCH_LOG}"
                ((FAILED++))
                rm -rf "$WORK_DIR"
                sleep 1
                continue
              fi
            fi

            rm -rf "$WORK_DIR"
            sleep 1
          done

          if (( FILES_IN_CURRENT_ZIP > 0 )); then
            ZIP_NAME="${FOLDER}_part${ZIP_COUNTER}_$(date -u +%Y%m%d_%H%M%S).zip"
            log "🗜️  Creating final ZIP: $ZIP_NAME ($FILES_IN_CURRENT_ZIP files, $(numfmt --to=iec $CURRENT_ZIP_SIZE))"
            (cd "$CURRENT_ZIP_DIR" && zip -j -q "$TMP_ROOT/$ZIP_NAME" ./*) 2>&1 | tee -a "${BATCH_LOG}"
            log "🚀 Uploading final ZIP..."
            rclone copy "$TMP_ROOT/$ZIP_NAME" "gdrive:${FOLDER}/" --progress 2>&1 | tee -a "${BATCH_LOG}"
          fi

          rm -rf "$TMP_ROOT"

          {
            echo "TOTAL=$TOTAL"
            echo "SUCCESS=$SUCCESS"
            echo "SKIPPED=$SKIPPED"
            echo "FAILED=$FAILED"
            echo "ZIP_COUNT=$((ZIP_COUNTER - 1))"
          } >> $GITHUB_OUTPUT

          log ""
          log "🎉 PROCESSING COMPLETE"
          log "   Total:   $TOTAL"
          log "   Success: $SUCCESS"
          log "   Skipped: $SKIPPED"
          log "   Failed:  $FAILED"
          log "   ZIPs:    $((ZIP_COUNTER - 1))"

      # ----------------------------------------------------------
      # 4. שלב סיום: רק מעביר outputs (רץ תמיד)
      # ----------------------------------------------------------
      - name: Finalize outputs
        id: finalize
        if: always()
        shell: bash
        run: |
          TOTAL="${{ steps.batch_loop.outputs.TOTAL }}"
          SUCCESS="${{ steps.batch_loop.outputs.SUCCESS }}"
          SKIPPED="${{ steps.batch_loop.outputs.SKIPPED }}"
          FAILED="${{ steps.batch_loop.outputs.FAILED }}"
          ZIP_COUNT="${{ steps.batch_loop.outputs.ZIP_COUNT }}"
          
          echo "TOTAL=${TOTAL:-0}" >> $GITHUB_OUTPUT
          echo "SUCCESS=${SUCCESS:-0}" >> $GITHUB_OUTPUT
          echo "SKIPPED=${SKIPPED:-0}" >> $GITHUB_OUTPUT
          echo "FAILED=${FAILED:-0}" >> $GITHUB_OUTPUT
          echo "ZIP_COUNT=${ZIP_COUNT:-0}" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 5. 📧 שליחת אימייל סיכום (אופציונלי)
      # ----------------------------------------------------------
      - name: Send summary email
        if: always() && env.EMAIL_PASSWORD != ''
        shell: bash
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: "p0556722432@gmail.com"
          EMAIL_FROM: "p0556722432@gmail.com"
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: "587"
          EMAIL_USER: "p0556722432@gmail.com"
          TOTAL: ${{ steps.finalize.outputs.TOTAL }}
          SUCCESS: ${{ steps.finalize.outputs.SUCCESS }}
          SKIPPED: ${{ steps.finalize.outputs.SKIPPED }}
          FAILED: ${{ steps.finalize.outputs.FAILED }}
          ZIP_COUNT: ${{ steps.finalize.outputs.ZIP_COUNT }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "📧 Preparing email..." | tee -a "${BATCH_LOG}"
          sudo apt-get update -qq && sudo apt-get install -y -qq msmtp msmtp-mta 2>&1 | tee -a "${BATCH_LOG}"

          mkdir -p ~/.msmtp
          cat > ~/.msmtprc <<EOF
          defaults
          auth on
          tls on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt
          logfile ~/.msmtp.log
          account gmail
          host $SMTP_SERVER
          port $SMTP_PORT
          from $EMAIL_FROM
          user $EMAIL_USER
          password $EMAIL_PASSWORD
          account default : gmail
          EOF
          chmod 600 ~/.msmtprc

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SUBJECT="📦 [Batch ${JOB_STATUS^^}] URL Batch Download - ${{ github.repository }} (Run ${{ github.run_id }})"
          BODY="סיכום עיבוד אצווה הושלם בסטטוס: ${JOB_STATUS}.\n\n"
          BODY+="🏃 Run: ${{ github.run_id }}\n"
          BODY+="📂 תיקייה בדרייב: ${{ github.event.inputs.folder }}\n"
          BODY+="📄 קובץ לינקים: ${{ github.event.inputs.urls_file }}\n"
          BODY+="🔗 לינק לריצה: $RUN_URL\n\n"
          BODY+="📊 סטטיסטיקות:\n"
          BODY+="  • סה\"כ לינקים: ${TOTAL:-0}\n"
          BODY+="  • ✅ הצליחו: ${SUCCESS:-0}\n"
          BODY+="  • ⏭️ דולגו: ${SKIPPED:-0}\n"
          BODY+="  • ❌ נכשלו: ${FAILED:-0}\n"
          BODY+="  • 📦 קבצי ZIP שנוצרו: ${ZIP_COUNT:-0}\n"

          if [[ -f "${BATCH_LOG}" ]]; then
            BODY+="\n📋 זנב הלוג המלא (50 שורות אחרונות):\n"
            TAIL_LOG=$(tail -50 "${BATCH_LOG}" 2>/dev/null | sed 's/^/  /')
            BODY+="$TAIL_LOG\n"
          fi

          echo -e "Subject: $SUBJECT\nFrom: $EMAIL_FROM\nTo: $EMAIL_TO\nContent-Type: text/plain; charset=UTF-8\n\n$BODY" | msmtp -a gmail "$EMAIL_TO" 2>&1 | tee -a "${BATCH_LOG}"
          echo "✅ Summary email sent" | tee -a "${BATCH_LOG}"

  # ==============================================================
  # 3️⃣  Job סיכום סופי
  # ==============================================================
  final_summary:
    needs: [process]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print final stats
        run: |
          echo "=== FINAL BATCH SUMMARY ==="
          echo "Run ID: ${{ github.run_id }}"
          echo "Repository: ${{ github.repository }}"
          echo "URLs file: ${{ github.event.inputs.urls_file }}"
          echo "Folder: ${{ github.event.inputs.folder }}"
          echo "Total URLs: ${{ needs.process.outputs.TOTAL }}"
          echo "Success:    ${{ needs.process.outputs.SUCCESS }}"
          echo "Skipped:    ${{ needs.process.outputs.SKIPPED }}"
          echo "Failed:     ${{ needs.process.outputs.FAILED }}"
          echo "ZIPs:       ${{ needs.process.outputs.ZIP_COUNT }}"
          echo "============================="

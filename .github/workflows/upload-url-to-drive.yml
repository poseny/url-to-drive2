# .github/workflows/upload-url-to-drive.yml
name: הורדת דפים מלאים הכוללת טעינת כל הסרטונים (MHTML → ZIP → Google Drive)

# מוריד דף אינטרנט אחרי שטען את כל הסרטונים על ידי גלילה עד הסוף,
# ומעלה אותו ל-Google Drive כקובץ MHTML דחוס ל-ZIP.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "כתובת ה-URL של הדף או הקובץ להורדה"
        required: true
        default: "https://commons.wikimedia.org/w/index.php?title=Special%3AMediaSearch&search=home&type=video"
      folder:
        description: "תיקיית יעד ב‑Drive (ללא שם קובץ)"
        required: true
        default: "MyUploads"
      filename:
        description: "שם קובץ לפני .zip (אם ריק – ייקח משם הקובץ ב‑URL)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # --------------------------------------------------------------
      # 1️⃣  התקנת כלי עבודה + msmtp
      # --------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone chromium-browser zip curl msmtp msmtp-mta > /dev/null
          echo "✅ Dependencies installed"

      # --------------------------------------------------------------
      # 2️⃣  קונפיג rclone
      # --------------------------------------------------------------
      - name: Write rclone config
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF
          echo "✅ rclone configured"

      # --------------------------------------------------------------
      # 3️⃣  חישוב שמות וקביעת סוג התוכן
      # --------------------------------------------------------------
      - name: Determine file names and type
        id: names
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          USER_NAME: ${{ github.event.inputs.filename }}
        run: |
          set -e

          raw_name=$(basename "$FILE_URL")
          raw_name=${raw_name%%\?*}
          decoded_name=$(printf '%b' "$(echo -e "${raw_name//%/\\x}")")
          echo "🔤 Decoded name from URL = $decoded_name"

          is_html=false
          content_type=$(curl -sI -L "$FILE_URL" | grep -i '^content-type:' | head -1 | cut -d' ' -f2- | tr -d '\r')
          if [[ "$content_type" =~ text/html ]]; then
            is_html=true
          fi

          if [[ -n "$USER_NAME" ]]; then
            base_name="$USER_NAME"
          else
            base_name="${decoded_name%.*}"
            if [[ "$base_name" == "$decoded_name" ]] || [[ "$is_html" == "true" ]]; then
              base_name="page_$(date +%Y%m%d_%H%M%S)"
            fi
          fi

          if [[ "$is_html" == "true" ]]; then
            original_name="${base_name}.mhtml"
            zip_name="${base_name}.zip"
          else
            original_name="$decoded_name"
            zip_name="${base_name}.zip"
          fi

          remote_path="gdrive:${{ github.event.inputs.folder }}/$zip_name"

          echo "is_html=$is_html" >> $GITHUB_OUTPUT
          echo "original_name=$original_name" >> $GITHUB_OUTPUT
          echo "zip_name=$zip_name" >> $GITHUB_OUTPUT
          echo "remote_path=$remote_path" >> $GITHUB_OUTPUT
          echo "base_name=$base_name" >> $GITHUB_OUTPUT

          echo "📦 ZIP name on Drive      = $zip_name"
          echo "📁 Internal file name     = $original_name"
          echo "🌐 Is HTML page          = $is_html"

      # --------------------------------------------------------------
      # 4️⃣  מחיקת קובץ קיים
      # --------------------------------------------------------------
      - name: Delete old ZIP if exists
        env:
          REMOTE_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            echo "🗑️ Deleting previous $REMOTE_PATH"
            rclone delete "$REMOTE_PATH"
          else
            echo "✅ No previous ZIP found"
          fi

      # --------------------------------------------------------------
      # 5️⃣  הורדה / לכידת דף → ZIP → העלאה
      # --------------------------------------------------------------
      - name: הורדת דף מלא (לאחר טעינת כל הסרטונים) → ZIP → העלאה ל-Drive
        id: process
        env:
          FILE_URL: ${{ github.event.inputs.url }}
          ORIGINAL_NAME: ${{ steps.names.outputs.original_name }}
          ZIP_NAME: ${{ steps.names.outputs.zip_name }}
          DEST_PATH: ${{ steps.names.outputs.remote_path }}
          IS_HTML: ${{ steps.names.outputs.is_html }}
          BASE_NAME: ${{ steps.names.outputs.base_name }}
          TARGET_FOLDER: ${{ github.event.inputs.folder }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPO_NAME: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR_NAME: ${{ github.actor }}
        run: |
          set -e
          set -o pipefail

          LOG_FILE="$RUNNER_TEMP/process.log"
          exec > >(tee -a "$LOG_FILE") 2>&1

          echo "🚀 Starting process at $(date)"
          echo "URL: $FILE_URL"
          echo "Is HTML: $IS_HTML"
          echo "Log file: $LOG_FILE"

          TMP_DIR=$(mktemp -d)
          TMP_ZIP="${TMP_DIR}/${ZIP_NAME}"
          echo "📂 Working directory = $TMP_DIR"

          if [[ "$IS_HTML" == "true" ]]; then
            MHTML_FILE="${TMP_DIR}/${ORIGINAL_NAME}"
            echo "🌐 מוריד את הדף ושומר אותו כ-MHTML אחרי טעינת כל הסרטונים (Puppeteer/Node.js)..."
            echo "⏳ גוללים עד תחתית הדף עד שכל התוצאות נטענו."

            # ---- התקנת Node.js + Puppeteer ----
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y -qq nodejs > /dev/null
            cd "$TMP_DIR"
            npm init -y > /dev/null
            npm install puppeteer@22 --omit=dev > /dev/null 2>&1

            # ---- סקריפט Puppeteer: גלילה עד סוף התוצאות + כפתור "Load more" ----
            cat > save-mhtml.js <<'ENDOFSCRIPT'
          const puppeteer = require('puppeteer');
          const fs = require('fs');

          const url = process.argv[2];
          const outputPath = process.argv[3];

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            const browser = await puppeteer.launch({
              headless: 'shell',
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--disable-gpu',
                '--disable-web-security',
                '--disable-features=VizDisplayCompositor',
                '--single-process',
                '--no-zygote'
              ]
            });

            try {
              const page = await browser.newPage();

              // ---- חסימה סלקטיבית: רק דומייני טראקינג/פרסומות ----
              await page.setRequestInterception(true);
              page.on('request', (req) => {
                const reqUrl = req.url();
                const blockedDomains = [
                  'googletagmanager', 'google-analytics', 'googlesyndication',
                  'facebook.net', 'connect.facebook.net',
                  'taboola', 'outbrain', 'revcontent',
                  'doubleclick', 'googletagservices',
                  'adsafeprotected', 'iasds01', 'moatads',
                  'scorecardresearch', 'quantserve',
                  'adisruptor', 'adnxs', 'rubiconproject',
                  'pubmatic', 'openx', 'criteo',
                  'hotjar', 'fullstory', 'mouseflow',
                  'optimizely', 'vwo', 'abtest',
                  'segment', 'mixpanel', 'amplitude',
                  'intercom', 'drift', 'zendesk',
                  'recaptcha', 'hcaptcha'
                ];
                if (blockedDomains.some((d) => reqUrl.includes(d))) {
                  return req.abort('blockedbyclient');
                }
                req.continue();
              });

              await page.setUserAgent('Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');
              await page.setViewport({ width: 1920, height: 1080 });

              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });

              // מחכים שה-Vue app יבצע mount (רלוונטי ל-MediaSearch)
              for (const sel of ['.sdms-search-results__list', '.sdms-video-result', '#sdms-app', 'main', 'body']) {
                try {
                  await page.waitForSelector(sel, { timeout: 15000 });
                  console.log('✅ Content mounted: ' + sel);
                  break;
                } catch (e) { /* keep trying the next selector */ }
              }
              await sleep(2000);

              const scrollToBottom = () => page.evaluate(() => {
                window.scrollTo(0, Math.max(document.body.scrollHeight, document.documentElement.scrollHeight));
              });

              const waitForSettle = async () => {
                try { await page.waitForNetworkIdle({ idleTime: 1200, timeout: 8000 }); } catch (e) {}
                await sleep(400);
              };

              const isMediaSearch = await page.evaluate(() => !!document.querySelector('.sdms-search-results__list'));

              if (isMediaSearch) {
                console.log('🖼️  Detected Wikimedia MediaSearch — scrolling + clicking "Load more" to the end...');

                const resultSelector = '.sdms-video-result, .sdms-image-result, .sdms-audio-result, .sdms-page-result, .sdms-other-result';

                const getState = () => page.evaluate((sel) => {
                  const results = document.querySelectorAll(sel);
                  const loadMoreBtn = document.querySelector('.sdms-load-more');
                  const textLoadMore = Array.from(document.querySelectorAll('button')).find((b) =>
                    /load more|show more|more results|טען עוד|עוד תוצאות/i.test(b.textContent || '')
                  );
                  const endEl = document.querySelector('.sdms-end-of-results');
                  const textEnd = /no more results|end of results|אין עוד תוצאות/i.test(document.body.innerText || '');
                  const pending = document.querySelector('.sdms-search-results__pending');
                  return {
                    count: results.length,
                    height: Math.max(document.body.scrollHeight, document.documentElement.scrollHeight),
                    hasLoadMore: !!loadMoreBtn || !!textLoadMore,
                    ended: !!endEl || textEnd,
                    loading: !!pending
                  };
                }, resultSelector);

                const MAX_ROUNDS = 400;
                const STABLE_TO_STOP = 3;
                let lastCount = -1;
                let lastHeight = -1;
                let stable = 0;

                for (let i = 0; i < MAX_ROUNDS; i++) {
                  await scrollToBottom();
                  await waitForSettle();

                  const s = await getState();

                  if (s.ended) {
                    console.log('✅ Reached the end of results: ' + s.count + ' results');
                    break;
                  }

                  if (s.loading) {
                    // עוד בקשה בתהליך — נחכה קצת ונבדוק שוב
                    await sleep(1500);
                    continue;
                  }

                  if (s.hasLoadMore) {
                    console.log('🖱️  Clicking "Load more" (' + s.count + ' results so far)');
                    await page.evaluate(() => {
                      const btn = document.querySelector('.sdms-load-more') ||
                        Array.from(document.querySelectorAll('button')).find((b) =>
                          /load more|show more|more results|טען עוד|עוד תוצאות/i.test(b.textContent || '')
                        );
                      if (btn) btn.click();
                    });
                    stable = 0;
                    await sleep(1000);
                    continue;
                  }

                  if (s.count === lastCount && s.height === lastHeight) {
                    stable += 1;
                    if (stable >= STABLE_TO_STOP) {
                      console.log('🛑 No new results after ' + STABLE_TO_STOP + ' stable rounds (' + s.count + ' results)');
                      break;
                    }
                  } else {
                    stable = 0;
                    lastCount = s.count;
                    lastHeight = s.height;
                    console.log('📜 ' + s.count + ' results so far (page height ' + s.height + 'px)');
                  }

                  await sleep(700);
                }
              } else {
                console.log('📄 Generic page — scrolling to the bottom until the page stops growing...');
                let lastHeight = -1;
                let stable = 0;
                for (let i = 0; i < 200; i++) {
                  await scrollToBottom();
                  await waitForSettle();
                  const height = await page.evaluate(() => Math.max(document.body.scrollHeight, document.documentElement.scrollHeight));
                  if (height === lastHeight) {
                    stable += 1;
                    if (stable >= 4) break;
                  } else {
                    stable = 0;
                    lastHeight = height;
                  }
                  await sleep(500);
                }
              }

              // ---- מאלצים תמונות lazy-load להיטען כדי שייכנסו לתוך ה-MHTML ----
              await page.evaluate(() => {
                const imgs = Array.from(document.querySelectorAll('img'));
                for (const img of imgs) {
                  const src = img.dataset.src || img.getAttribute('src');
                  img.loading = 'eager';
                  img.decoding = 'async';
                  if (img.dataset.src) {
                    img.src = img.dataset.src;
                  } else if (src) {
                    img.src = src; // טוען מחדש תמונות native-lazy שמחוץ ל-viewport
                  }
                }
                window.scrollTo(0, 0);
              });
              try { await page.waitForNetworkIdle({ idleTime: 2000, timeout: 30000 }); } catch (e) {}

              const totalResults = await page.evaluate(() =>
                document.querySelectorAll('.sdms-video-result, .sdms-image-result, .sdms-audio-result, .sdms-page-result, .sdms-other-result').length
              );
              console.log('🎬 Final result count: ' + totalResults);

              // ---- שמירה כ-MHTML דרך CDP ----
              const client = await page.target().createCDPSession();
              const result = await client.send('Page.captureSnapshot', { format: 'mhtml' });
              fs.writeFileSync(outputPath, result.data);
              console.log('✅ MHTML saved: ' + outputPath + ' (' + (result.data.length / 1024 / 1024).toFixed(2) + ' MB)');

            } catch (err) {
              console.error('❌ Error: ' + (err && err.message ? err.message : err));
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          ENDOFSCRIPT

            # ---- הרצה ----
            node save-mhtml.js "$FILE_URL" "$MHTML_FILE" 2>&1 | tail -40

            if [[ ! -s "$MHTML_FILE" ]]; then
              echo "❌ MHTML capture failed – file is empty or not created"
              ls -la "$TMP_DIR/"
              exit 1
            fi

            echo "✅ MHTML captured successfully ($(du -h "$MHTML_FILE" | cut -f1))"
            INTERNAL_FILE="$MHTML_FILE"
          else
            DOWNLOADED_FILE="${TMP_DIR}/downloaded_file"
            echo "⬇️ Downloading $FILE_URL → $DOWNLOADED_FILE"
            curl -L -s -o "$DOWNLOADED_FILE" "$FILE_URL" --max-time 300 --retry 3 --retry-delay 5

            if [[ ! -s "$DOWNLOADED_FILE" ]]; then
              echo "❌ Download failed or file is empty"
              exit 1
            fi

            echo "✅ Downloaded successfully ($(du -h "$DOWNLOADED_FILE" | cut -f1))"
            cp "$DOWNLOADED_FILE" "${TMP_DIR}/${ORIGINAL_NAME}"
            INTERNAL_FILE="${TMP_DIR}/${ORIGINAL_NAME}"
          fi

          echo "🗜️ Creating ZIP $TMP_ZIP with internal name '$ORIGINAL_NAME'"
          (cd "$TMP_DIR" && zip -j -q "$TMP_ZIP" "$ORIGINAL_NAME")

          if [[ ! -s "$TMP_ZIP" ]]; then
            echo "❌ Zip creation failed – file is empty"
            exit 1
          fi

          echo "✅ ZIP created ($(du -h "$TMP_ZIP" | cut -f1))"

          echo "🚀 Uploading ZIP to Drive: $DEST_PATH"
          rclone copy "$TMP_ZIP" "$DEST_PATH" --progress --drive-chunk-size 64M

          echo "✅ Finished – ZIP uploaded successfully at $(date)"

      # --------------------------------------------------------------
      # 6️⃣  שליחת אימייל במקרה כישלון
      # --------------------------------------------------------------
      - name: Send email on failure
        if: failure()
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          INPUT_URL: ${{ github.event.inputs.url }}
          INPUT_FOLDER: ${{ github.event.inputs.folder }}
        run: |
          set -e

          LOG_FILE="$RUNNER_TEMP/process.log"
          LOG_CONTENT=$(cat "$LOG_FILE" 2>/dev/null || echo "Log file not found: $LOG_FILE")

          echo "📧 Preparing failure email..."
          echo "Log file: $LOG_FILE"
          echo "Log size: $(wc -c < "$LOG_FILE" 2>/dev/null || echo 0) bytes"

          ERROR_SUMMARY=$(echo "$LOG_CONTENT" | grep -E "(❌|Error|FAILED|exit 1|failed)" -i | head -5 | sed 's/"/\\"/g' || echo "No specific error pattern found")

          printf "defaults\nauth           on\ntls            on\ntls_trust_file /etc/ssl/certs/ca-certificates.crt\nlogfile        ~/.msmtp.log\n\naccount        gmail\nhost           smtp.gmail.com\nport           587\nfrom           p0556722432@gmail.com\nuser           p0556722432@gmail.com\npassword       %s\n\naccount default : gmail\n" "$EMAIL_PASSWORD" > ~/.msmtprc
          chmod 600 ~/.msmtprc

          {
            echo "From: p0556722432@gmail.com"
            echo "To: p0556722432@gmail.com"
            echo "Subject: ❌ GitHub Actions Failed: $WORKFLOW"
            echo "Content-Type: text/plain; charset=UTF-8"
            echo ""
            echo "שלום,"
            echo ""
            echo "הריצה של ה-workflow **$WORKFLOW** נכשלה."
            echo ""
            echo "📋 פרטי הריצה:"
            echo "- ריפו: $REPO"
            echo "- מריץ: $ACTOR"
            echo "- קישור לריצה: $RUN_URL"
            echo "- זמן: $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "🔗 URL שעובד:"
            echo "$INPUT_URL"
            echo ""
            echo "📂 תיקיית יעד:"
            echo "$INPUT_FOLDER"
            echo ""
            echo "⚠️ תקציר שגיאה:"
            echo "$ERROR_SUMMARY"
            echo ""
            echo "📄 לוג מלא (100 שורות אחרונות):"
            echo "$LOG_CONTENT" | tail -100
            echo ""
            echo "---"
            echo "נשלח אוטומטית מ-GitHub Actions"
          } | msmtp --debug -a gmail p0556722432@gmail.com 2>&1

          echo "📧 Failure email sent successfully"

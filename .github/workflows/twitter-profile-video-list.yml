name: X/Twitter Profile → Video Links List → Google Drive (RSSHub - No Auth)

on:
  workflow_dispatch:
    inputs:
      profile_url:
        description: "קישור לפרופיל (https://x.com/username או https://twitter.com/username)"
        required: true
        default: "https://x.com/YinonMagal"
      days:
        description: "כמה ימים אחורה לסרוק (1-365)"
        required: true
        default: "30"
      filename:
        description: "שם קובץ הפלט (בלי סיומת, ריק = אוטומטי)"
        required: false
        default: ""
      folder:
        description: "תיקיית יעד ב‑Google Drive"
        required: true
        default: "TwitterVideoLists"

env:
  EMAIL_TO: "p0556722432@gmail.com"
  EMAIL_FROM: "p0556722432@gmail.com"
  SMTP_SERVER: "smtp.gmail.com"
  SMTP_PORT: "587"
  EMAIL_USER: "p0556722432@gmail.com"
  # הגדרות RSSHub
  RSSHUB_BASE: "https://rsshub.app"
  USER_AGENT: "Mozilla/5.0 (compatible; GitHub Actions RSSHub Client)"

jobs:
  list_videos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      # ==============================================================
      # 0️⃣  אתחול לוג
      # ==============================================================
      - name: Init log
        shell: bash
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          echo "LOG_FILE=$LOG_FILE" >> $GITHUB_ENV
          {
            echo "=== X/Twitter Profile Video Lister (RSSHub) ==="
            echo "Run ID: ${{ github.run_id }}"
            echo "Run Number: ${{ github.run_number }}"
            echo "Repo: ${{ github.repository }}"
            echo "Actor: ${{ github.actor }}"
            echo "Started: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo "Profile: ${{ github.event.inputs.profile_url }}"
            echo "Days back: ${{ github.event.inputs.days }}"
            echo "Folder: ${{ github.event.inputs.folder }}"
            echo "=================================================="
            echo ""
          } > "$LOG_FILE"

      # ==============================================================
      # 1️⃣  התקנת תלויות (jq, xq, rclone, msmtp)
      # ==============================================================
      - name: Install dependencies
        continue-on-error: true
        shell: bash
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "🔧 [$(date -u +"%H:%M:%S")] Installing dependencies..."
          
          # rclone
          curl -fsSL https://rclone.org/install.sh | sudo bash
          
          # jq, xq (xml->json), msmtp, xmlstarlet (לגיבוי)
          sudo apt-get update -qq && sudo apt-get install -y -qq jq yq msmtp msmtp-mta xmlstarlet
          
          echo "✅ Dependencies installed"

      # ==============================================================
      # 2️⃣  קונפיג rclone
      # ==============================================================
      - name: Configure rclone
        continue-on-error: true
        shell: bash
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "🔧 [$(date -u +"%H:%M:%S")] Configuring rclone..."
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF
          rclone lsd gdrive: | head -5
          echo "✅ rclone configured"

      # ==============================================================
      # 3️⃣  שליפת רשימת ציוצי וידאו דרך RSSHub (ללא Cookies!)
      # ==============================================================
      - name: Fetch video tweets via RSSHub
        continue-on-error: true
        id: fetch_rss
        shell: bash
        env:
          PROFILE_URL: ${{ github.event.inputs.profile_url }}
          DAYS: ${{ github.event.inputs.days }}
          USER_FILENAME: ${{ github.event.inputs.filename }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "🚀 [$(date -u +"%H:%M:%S")] Fetching via RSSHub..."
          set -e
          set -o pipefail

          USERNAME=$(echo "$PROFILE_URL" | sed -E 's|.*[/:]([^/?]+)(\?.*)?$|\1|')
          CUTOFF_TS=$(date -u -d "-${DAYS} days" +%s)
          
          TMP_DIR=$(mktemp -d)
          
          if [[ -n "$USER_FILENAME" ]]; then
            OUT_BASE="$USER_FILENAME"
          else
            OUT_BASE="${USERNAME}_videos_last_${DAYS}days_$(date -u +%Y%m%d)"
          fi
          OUT_TXT="${TMP_DIR}/${OUT_BASE}.txt"
          REMOTE_PATH="gdrive:${{ github.event.inputs.folder }}/${OUT_BASE}.txt"

          echo "   Username: $USERNAME"
          echo "   Cutoff: $(date -u -d @${CUTOFF_TS}) (TS: $CUTOFF_TS)"
          echo "   Output: ${OUT_BASE}.txt"

          # ---- בקשה ל-RSSHub ----
          # מסלול: /twitter/user/:username
          RSS_URL="${RSSHUB_BASE}/twitter/user/${USERNAME}"
          echo "   Requesting: $RSS_URL"

          # הורדת ה-RSS (XML) עם timeout ו-retry
          RSS_XML=$(curl -sL --retry 3 --retry-delay 5 \
            -H "User-Agent: ${USER_AGENT}" \
            -H "Accept: application/xml, application/rss+xml" \
            "$RSS_URL" --max-time 30)

          # בדיקה שקיבלנו XML תקין
          if ! echo "$RSS_XML" | grep -q "<rss\|<feed"; then
            echo "❌ RSSHub returned invalid/empty response:"
            echo "$RSS_XML" | head -c 500
            echo "STATUS=failed" >> $GITHUB_OUTPUT
            rm -rf "$TMP_DIR"
            exit 0
          fi

          # ---- פירסור XML + סינון ----
          # נשתמש ב-yq (תומך XML) או xmlstarlet
          # yq v4+ תומך XML ישירות: yq -x '.rss.channel.item[]'
          # נמיר ל-JSON ונפענח עם jq
          
          echo "$RSS_XML" | yq -o=json '.' | jq -r --argjson cutoff "$CUTOFF_TS" '
            # תומך גם ב-RSS 2.0 (.rss.channel.item) וגם ב-Atom (.feed.entry)
            ( .rss.channel.item // .feed.entry // [] ) 
            | .[] 
            | select(.pubDate or .published) 
            | .pubDate_str = (.pubDate // .published)
            | .pubDate_ts = (.pubDate_str | sub("(?<wkday>\\w+), (?<day>\\d+) (?<mon>\\w+) (?<year>\\d+) (?<time>\\d+:\\d+:\\d+) (?<tz>\\S+)"; "\(.day) \(.mon) \(.year) \(.time) \(.tz)") | strptime("%d %b %Y %H:%M:%S %Z") | mktime)
            | select(.pubDate_ts >= $cutoff)
            | .link_href = (.link // .link.href // .link["@href"] // "")
            | .description_text = (.description // .content // .summary // "")
            | select(.link_href | startswith("https://twitter.com") or startswith("https://x.com"))
            | select(.description_text | test("video|Video|VIDEO|\\.mp4|\\.m3u8|enclosure.*video"; "i"))
            | .link_href
            | sub("https://twitter.com"; "https://x.com")
          ' > "$OUT_TXT"

          # הסרת כפילויות (לפעמים יש כפילויות ב-RSS)
          if [[ -s "$OUT_TXT" ]]; then
            sort -u "$OUT_TXT" -o "$OUT_TXT"
          fi

          if [[ ! -s "$OUT_TXT" ]]; then
            echo "⚠️ No video tweets found in last ${DAYS} days via RSSHub."
            echo "# No video tweets found via RSSHub for ${PROFILE_URL} in last ${DAYS} days (as of $(date -u))" > "$OUT_TXT"
            COUNT=0
          else
            COUNT=$(wc -l < "$OUT_TXT")
            echo "✅ Found $COUNT video tweet(s) via RSSHub."
          fi

          # ---- העלאה ל-Drive ----
          echo "🚀 [$(date -u +"%H:%M:%S")] Uploading to Drive..."
          rclone copy "$OUT_TXT" "$REMOTE_PATH" --progress
          RCLONE_EXIT=$?
          [[ $RCLONE_EXIT -ne 0 ]] && { echo "❌ rclone exit: $RCLONE_EXIT"; exit $RCLONE_EXIT; }

          rm -rf "$TMP_DIR"
          echo "✅ [$(date -u +"%H:%M:%S")] SUCCESS"

          echo "STATUS=success" >> $GITHUB_OUTPUT
          echo "FILE_NAME=${OUT_BASE}.txt" >> $GITHUB_OUTPUT
          echo "TWEET_COUNT=$COUNT" >> $GITHUB_OUTPUT
          echo "REMOTE_PATH=$REMOTE_PATH" >> $GITHUB_OUTPUT

      # ==============================================================
      # 4️⃣  שליחת אימייל
      # ==============================================================
      - name: Send log email
        if: always()
        shell: bash
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          STATUS: ${{ steps.fetch_rss.outputs.STATUS }}
          FILE_NAME: ${{ steps.fetch_rss.outputs.FILE_NAME }}
          TWEET_COUNT: ${{ steps.fetch_rss.outputs.TWEET_COUNT }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "📧 [$(date -u +"%H:%M:%S")] Preparing email..."

          if [[ -z "$EMAIL_PASSWORD" ]]; then
            echo "⚠️ EMAIL_PASSWORD secret is EMPTY – skipping email send"
            exit 0
          fi

          mkdir -p ~/.msmtp
          cat > ~/.msmtprc <<EOF
          defaults
          auth on
          tls on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt
          logfile ~/.msmtp.log
          account gmail
          host $SMTP_SERVER
          port $SMTP_PORT
          from $EMAIL_FROM
          user $EMAIL_USER
          password $EMAIL_PASSWORD
          account default : gmail
          EOF
          chmod 600 ~/.msmtprc

          if [[ "$STATUS" == "success" ]]; then
            SUBJECT="✅ [GitHub Actions] X Profile Video List Ready - ${{ github.repository }}"
            BODY="הסריקה הושלמה בהצלחה (דרך RSSHub - ללא התחברות).\n\n"
            BODY+="📁 קובץ: $FILE_NAME\n"
            BODY+="🔗 ציוצי וידאו שנמצאו: ${TWEET_COUNT:-0}\n"
            BODY+="🛠️ שיטה: RSSHub Public API (ללא Cookies)\n"
            BODY+="📂 תיקייה: ${{ github.event.inputs.folder }}\n"
            BODY+="👤 פרופיל: ${{ github.event.inputs.profile_url }}\n"
            BODY+="📅 טווח: ${{ github.event.inputs.days }} ימים אחורה\n"
            BODY+="🏃 Run: ${{ github.run_id }} (${{ github.run_number }})\n"
            BODY+="⏱️ זמן: $(date -u +"%Y-%m-%d %H:%M:%S UTC")\n"
          else
            SUBJECT="❌ [GitHub Actions] X Profile Video List FAILED - ${{ github.repository }}"
            BODY="הסריקה נכשלה. מצורף לוג מלא.\n\n"
            BODY+="👤 פרופיל: ${{ github.event.inputs.profile_url }}\n"
            BODY+="🏃 Run: ${{ github.run_id }} (${{ github.run_number }})\n"
            BODY+="⏱️ זמן: $(date -u +"%Y-%m-%d %H:%M:%S UTC")\n"
          fi

          BODY+="\n--- Last 50 lines of log ---\n"
          BODY+=$(tail -50 "$LOG_FILE")

          echo -e "Subject: $SUBJECT\nFrom: $EMAIL_FROM\nTo: $EMAIL_TO\nContent-Type: text/plain; charset=UTF-8\n\n$BODY" | msmtp -a gmail "$EMAIL_TO"
          echo "✅ Email sent to $EMAIL_TO"

      # ==============================================================
      # 5️⃣  העלאת לוג כ-Artifact
      # ==============================================================
      - name: Upload log as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-log-${{ github.run_id }}
          path: ${{ runner.temp }}/workflow_log.txt
          retention-days: 7
          if-no-files-found: warn

      # ==============================================================
      # 6️⃣  סיכום סופי
      # ==============================================================
      - name: Final summary
        if: always()
        shell: bash
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "=== FINAL SUMMARY ==="
          echo "Run: ${{ github.run_id }}"
          echo "Status: ${{ steps.fetch_rss.outputs.STATUS || 'failed' }}"
          echo "Tweets found: ${{ steps.fetch_rss.outputs.TWEET_COUNT || '0' }}"
          echo "Log lines: $(wc -l < "$LOG_FILE")"
          echo "====================="
          if [[ "${{ steps.fetch_rss.outputs.STATUS }}" != "success" ]]; then
            exit 1
          fi

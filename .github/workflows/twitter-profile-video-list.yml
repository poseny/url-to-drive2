name: X/Twitter Profile → Video Links List → Google Drive (Nitter - Robust)

on:
  workflow_dispatch:
    inputs:
      profile_url:
        description: "קישור לפרופיל (https://x.com/username או https://twitter.com/username)"
        required: true
        default: "https://x.com/YinonMagal"
      days:
        description: "כמה ימים אחורה לסרוק (1-365)"
        required: true
        default: "30"
      filename:
        description: "שם קובץ הפלט (בלי סיומת, ריק = אוטומטי)"
        required: false
        default: ""
      folder:
        description: "תיקיית יעד ב‑Google Drive"
        required: true
        default: "TwitterVideoLists"

env:
  EMAIL_TO: "p0556722432@gmail.com"
  EMAIL_FROM: "p0556722432@gmail.com"
  SMTP_SERVER: "smtp.gmail.com"
  SMTP_PORT: "587"
  EMAIL_USER: "p0556722432@gmail.com"

jobs:
  list_videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
      # ==============================================================
      # 0️⃣  אתחול לוג
      # ==============================================================
      - name: Init log
        shell: bash
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          echo "LOG_FILE=$LOG_FILE" >> $GITHUB_ENV
          {
            echo "=== X/Twitter Profile Video Lister (Nitter Robust) ==="
            echo "Run ID: ${{ github.run_id }}"
            echo "Run Number: ${{ github.run_number }}"
            echo "Repo: ${{ github.repository }}"
            echo "Actor: ${{ github.actor }}"
            echo "Started: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo "Profile: ${{ github.event.inputs.profile_url }}"
            echo "Days back: ${{ github.event.inputs.days }}"
            echo "Folder: ${{ github.event.inputs.folder }}"
            echo "====================================================="
            echo ""
          } > "$LOG_FILE"

      # ==============================================================
      # 1️⃣  התקנת תלויות
      # ==============================================================
      - name: Install dependencies
        continue-on-error: true
        shell: bash
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "🔧 [$(date -u +"%H:%M:%S")] Installing yt-dlp, rclone, msmtp, xmlstarlet..."
          curl -fsSL https://rclone.org/install.sh | sudo bash
          sudo apt-get update -qq && sudo apt-get install -y -qq msmtp msmtp-mta xmlstarlet
          sudo curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp" -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          yt-dlp --version
          echo "✅ Dependencies installed"

      # ==============================================================
      # 2️⃣  קונפיג rclone
      # ==============================================================
      - name: Configure rclone
        continue-on-error: true
        shell: bash
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "🔧 [$(date -u +"%H:%M:%S")] Configuring rclone..."
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF
          rclone lsd gdrive: | head -5
          echo "✅ rclone configured"

      # ==============================================================
      # 3️⃣  שליפת ציוצי וידאו דרך Nitter (ללא pipes שבורים)
      # ==============================================================
      - name: Fetch video tweets via Nitter (file-based parsing)
        continue-on-error: true
        id: fetch_videos
        shell: bash
        env:
          PROFILE_URL: ${{ github.event.inputs.profile_url }}
          DAYS: ${{ github.event.inputs.days }}
          USER_FILENAME: ${{ github.event.inputs.filename }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "🚀 [$(date -u +"%H:%M:%S")] Fetching profile via Nitter instances..."
          set -e
          set -o pipefail

          USERNAME=$(echo "$PROFILE_URL" | sed -E 's|.*[/:]([^/?]+)(\?.*)?$|\1|')
          CUTOFF_TS=$(date -u -d "-${DAYS} days" +%s)
          
          TMP_DIR=$(mktemp -d)
          
          if [[ -n "$USER_FILENAME" ]]; then
            OUT_BASE="$USER_FILENAME"
          else
            OUT_BASE="${USERNAME}_videos_last_${DAYS}days_$(date -u +%Y%m%d)"
          fi
          OUT_TXT="${TMP_DIR}/${OUT_BASE}.txt"
          REMOTE_PATH="gdrive:${{ github.event.inputs.folder }}/${OUT_BASE}.txt"

          echo "   Username: $USERNAME"
          echo "   Cutoff: $(date -u -d @${CUTOFF_TS}) (TS: $CUTOFF_TS)"
          echo "   Output: ${OUT_BASE}.txt"

          # ---- רשימת מופעי Nitter ----
          NITTER_INSTANCES=(
            "https://nitter.net"
            "https://nitter.1d4.us"
            "https://nitter.fdn.fr"
            "https://nitter.kavin.rocks"
            "https://nitter.projectsegfau.lt"
            "https://nitter.unixfox.eu"
          )

          RSS_XML=""
          SUCCESS_INSTANCE=""

          for INSTANCE in "${NITTER_INSTANCES[@]}"; do
            URL="${INSTANCE}/${USERNAME}/rss"
            echo "   🔄 Trying: $URL"
            
            RESPONSE=$(curl -sL --retry 2 --retry-delay 3 \
              -H "User-Agent: Mozilla/5.0 (compatible; GitHub Actions Nitter Client)" \
              -H "Accept: application/xml, application/rss+xml, text/xml" \
              "$URL" --max-time 20 --connect-timeout 10)
            
            if echo "$RESPONSE" | grep -qE "^<\?xml|^<rss"; then
              RSS_XML="$RESPONSE"
              SUCCESS_INSTANCE="$INSTANCE"
              echo "   ✅ Success with: $INSTANCE"
              break
            else
              echo "   ⚠️ Failed/Empty: $INSTANCE (first 100 chars: $(echo "$RESPONSE" | head -c 100))"
            fi
          done

          if [[ -z "$RSS_XML" ]]; then
            echo "❌ All Nitter instances failed or blocked."
            echo "STATUS=failed" >> $GITHUB_OUTPUT
            rm -rf "$TMP_DIR"
            exit 0
          fi

          echo "   Using instance: $SUCCESS_INSTANCE"

          # ---- שמירת XML לקובץ (למניעת broken pipes) ----
          RSS_FILE="${TMP_DIR}/feed.xml"
          echo "$RSS_XML" > "$RSS_FILE"

          # ---- פרסור XML לקובץ ביניים (שורה אחת לפריט: pubDate|link|description) ----
          PARSED_FILE="${TMP_DIR}/parsed.txt"
          # xmlstarlet: לכל item מדפיס pubDate|link|description (עם נרמול רווחים)
          xmlstarlet sel -T -t \
            -m "//item" \
            -v "pubDate" -o "|" \
            -v "link" -o "|" \
            -v "description" -n \
            "$RSS_FILE" 2>/dev/null | sed 's/|/|/g' > "$PARSED_FILE"

          # ---- עיבוד הקובץ המפורסר (בלי pipes, בלי subshells) ----
          > "$OUT_TXT"  # ריק
          while IFS='|' read -r PUBDATE LINK DESC; do
            # דילוג על שורות ריקות
            [[ -z "$PUBDATE" ]] && continue
            
            # המרת תאריך
            ITEM_TS=$(date -u -d "$PUBDATE" +%s 2>/dev/null || echo 0)
            [[ $ITEM_TS -lt $CUTOFF_TS ]] && continue
            
            # בדיקת וידאו בתיאור
            if echo "$DESC" | grep -qiE "video|mp4|m3u8|type=.video"; then
              # המרת קישור Nitter -> x.com
              X_LINK=$(echo "$LINK" | sed -E 's|https?://[^/]+/([^/]+)/status/([0-9]+).*|https://x.com/\1/status/\2|')
              echo "$X_LINK" >> "$OUT_TXT"
            fi
          done < "$PARSED_FILE"

          # הסרת כפילויות
          if [[ -s "$OUT_TXT" ]]; then
            sort -u "$OUT_TXT" -o "$OUT_TXT"
          fi

          if [[ ! -s "$OUT_TXT" ]]; then
            echo "⚠️ No video tweets found in last ${DAYS} days via Nitter."
            echo "# No video tweets found via Nitter for ${PROFILE_URL} in last ${DAYS} days (as of $(date -u))" > "$OUT_TXT"
            COUNT=0
          else
            COUNT=$(wc -l < "$OUT_TXT")
            echo "✅ Found $COUNT video tweet(s) via Nitter ($SUCCESS_INSTANCE)."
          fi

          # ---- העלאה ל-Drive ----
          echo "🚀 [$(date -u +"%H:%M:%S")] Uploading to Drive..."
          rclone copy "$OUT_TXT" "$REMOTE_PATH" --progress
          RCLONE_EXIT=$?
          [[ $RCLONE_EXIT -ne 0 ]] && { echo "❌ rclone exit: $RCLONE_EXIT"; exit $RCLONE_EXIT; }

          rm -rf "$TMP_DIR"
          echo "✅ [$(date -u +"%H:%M:%S")] SUCCESS"

          echo "STATUS=success" >> $GITHUB_OUTPUT
          echo "FILE_NAME=${OUT_BASE}.txt" >> $GITHUB_OUTPUT
          echo "TWEET_COUNT=$COUNT" >> $GITHUB_OUTPUT
          echo "REMOTE_PATH=$REMOTE_PATH" >> $GITHUB_OUTPUT

      # ==============================================================
      # 4️⃣  שליחת אימייל
      # ==============================================================
      - name: Send log email
        if: always()
        shell: bash
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          STATUS: ${{ steps.fetch_videos.outputs.STATUS }}
          FILE_NAME: ${{ steps.fetch_videos.outputs.FILE_NAME }}
          TWEET_COUNT: ${{ steps.fetch_videos.outputs.TWEET_COUNT }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "📧 [$(date -u +"%H:%M:%S")] Preparing email..."

          if [[ -z "$EMAIL_PASSWORD" ]]; then
            echo "⚠️ EMAIL_PASSWORD secret is EMPTY – skipping email send"
            exit 0
          fi

          mkdir -p ~/.msmtp
          cat > ~/.msmtprc <<EOF
          defaults
          auth on
          tls on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt
          logfile ~/.msmtp.log
          account gmail
          host $SMTP_SERVER
          port $SMTP_PORT
          from $EMAIL_FROM
          user $EMAIL_USER
          password $EMAIL_PASSWORD
          account default : gmail
          EOF
          chmod 600 ~/.msmtprc

          if [[ "$STATUS" == "success" ]]; then
            SUBJECT="✅ [GitHub Actions] X Profile Video List Ready - ${{ github.repository }}"
            BODY="הסריקה הושלמה בהצלחה (דרך Nitter - ללא Cookies).\n\n"
            BODY+="📁 קובץ: $FILE_NAME\n"
            BODY+="🔗 ציוצי וידאו שנמצאו: ${TWEET_COUNT:-0}\n"
            BODY+="🛠️ שיטה: Nitter Public Instances (RSS)\n"
            BODY+="📂 תיקייה: ${{ github.event.inputs.folder }}\n"
            BODY+="👤 פרופיל: ${{ github.event.inputs.profile_url }}\n"
            BODY+="📅 טווח: ${{ github.event.inputs.days }} ימים אחורה\n"
            BODY+="🏃 Run: ${{ github.run_id }} (${{ github.run_number }})\n"
            BODY+="⏱️ זמן: $(date -u +"%Y-%m-%d %H:%M:%S UTC")\n"
          else
            SUBJECT="❌ [GitHub Actions] X Profile Video List FAILED - ${{ github.repository }}"
            BODY="הסריקה נכשלה. מצורף לוג מלא.\n\n"
            BODY+="👤 פרופיל: ${{ github.event.inputs.profile_url }}\n"
            BODY+="🏃 Run: ${{ github.run_id }} (${{ github.run_number }})\n"
            BODY+="⏱️ זמן: $(date -u +"%Y-%m-%d %H:%M:%S UTC")\n"
          fi

          BODY+="\n--- Last 60 lines of log ---\n"
          BODY+=$(tail -60 "$LOG_FILE")

          echo -e "Subject: $SUBJECT\nFrom: $EMAIL_FROM\nTo: $EMAIL_TO\nContent-Type: text/plain; charset=UTF-8\n\n$BODY" | msmtp -a gmail "$EMAIL_TO"
          echo "✅ Email sent to $EMAIL_TO"

      # ==============================================================
      # 5️⃣  העלאת לוג כ-Artifact
      # ==============================================================
      - name: Upload log as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-log-${{ github.run_id }}
          path: ${{ runner.temp }}/workflow_log.txt
          retention-days: 7
          if-no-files-found: warn

      # ==============================================================
      # 6️⃣  סיכום סופי
      # ==============================================================
      - name: Final summary
        if: always()
        shell: bash
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "=== FINAL SUMMARY ==="
          echo "Run: ${{ github.run_id }}"
          echo "Status: ${{ steps.fetch_videos.outputs.STATUS || 'failed' }}"
          echo "Tweets found: ${{ steps.fetch_videos.outputs.TWEET_COUNT || '0' }}"
          echo "Log lines: $(wc -l < "$LOG_FILE")"
          echo "====================="
          if [[ "${{ steps.fetch_videos.outputs.STATUS }}" != "success" ]]; then
            exit 1
          fi

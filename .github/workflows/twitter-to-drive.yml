name: X/Twitter Video → Google Drive (Robust + Logs + Email + Artifact)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "קישור לציוץ (x.com/.../status/...)"
        required: true
        default: ""
      folder:
        description: "תיקיית יעד ב‑Google Drive"
        required: true
        default: "TwitterDownloads"
      filename:
        description: "שם בסיס ל‑ZIP (ריק = אוטומטי)"
        required: false
        default: ""
      cookies:
        description: "Cookies (Netscape format) – אופציונלי"
        required: false
        default: ""

env:
  EMAIL_TO: "p0556722432@gmail.com"
  EMAIL_FROM: "p0556722432@gmail.com"
  SMTP_SERVER: "smtp.gmail.com"
  SMTP_PORT: "587"
  EMAIL_USER: "p0556722432@gmail.com"

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read

    steps:
      # --------------------------------------------------------------
      # 1️⃣  התקנת תלויות + יצירת לוג (השלב הראשון שרץ בוודאות)
      # --------------------------------------------------------------
      - name: Install dependencies & Init log
        continue-on-error: true
        shell: bash
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "=== X/Twitter Downloader Log ==="
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "Repo: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Started: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "URL: ${{ github.event.inputs.url }}"
          echo "Folder: ${{ github.event.inputs.folder }}"
          echo "Filename: ${{ github.event.inputs.filename }}"
          echo "Has Cookies: ${{ github.event.inputs.cookies != '' && 'YES' || 'NO' }}"
          echo "========================================"
          echo ""
          
          echo "🔧 [$(date -u +"%H:%M:%S")] Installing dependencies..."
          curl -fsSL https://rclone.org/install.sh | sudo bash
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg msmtp msmtp-mta
          pip install -q -U yt-dlp
          echo "✅ Dependencies installed"

      # --------------------------------------------------------------
      # 2️⃣  קונפיג rclone
      # --------------------------------------------------------------
      - name: Configure rclone
        continue-on-error: true
        shell: bash
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "🔧 [$(date -u +"%H:%M:%S")] Configuring rclone..."
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          scope = drive.file
          token = $RCLONE_GDRIVE_TOKEN
          EOF
          rclone lsd gdrive: | head -5
          echo "✅ rclone configured"

      # --------------------------------------------------------------
      # 3️⃣  קביעת שמות (כותרת מה‑yt-dlp)
      # --------------------------------------------------------------
      - name: Determine output names
        continue-on-error: true
        id: names
        shell: bash
        env:
          USER_NAME: ${{ github.event.inputs.filename }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "🔧 [$(date -u +"%H:%M:%S")] Determining names..."
          TITLE=$(yt-dlp --skip-download --print "%(title)s [%(id)s]" "${{ github.event.inputs.url }}" 2>&1 | head -1)
          echo "   Raw title: $TITLE"
          SAFE_TITLE=$(echo "$TITLE" | sed 's/[\\/:*?"<>|]/_/g' | cut -c1-180)
          BASE_NAME="${USER_NAME:-$SAFE_TITLE}"
          ZIP_NAME="${BASE_NAME}.zip"
          REMOTE_PATH="gdrive:${{ github.event.inputs.folder }}/$ZIP_NAME"
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "remote_path=$REMOTE_PATH" >> $GITHUB_OUTPUT
          echo "   ZIP: $ZIP_NAME"
          echo "✅ Names determined"

      # --------------------------------------------------------------
      # 4️⃣  מחיקת ZIP קודם
      # --------------------------------------------------------------
      - name: Remove previous ZIP
        continue-on-error: true
        shell: bash
        env:
          REMOTE_PATH: ${{ steps.names.outputs.remote_path }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "🔧 [$(date -u +"%H:%M:%S")] Checking old ZIP..."
          if rclone lsf "$REMOTE_PATH" > /dev/null 2>&1; then
            rclone delete "$REMOTE_PATH"
            echo "   Deleted."
          else
            echo "   None found."
          fi

      # --------------------------------------------------------------
      # 5️⃣  הורדה → Zip → העלאה (השלב המרכזי)
      # --------------------------------------------------------------
      - name: Download → Zip → Upload
        continue-on-error: true
        id: dl_upload
        shell: bash
        env:
          TWEET_URL: ${{ github.event.inputs.url }}
          ZIP_NAME: ${{ steps.names.outputs.zip_name }}
          DEST_PATH: ${{ steps.names.outputs.remote_path }}
          COOKIES: ${{ github.event.inputs.cookies }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "🚀 [$(date -u +"%H:%M:%S")] Starting download/upload..."
          set -e
          set -o pipefail

          TMP_DIR=$(mktemp -d)
          TMP_ZIP="${TMP_DIR}/${ZIP_NAME}"
          COOKIE_FILE=""

          echo "   Work dir: $TMP_DIR"

          if [[ -n "$COOKIES" ]]; then
            COOKIE_FILE="${TMP_DIR}/cookies.txt"
            echo "$COOKIES" > "$COOKIE_FILE"
            echo "   Cookies file ready"
          fi

          # ---- הורדה ----
          echo "⬇️ [$(date -u +"%H:%M:%S")] Downloading with yt-dlp..."
          YTDLP_ARGS=(
            --no-warnings --progress --merge-output-format mp4
            -o "${TMP_DIR}/%(title)s [%(id)s].%(ext)s"
            --sleep-interval 3 --max-sleep-interval 8
            --retries 3 --fragment-retries 3 --extractor-retries 3
          )
          [[ -n "$COOKIE_FILE" ]] && YTDLP_ARGS+=(--cookies "$COOKIE_FILE")

          yt-dlp "${YTDLP_ARGS[@]}" "$TWEET_URL"
          YT_DLP_EXIT=$?
          [[ $YT_DLP_EXIT -ne 0 ]] && { echo "❌ yt-dlp exit: $YT_DLP_EXIT"; exit $YT_DLP_EXIT; }

          # ---- מציאת קובץ ----
          DOWNLOADED=$(find "$TMP_DIR" -type f \( -name "*.mp4" -o -name "*.mkv" -o -name "*.webm" -o -name "*.m4v" \) | head -n1)
          [[ ! -s "$DOWNLOADED" ]] && { echo "❌ No video file found"; ls -la "$TMP_DIR"; exit 1; }
          ORIGINAL_NAME=$(basename "$DOWNLOADED")
          echo "   Found: $ORIGINAL_NAME ($(stat -c%s "$DOWNLOADED") bytes)"

          # ---- ZIP ----
          cp "$DOWNLOADED" "${TMP_DIR}/${ORIGINAL_NAME}"
          (cd "$TMP_DIR" && zip -j -q "$TMP_ZIP" "$ORIGINAL_NAME")
          [[ ! -s "$TMP_ZIP" ]] && { echo "❌ Zip failed"; exit 1; }
          ZIP_SIZE=$(stat -c%s "$TMP_ZIP")
          echo "   ZIP: $ZIP_NAME ($ZIP_SIZE bytes)"

          # ---- העלאה ----
          echo "🚀 [$(date -u +"%H:%M:%S")] Uploading to Drive..."
          rclone copy "$TMP_ZIP" "$DEST_PATH" --progress
          RCLONE_EXIT=$?
          [[ $RCLONE_EXIT -ne 0 ]] && { echo "❌ rclone exit: $RCLONE_EXIT"; exit $RCLONE_EXIT; }

          rm -rf "$TMP_DIR"
          echo "✅ [$(date -u +"%H:%M:%S")] SUCCESS"

          # פלטים לשלב האימייל
          echo "STATUS=success" >> $GITHUB_OUTPUT
          echo "FILE_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "FILE_SIZE=$ZIP_SIZE" >> $GITHUB_OUTPUT

      # --------------------------------------------------------------
      # 6️⃣  שליחת אימייל (רץ תמיד, עצמאי לחלוטין)
      # --------------------------------------------------------------
      - name: Send log email (self-contained)
        if: always()
        shell: bash
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          STATUS: ${{ steps.dl_upload.outputs.STATUS }}
          FILE_NAME: ${{ steps.dl_upload.outputs.FILE_NAME }}
          FILE_SIZE: ${{ steps.dl_upload.outputs.FILE_SIZE }}
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "📧 [$(date -u +"%H:%M:%S")] Preparing email..."

          if [[ -z "$EMAIL_PASSWORD" ]]; then
            echo "⚠️ EMAIL_PASSWORD secret is EMPTY – skipping email send"
            exit 0
          fi

          # הגדרת msmtp
          mkdir -p ~/.msmtp
          cat > ~/.msmtprc <<EOF
          defaults
          auth on
          tls on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt
          logfile ~/.msmtp.log
          account gmail
          host $SMTP_SERVER
          port $SMTP_PORT
          from $EMAIL_FROM
          user $EMAIL_USER
          password $EMAIL_PASSWORD
          account default : gmail
          EOF
          chmod 600 ~/.msmtprc

          # בניית הודעה
          if [[ "$STATUS" == "success" ]]; then
            SUBJECT="✅ [GitHub Actions] X/Twitter Download SUCCESS - ${{ github.repository }}"
            BODY="ההורדה וההעלאה הושלמו בהצלחה.\n\n"
            BODY+="📁 קובץ: $FILE_NAME\n"
            BODY+="📦 גודל: $(numfmt --to=iec $FILE_SIZE 2>/dev/null || echo $FILE_SIZE bytes)\n"
            BODY+="📂 תיקייה: ${{ github.event.inputs.folder }}\n"
            BODY+="🔗 ציוץ: ${{ github.event.inputs.url }}\n"
            BODY+="🏃 Run: ${{ github.run_id }} (${{ github.run_number }})\n"
            BODY+="⏱️ זמן: $(date -u +"%Y-%m-%d %H:%M:%S UTC")\n"
          else
            SUBJECT="❌ [GitHub Actions] X/Twitter Download FAILED - ${{ github.repository }}"
            BODY="ההורדה נכשלה. מצורף לוג מלא.\n\n"
            BODY+="🔗 ציוץ: ${{ github.event.inputs.url }}\n"
            BODY+="🏃 Run: ${{ github.run_id }} (${{ github.run_number }})\n"
            BODY+="⏱️ זמן: $(date -u +"%Y-%m-%d %H:%M:%S UTC")\n"
            BODY+="🔍 ראה לוג מצורף.\n"
          fi

          BODY+="\n--- Last 60 lines of log ---\n"
          BODY+=$(tail -60 "$LOG_FILE")

          echo -e "Subject: $SUBJECT\nFrom: $EMAIL_FROM\nTo: $EMAIL_TO\nContent-Type: text/plain; charset=UTF-8\n\n$BODY" | msmtp -a gmail "$EMAIL_TO"
          echo "✅ Email sent to $EMAIL_TO"

      # --------------------------------------------------------------
      # 7️⃣  העלאת הלוג כ‑Artifact (גיבוי – תמיד עובד)
      # --------------------------------------------------------------
      - name: Upload log as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-log-${{ github.run_id }}
          path: ${{ runner.temp }}/workflow_log.txt
          retention-days: 7
          if-no-files-found: warn

      # --------------------------------------------------------------
      # 8️⃣  סיכום סופי – קובע צבע הריצה
      # --------------------------------------------------------------
      - name: Final summary
        if: always()
        shell: bash
        run: |
          LOG_FILE="$RUNNER_TEMP/workflow_log.txt"
          exec >> "$LOG_FILE" 2>&1
          echo "=== FINAL SUMMARY ==="
          echo "Run: ${{ github.run_id }}"
          echo "Status: ${{ steps.dl_upload.outputs.STATUS || 'failed' }}"
          echo "Log lines: $(wc -l < "$LOG_FILE")"
          echo "====================="
          if [[ "${{ steps.dl_upload.outputs.STATUS }}" != "success" ]]; then
            echo "❌ Job failed – check email or download log artifact"
            exit 1
          fi
